name: "Set GitHub Secret"
description: "Set a GitHub Secret from GitHub Actions (supports repository, organisation and environment secrets)"
author: "DCx7C5"


inputs:
  secret-name:
    required: true
    description: "Name of GitHub Secret to create or update"
  body:
    required: true
    description: "The value for the secret (reads from standard input if not specified)"
  repo:
    required: false
    description: "Set repository secret (defaults to current repository)"
    default: ''
  env:
    required: false
    description: "Set deployment environment secret"
    default: ''
  org:
    required: false
    description: "Name of the organisation to store the secret in (defaults to current organisation based on variable_type)"
    default: ''
  repos:
    required: false
    description: "New-line separated list of repositories to set the secret in (only for organisation secrets, defaults to all repositories in the organisation)"
    default: ''
  no-repos-select:
    required: false
    description: "Will not select any repositories to set the secret in"
    default: 'false'
  visibility:
    required: false
    description: "Visibility of the secret in the selected repositories (only for organisation secrets, (all|private|selected) defaults to 'all')"
    default: 'all'
  user:
    required: false
    description: "Set a user secret (GitHub Enterprise Server only)"
    default: 'false'
  app:
    required: false
    description: "Set the application for a secret: {actions|codespaces|dependabot}"
    default: ''
  print:
    required: false
    description: "Print the encrypted, base64-encoded value"
    default: 'false'
  gh-token:
    required: false
    description: "GitHub Token with permissions to manage secrets (usually GITHUB_TOKEN)"
    default: ''
  exit_on_error:
    required: false
    description: "Whether the action should fail if the secret cannot be retrieved or set (true/false, defaults to 'true')"
    default: 'true'


outputs:
  secret-name:
    description: "Name of the GitHub Secret that was created or updated"
    value: ${{ inputs.secret-name }}
  encrypted-value:
    description: "Value of the GitHub Secret that was created or updated (only if 'print' input is set to 'true')"
    value: ${{ steps.print_value.outputs.secret_value || '' }}
  success:
    description: "Whether the secret was successfully created or updated"
    value: ${{ steps.set_secret.outcome.success || 'false' }}


runs:
  using: composite
  steps:
    - name: Validate & Mask Inputs
      id: validate_and_mask
      shell: bash
      env:
        EONERROR: "${{ inputs.exit_on_error }}"
      run: |
        if [[ -n '${{ inputs.body }}' ]]; then
          echo '::add-mask::${{ inputs.body }}'
        fi
        
        if [[ -n "${{ inputs.github_token }}" ]]; then 
          echo "::add-mask::${{ inputs.github_token }}"
        fi
        
        if [[ ! "${{ inputs.env != '' && 'true' }}${{ inputs.repo != '' && 'true' }}${{ inputs.org != '' && 'true' }}" =~ ^true$ ]]; then
          echo "::error::Not more than one of 'env', 'repo' or 'org' can be set to a non-empty value" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ -n "${{ inputs.visibility }}" && ! "${{ inputs.visibility }}" =~ ^all|private|selected$ ]]; then
          echo "::error::Invalid visibility '${{ inputs.visibility }}'. Valid options are: all, private, selected" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ "${{ inputs.exit_on_error }}" =~ ^true|false$ ]]; then
          echo "::error::Invalid value for 'exit_on_error': '${{ inputs.exit_on_error }}'. Valid options are: true, false" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        fi
        
        if [[ "${{ inputs.visibility }}" == "selected" && -z "${{ inputs.repos }}" ]]; then
          echo "::warning::Visibility 'selected' has no repositories specified"
        fi

    - name: Set GitHub Secret
      id: set_secret
      shell: bash
      env:
        EONERROR: "${{ inputs.exit_on_error }}"
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
        TYPE: >-
          ${{ case(
            inputs.env == 'true', '--env ${{ github.environment }}',
            inputs.org == 'true', '--org ${{ github.repository_owner }}',
            inputs.repo == 'true', '--repo ${{ github.repository }}',
            inputs.env != '', '--env ${{ inputs.env }}',
            inputs.org != '', '--org ${{ inputs.org }}', 
            inputs.repo != '', '--repo ${{ inputs.repo }}',
            '--repo ${{ github.repository }}'
          ) }}
        TYPE_OPT: >-
          ${{ case( 
            inputs.org != '' && inputs.repos != '', '--repos $(echo "${{ inputs.repos }}" | tr '\n\ ' ',' | sed 's/,$//")',
            inputs.org != '' && inputs.no_repos_select == 'true', '--no-repos-select',
          ) }}

      run: |
        GH_CMD+=(${TYPE} ${TYPE_OPT}) 
        
        [[ -n "${{ inputs.visibility }}" ]] && GH_CMD+=(--visibility "${{ inputs.visibility }}")
        
        [[ "${{ inputs.user }}" == 'true' ]] && GH_CMD+=(--user)
        [[ -n "${{ inputs.app }}" ]] && GH_CMD+=(--app "${{ inputs.app }}")
        
        printf '%s' "${{ inputs.body }}" | gh secret set "${{ inputs.secret-name }}" "${GH_CMD[@]}" || {
          echo "::error::Failed to set GitHub Secret" >&2
        }
        status=$?
        [[ $status -ne 0 ]] && [[ "$EONERROR" =~ ^true$ ]] && exit $status
        [[ $status -eq 0 ]] && echo "success=true" >> "$GITHUB_OUTPUT" || echo "success=false" >> "$GITHUB_OUTPUT"
        
        echo "::debug::Successfully set GitHub Secret '${{ inputs.secret-name }}' with arguments: ${GH_CMD[*]}"

    - name: Print encrypted, base64-encoded value
      if: inputs.print == 'true'
      id: print_value
      shell: bash
      env:
        EONERROR: "${{ inputs.exit_on_error }}"
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
      run: |
        
        echo "secret_value=$(printf '%s' "${{ inputs.body }}" | gh secret set --no-store)" >> "$GITHUB_OUTPUT"
        
        echo "::debug::Successfully printed encrypted, base64-encoded value of the secret to outputs.secret_value"
