name: "Delete GitHub Actions Workflow Runs"
description: "Deletes GitHub Actions workflow runs for one or more statuses"
author: "DCx7C5"

branding:
  icon: "trash-2"
  color: "red"


inputs:
  keep:
    description: "Maximum number of workflow runs to keep"
    required: false
    default: ''
  action:
    description: "Action to perform on workflow runs (currently only 'delete' is supported)"
    required: false
    default: 'delete'
  workflow-status:
    description: "New-line separated list of workflow statuses to delete (e.g. 'failure' or 'cancelled')"
    required: true
  github-token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ''


outputs:
  deleted:
    description: "Whether any workflow files were deleted"
    value: ${{ steps.delete_workflow_runs.outputs.deleted }}


runs:
  using: composite
  steps:
    - id: delete_workflow_runs
      if: inputs.action == 'delete'
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
        WORKFLOW_STATUSES: ${{ inputs.workflow-status }}
        GH_TOKEN: ${{ inputs.github-token || env.GH_TOKEN || github.token }}
        KEEP: ${{ inputs.keep }}
      run: |
        set -euo pipefail
        deleted=false

        while IFS= read -r status; do
          status="$(echo "$status" | xargs)"
          [[ -z "$status" ]] && continue

          echo "::notice::Deleting workflow runs with status: $status"

          if [[ -n "$KEEP" && "$KEEP" =~ ^[0-9]+$ && "$KEEP" -gt 0 ]]; then
            # Get all run IDs sorted by creation (oldest first)
            run_ids_sorted=$(gh run list --status "$status" --limit 1000 --json databaseId,createdAt --jq 'sort_by(.createdAt) | .[].databaseId')
            total=$(echo "$run_ids_sorted" | grep -c . || true)
            if (( total > KEEP )); then
              to_delete=$((total - KEEP))
              echo "Keeping $KEEP most recent runs, deleting $to_delete oldest runs."
              run_ids_to_delete=$(echo "$run_ids_sorted" | head -n "$to_delete")
            else
              echo "Nothing to delete for status $status (total: $total, keep: $KEEP)"
              continue
            fi
          else
            run_ids_to_delete=$(gh run list --status "$status" --limit 1000 --json databaseId --jq '.[].databaseId')
          fi

          [[ -z "$run_ids_to_delete" ]] && continue

          deleted=true
          while IFS= read -r run_id; do
            [[ -z "$run_id" ]] && continue
            gh run delete "$run_id"
          done <<< "$run_ids_to_delete"
        done <<< "$WORKFLOW_STATUSES"

        echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
