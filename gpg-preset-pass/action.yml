name: "Preset GPG passphrase in gpg-agent cache for subsequent steps"
description: "Pre-cache GPG passphrase in gpg-agent cache for subsequent steps that require signing or decryption, to avoid passphrase prompts and enable non-interactive use of GPG keys in CI workflows"
author: "DCx7C5"


inputs:
  key-id:
    required: false
    default: ''
    description: "Key ID or fingerprint of the GPG key to preset passphrase for (if not set, passphrase will be preset for all keys in GNUPGHOME)"
  pass:
    required: true
    description: "Passphrase for the GPG key to cache in gpg-agent (will be masked in logs)"
  grip:
    required: false
    default: ''
    description: "Keygrip of the GPG key to preset passphrase for (if not set, passphrase will be preset for all keys in GNUPGHOME)"
  gpg-home:
    required: false
    default: ''
    description: "Path to GPG Home Directory (optional, can also be set via GNUPGHOME env variable)"
  forget:
    required: false
    default: ''
    description: "Makes the opposite, deletes cache again."


runs:
  using: composite
  steps:
    - name: Pre-cache GPG passphrase in gpg-agent
      id: precache_passphrase
      if: inputs.forget != 'true'
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg-home || env.GNUPGHOME }}
      run: |
        # Pre-cache GPG passphrase in gpg-agent
        set -euo pipefail
        
        if [[ -n "${{ inputs.grip }}" ]]; then
          echo "::add-mask::${{ inputs.grip }}"  # Mask the keygrip if provided
        fi
        
        if [[ -z "${{ inputs.grip }}" && -z "${{ inputs.key-id }}" ]]; then
          KEYGRIPS=$(gpg --with-colons --list-secret-keys | awk -F: '/^grp:/ {print $10}')
        elif [[ -z "${{ inputs.grip }}" && -n "${{ inputs.key-id }}" ]]; then
          KEYGRIPS=$(gpg --with-colons --list-secret-keys "${{ inputs.key-id }}" | awk -F: '/^grp:/ {print $10}')
        elif [[ -n "${{ inputs.grip }}" ]]; then
          KEYGRIPS="${{ inputs.grip }}"
        fi  
        
        if [[ -n "$KEYGRIPS" ]]; then
          echo "::notice::Pre-caching GPG passphrase for keygrips: $KEYGRIPS"
        else
          echo "::warning::No keygrips found to pre-cache passphrase for" >&2
          exit 0
        fi
        
        while IFS= read -r KEYGRIP; do
          echo "${{ inputs.pass }}" | /usr/lib/gnupg/gpg-preset-passphrase --preset "${KEYGRIP}" || true
        done <<< "$KEYGRIPS"
        
        echo "::notice::GPG passphrase pre-cached successfully in gpg-agent cache"

    - name: Forget Pre-Cached passphrase input
      id: forget_precached
      if: inputs.forget == 'true'
      shell: bash
      run: |
        # Forget the pre-cached GPG passphrase from gpg-agent cache
        set -euo pipefail
        
        KEYGRIPS=$(gpg --with-colons --list-secret-keys | awk -F: '/^grp:/ {print $10}')
        while IFS= read -r KEYGRIP; do
          /usr/lib/gnupg/gpg-preset-passphrase --forget "${KEYGRIP}" || true
        done <<< "$KEYGRIPS"
        
        echo "::notice::GPG passphrase deleted successfully in gpg-agent cache"
