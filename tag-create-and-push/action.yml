name: "Create & Push Signed Tag"
description: "Create a new annotated tag with GPG signature and push it to the repository"
author: "DCx7C5"

branding:
  icon: "git-commit"
  color: "orange"


inputs:
  version:
    description: "The new version to use (e.g. v1.2.3 or 1.2.3)"
    required: true
  commit_msg:
    description: "Commit message for the annotated tag"
    required: false
    default: "Release ${{ inputs.version }}"
  fingerprint:
    description: "GPG key fingerprint or email to use for signing the tag (optional)"
    required: false
    default: ""
  pass:
    description: "Passphrase for the GPG key (if needed, optional) - will be masked in logs"
    required: false
    default: ""
  sign:
    description: "Whether to sign the tag with GPG (default: true)"
    required: false
    default: 'true'
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: ''

outputs:
  tag:
    description: "The created tag name"
    value: ${{ steps.tag_create.outputs.tag }}


runs:
  using: composite
  steps:
    - name: Mask & Validate inputs
      id: mask_and_validate
      shell: bash
      run: |
        set -euo pipefail
        if [ -n '${{ inputs.pass }}' ]; then
          echo '::add-mask::${{ inputs.pass }}'
        fi
        
        VERSION='${{ inputs.version }}'
        if [ -z "$VERSION" ]; then
          echo "::error::version input is required" >&2
          exit 1
        fi
        
        echo "::notice::Target tag: $VERSION"

    - name: Create & sign annotated tag
      id: tag_create
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        TAG: '${{ inputs.version }}'
        FINGERPRINT: '${{ inputs.fingerprint }}'
        PASS: '${{ inputs.pass }}'
        COMMIT_MSG: '${{ inputs.commit_msg }}'
        GPG_PINENTRY_MODE: loopback
      run: |
        set -euo pipefail
        trap 'unset PASS 2>/dev/null || true' EXIT
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi
        
        echo "::notice::Creating signed tag: $TAG"
        
        # Build git tag command
        TAG_ARGS=(-a "$TAG")
        
        if [ -n "$COMMIT_MSG" ]; then
          TAG_ARGS+=(-m "$COMMIT_MSG")
        fi
        
        if [ "${{ inputs.sign }}" != "true" ]; then
          echo "::notice::Signing is disabled, creating unsigned tag"
          TAG_ARGS=("${TAG_ARGS[@]/-a/-l}")
        else
          echo "::notice::Signing is enabled, creating signed tag"
          TAG_ARGS+=(-s)
        fi
                
        
        
        if [ -n "$FINGERPRINT" ]; then
          TAG_ARGS+=(-u "${FINGERPRINT:24:40}")
          echo "::notice::Using explicit key: $FINGERPRINT"
        else
          echo "::notice::Using default GPG key"
        fi
        
        # Create tag with passphrase if provided
        if [ -n "$PASS" ]; then
          # Use loopback mode to provide passphrase to gpg
          if echo "$PASS" | GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" --no-edit 2>&1; then
            echo "::notice::Signed tag created successfully: $TAG"
          else
            echo "::error::Failed to create signed tag" >&2
            exit 1
          fi
        else
          if git tag "${TAG_ARGS[@]}" --no-edit 2>&1; then
            echo "::notice::Signed tag created successfully: $TAG"
          else
            echo "::error::Failed to create signed tag" >&2
            exit 1
          fi
        fi
        
        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true
        
        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Create unsigned tag
      id: tag_create_unsigned
      shell: bash
      env:
        TAG: '${{ inputs.version }}'
        COMMIT_MSG: '${{ inputs.commit_msg }}'
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      run: |
        set -euo pipefail
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi
        
        echo "::notice::Creating unsigned tag: $TAG"
        
        TAG_ARGS=(-l "$TAG")
        
        if [ -n "$COMMIT_MSG" ]; then
          TAG_ARGS+=(-m "$COMMIT_MSG")
        fi
        
        if GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" --no-edit 2>&1; then
          echo "::notice::Unsigned tag created successfully: $TAG"
        else
          echo "::error::Failed to create unsigned tag" >&2
          exit 1
        fi
        
        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true
        
        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    
    - name: Create signed tag
      id: tag_create_signed
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        TAG: '${{ inputs.version }}'
        FINGERPRINT: '${{ inputs.fingerprint }}'
      run: |
        set -euo pipefail
        trap 'unset PASS 2>/dev/null || true' EXIT
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi
        
        echo "::notice::Creating signed tag: $TAG"
        
        # Build git tag command
        TAG_ARGS=(-a "$TAG")
        
        if [ -n "${{ inputs.commit_msg }}" ]; then
          TAG_ARGS+=(-m "${{ inputs.commit_msg }}")
        fi
        
        if [ -n "$FINGERPRINT" ]; then
          TAG_ARGS+=(-u "${FINGERPRINT:24}")
          echo "::notice::Using explicit key: $FINGERPRINT"
        else
          echo "::notice::Using default GPG key"
        fi
        
        # Create tag with passphrase if provided
        if [ -n "$PASS" ]; then
          # Use loopback mode to provide passphrase to gpg
          if echo "$PASS" | GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" -s --no-edit 2>&1; then
            echo "::notice::Signed tag created successfully: $TAG"
          else
            echo "::error::Failed to create signed tag" >&2
            exit 1
          fi
        else
          if git tag "${TAG_ARGS[@]}" -s --no-edit 2>&1; then
            echo "::notice::Signed tag created successfully: $TAG"
          else
            echo "::error::Failed to create signed tag" >&2
            exit 1
          fi
        fi
        
        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true
        
        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Push tag to repository
      shell: bash
      env:
        TAG: '${{ inputs.version }}'
      run: |
        set -euo pipefail
        
        if ! git push origin "$TAG"; then
          echo "::error::Failed to push tag to repository" >&2
          exit 1
        fi
        echo "::notice::Successfully pushed tag '$TAG' to repository"
