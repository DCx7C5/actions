name: "Test Arch Run Command Action"
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "The name of the Docker image to build and run"
        required: false
        default: 'arch-run-cmd'
        type: string
      image_version:
        description: "The version tag of the Docker image to build and run"
        required: false
        default: 'latest'
        type: string
      enable_ccache:
        description: "Enable ccache in the Arch Run Command Action"
        required: false
        default: true
        type: boolean
      run_with_sudo:
        description: "Whether to run the command with sudo inside the container (for testing root permissions)"
        required: false
        default: true
        type: boolean

  push:
    paths:
      - 'arch-run-cmd/**'
      - 'docker-build-image/**'
      - 'docker-push-image/**'
      - 'docker-run-image/**'



permissions:
  packages: write
  contents: write
  actions: write

jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ steps.app_token.outputs.token }}'

      - name: Test Arch Run Command Action
        id: test_arch_run_cmd
        uses: ./arch-run-cmd
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          gh_token: ${{ steps.app_token.outputs.token }}
          image_tag: ${{ inputs.image_tag || 'arch-run-cmd' }}
          image_version: ${{ inputs.image_version || 'latest' }}
          enable_ccache: ${{ inputs.enable_ccache }}
          working_directory: ${{ github.workspace }}
          gpg_key: ''
          gpg_key_id: ''
          gpg_keygrips: ''
          gpg_passhphrase: ''
          import_key_during_build: 'false'
          preset_passphrase_cache: 'false'
          run_with_sudo: 'false'
          command: 'ls -la / && whoami && echo "Hello from inside the Arch Linux container!"'
