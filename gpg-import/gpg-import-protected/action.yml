name: "Import protected GPG Key from file or inline variable"
description: "Import protected GPG key from file path or inline key material"
author: "DCx7C5"


inputs:
  gpg_key:
    required: true
    description: "GPG key path or inline variable"
  pass:
    required: true
    default: ''
    description: "Passphrase for the private key"
  gpg_home:
    required: false
    default: ''
    description: "Path to GPG Home Directory"
  type:
    required: false
    default: 'auto'
    description: "Set to true if gpg_key is file path or to inline if its an inline variable"


outputs:
  fingerprint:
    description: "Fingerprint of the imported GPG key"
    value: ${{ steps.import_protected_file.outputs.fingerprint || steps.import_protected_inline.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available after import"
    value: ${{ steps.import_protected_file.outputs.keys_total || steps.import_protected_inline.outputs.keys_total }}
  keys_public:
    description: "Number of public keys available after import"
    value: ${{ steps.import_protected_file.outputs.keys_public || steps.import_protected_inline.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys available after import"
    value: ${{ steps.import_protected_file.outputs.keys_secret || steps.import_protected_inline.outputs.keys_secret }}



runs:
  using: composite
  steps:
    - id: mask
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.pass }}" && -n "${{ inputs.gpg_key }}" ]]; then
          echo "::add-mask::${{ inputs.pass }}"
          echo "::add-mask::${{ inputs.gpg_key }}"
        fi

    - id: validate_type
      if: inputs.type == 'auto'
      shell: bash
      env:
        GPG_KEY: "${{ inputs.gpg_key }}"
      run: |
        set -euo pipefail
        if [[ -n "$GPG_KEY" && -f "$GPG_KEY" ]]; then
          echo "type=file" >> "$GITHUB_OUTPUT"
        elif [[ -n "$GPG_KEY" && ! -f "$GPG_KEY" ]]; then
          echo "type=inline" >> "$GITHUB_OUTPUT"
        fi

    - id: import_protected_file
      if: steps.validate_type.outputs.type == 'file' || inputs.type == 'file'
      shell: bash
      env:
        GNUPGHOME: "${{ inputs.gpg_home }}"
      run: |
        set -euo pipefail
        GNUPGHOME=${GNUPGHOME:-"${{ github.workspace }}/.gnupg"}
        
        key_input="${{ inputs.gpg_key }}"
        passphrase="${{ inputs.pass }}"
        
        # Import with passphrase via fd 0
        printf '%s\n' "$passphrase" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --import "$key_input"

        # Extract key information
        fingerprint=$(gpg --batch --with-colons --list-keys | grep '^fpr:' | head -1 | cut -d: -f10)
        keys_total=$(gpg --batch --with-colons --list-keys | grep -c '^pub:' || echo 0)
        keys_public=$(gpg --batch --with-colons --list-public-keys | grep -c '^pub:' || echo 0)
        keys_secret=$(gpg --batch --with-colons --list-secret-keys | grep -c '^sec:' || echo 0)

        # Output results
        {
          echo "fingerprint=${fingerprint}"
          echo "keys_total=${keys_total}"
          echo "keys_public=${keys_public}"
          echo "keys_secret=${keys_secret}"
        } >> "$GITHUB_OUTPUT"
        
        # Output script
        echo "::group::Import Summary (Protected Key from File)"
        echo "✓ Protected GPG key imported successfully"
        echo "  Fingerprint: ${fingerprint}"
        echo "  Total keys: ${keys_total}"
        echo "  Public keys: ${keys_public}"
        echo "  Secret keys: ${keys_secret}"
        echo "::endgroup::"

    - id: import_protected_inline
      if: steps.validate_type.outputs.type == 'inline' || inputs.type == 'inline' || inputs.type == 'secret'
      shell: bash
      env:
        GNUPGHOME: "${{ inputs.gpg_home }}"
      run: |
        set -euo pipefail
        GNUPGHOME=${GNUPGHOME:-"${{ github.workspace }}/.gnupg"}
        
        key_input="${{ inputs.gpg_key }}"
        passphrase="${{ inputs.pass }}"
        
        # Create temporary file for inline key
        key_tmp="$(mktemp)"
        trap 'rm -f "$key_tmp"' EXIT
        printf '%s\n' "$key_input" > "$key_tmp"
        
        # Import with passphrase via fd 0
        printf '%s\n' "$passphrase" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --import "$key_tmp"
        
        # Extract key information
        fingerprint=$(gpg --batch --with-colons --list-keys | grep '^fpr:' | head -1 | cut -d: -f10)
        keys_total=$(gpg --batch --with-colons --list-keys | grep -c '^pub:' || echo 0)
        keys_public=$(gpg --batch --with-colons --list-public-keys | grep -c '^pub:' || echo 0)
        keys_secret=$(gpg --batch --with-colons --list-secret-keys | grep -c '^sec:' || echo 0)

        # Output results
        {
          echo "fingerprint=${fingerprint}"
          echo "keys_total=${keys_total}"
          echo "keys_public=${keys_public}"
          echo "keys_secret=${keys_secret}"
        } >> "$GITHUB_OUTPUT"
        
        # Output script
        echo "::group::Import Summary (Protected Key from Inline)"
        echo "✓ Protected GPG key imported successfully"
        echo "  Fingerprint: ${fingerprint}"
        echo "  Total keys: ${keys_total}"
        echo "  Public keys: ${keys_public}"
        echo "  Secret keys: ${keys_secret}"
        echo "::endgroup::"
