name: "Update package upstream changes with PKGBUILDs repository"
description: "GitHub Action to update package changes from an upstream repository to this PKGBUILDs repository. It fetches changes from the specified upstream repository and ref, compares the package directories, and commits any differences with appropriate commit messages based on the change type (new/changed)."
author: "DCx7C5"

branding:
  icon: "git-merge"
  color: "blue"


inputs:
  pkg_name:
    description: "Target package name in this repository"
    required: true
  remote_repo:
    required: true
    description: "Remote repository <User/Repo>"
  remote_name:
    required: true
    description: "Name of the remote to add for the AUR repository (default: upstream)"
  remote_ref:
    required: true
    description: "Git reference to compare against (default: main)"
  base_ref:
    required: false
    description: "Git reference for base repository"
    default: 'HEAD'


outputs:
  changed:
    description: "Whether any package files were changed and committed"
    value: ${{ steps.sync_pkg.outputs.changed }}
  commit_sha:
    description: "Commit SHA if a commit was created"
    value: ${{ steps.sync_pkg.outputs.commit_sha }}


runs:
  using: composite
  steps:
    - id: sync_pkg
      shell: bash
      env:
        PKG_NAME: "${{ inputs.pkg_name }}"
        REMOTE_NAME: "${{ inputs.remote_name }}"
        REMOTE_REF: "${{ inputs.remote_ref }}"
        BASE_REF: "${{ inputs.base_ref }}"
      run: |
        set -euo pipefail

        mapfile -t changed_files < <(git diff --name-only "$BASE_REF" "$REMOTE_NAME/$REMOTE_REF" -- "$PKG_NAME")
        if (( ${#changed_files[@]} == 0 )); then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        for f in "${changed_files[@]}"; do
          [[ -z "$f" ]] && continue
          git restore --source="$REMOTE_NAME/$REMOTE_REF" -- "$f"
        done
        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
