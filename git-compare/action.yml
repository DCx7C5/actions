name: "Compare Git Branches"
description: "Compare two Git branches and show the differences"
author: "DCx7C5"


inputs:
  base_branch:
    description: "The base branch to compare against (default: currently checked-out branch)"
    required: false
    default: "${{ github.ref_name }}"
  compare_branch:
    description: "The branch to compare with the base branch (default: upstream/main)"
    required: false
    default: "main"
  remote_name:
    description: "Name of the remote that contains the compare branch (default: upstream)"
    required: false
    default: "upstream"
  workspace_path:
    description: "Path to the Git repository (default: github.workspace)"
    required: false
    default: "${{ github.workspace }}"
  exclude_paths:
    description: "Newline-separated list of paths to exclude from comparison (not yet implemented in filtering)"
    required: false
    default: ""


runs:
  using: composite
  steps:
    - name: Determine branches
      id: branches
      shell: bash
      working-directory: ${{ inputs.workspace_path }}
      run: |
        BASE="${{ inputs.base_branch }}"
        COMPARE="${{ inputs.remote_name }}/${{ inputs.compare_branch }}"

        # Verify branches exist
        if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
          echo "::error::Base branch '$BASE' does not exist"
          exit 1
        fi
        if ! git rev-parse --verify "$COMPARE" >/dev/null 2>&1; then
          echo "::error::Compare branch '$COMPARE' does not exist"
          exit 1
        fi

        echo "base=$BASE" >> "$GITHUB_OUTPUT"
        echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"
        echo "Comparing: $BASE vs $COMPARE"

    - name: Find PKGBUILD-related differences
      id: diff
      shell: bash
      working-directory: ${{ inputs.workspace_path }}
      env:
        BASE: ${{ steps.branches.outputs.base }}
        COMPARE: ${{ steps.branches.outputs.compare }}
      run: |
        set -euo pipefail

        # All directories that contain PKGBUILD in either branch
        PKG_DIRS_BASE=$(git ls-tree -r --name-only "$BASE" | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sort -u)
        PKG_DIRS_COMPARE=$(git ls-tree -r --name-only "$COMPARE" | grep '/PKGBUILD$' | sed 's|/PKGBUILD$||' | sort -u)

        # New: exists in compare but not in base
        NEW_DIRS=$(comm -13 <(echo "$PKG_DIRS_BASE") <(echo "$PKG_DIRS_COMPARE") | sort -u)

        # Removed: exists in base but not in compare
        REMOVED_DIRS=$(comm -23 <(echo "$PKG_DIRS_BASE") <(echo "$PKG_DIRS_COMPARE") | sort -u)

        # Changed: PKGBUILD file differs between branches (and exists in both)
        CHANGED_DIRS=""
        for dir in $(comm -12 <(echo "$PKG_DIRS_BASE") <(echo "$PKG_DIRS_COMPARE")); do
          if ! git diff --quiet "$BASE" "$COMPARE" -- "$dir/PKGBUILD"; then
            CHANGED_DIRS="$CHANGED_DIRS$dir"$'\n'
          fi
        done
        CHANGED_DIRS=$(echo "$CHANGED_DIRS" | sort -u)

        # Output multi-line values safely
        {
          echo "new_dirs<<EOF"
          echo "$NEW_DIRS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "changed_dirs<<EOF"
          echo "$CHANGED_DIRS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "removed_dirs<<EOF"
          echo "$REMOVED_DIRS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        # Summary for logs
        echo "New package directories    : $(echo "$NEW_DIRS" | wc -l)"
        echo "Changed PKGBUILDs          : $(echo "$CHANGED_DIRS" | wc -l)"
        echo "Removed package directories: $(echo "$REMOVED_DIRS" | wc -l)"

    - name: Show full diff summary (optional - visible in logs)
      if: always()
      shell: bash
      working-directory: ${{ inputs.workspace_path }}
      run: |
        echo "Diff summary between ${{ steps.branches.outputs.base }} and ${{ steps.branches.outputs.compare }}:"
        git diff --name-status ${{ steps.branches.outputs.base }} ${{ steps.branches.outputs.compare }} -- '*/PKGBUILD'