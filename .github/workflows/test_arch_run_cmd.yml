name: "Test Arch Run Command Action"
on:
  workflow_dispatch:
  push:
    paths:
      - 'arch-run-cmd/**'


jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Arch Run Command Action
        uses: ./arch-run-cmd
        with:
          github_token: ${{ steps.app_token.outputs.token }}
          run_with_sudo: 'true'
          working_directory: ${{ github.workspace }}
          run: 'echo "Hello, World!"'

  test-sign-detached:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          method: 'inline'
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          delete_after_import: 'true'
          configure_git: 'true'
          setup_home: 'true'
          preset_pass: 'false'

      - name: Test Arch Run Command Action with Detached Signature
        uses: ./arch-run-cmd
        working-directory: ${{ github.workspace }}
        with:
          gpg_key_id: ${{ secrets.GPG_KEY_ID }}
          gpg_passhphrase: ${{ secrets.GPG_PASSPHRASE }}
          github_token: ${{ steps.app_token.outputs.token }}
          run_with_sudo: 'true'
          working_directory: ${{ github.workspace }}
          gpg_home: ${{ steps.gpg_import.outputs.gpg_home }}

        run: "printf '%s' '${{ secrets.GPG_PASSPHRASE }}' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user $GPG_KEY_ID --output message.txt.sig --detach-sig message.txt"
