name: "Telegram Notify Action (Secure)"
description: "Send Telegram messages from GitHub Actions with security hardening"
author: "DCx7C5"

inputs:
  tg-token:
    description: "Telegram Bot Token"
    required: true
  chat-id:
    description: "Chat ID (user, group or channel)"
    required: true
  repository:
    description: "GitHub repository (optional, defaults to current repository)"
    required: false
    default: '${{ github.repository }}'
  commit:
    description: "Git commit SHA (optional, defaults to current commit)"
    required: false
    default: '${{ github.sha }}'
  branch:
    description: "Git branch name (optional, defaults to current branch)"
    required: false
    default: '${{ github.ref_name }}'
  actor:
    description: "GitHub actor (optional, defaults to current actor)"
    required: false
    default: '${{ github.actor }}'
  fingerprint:
    description: "GPG fingerprint (optional, can be auto-detected)"
    required: true
    default: ''
  tag-name:
    description: "Git tag name (optional, can be auto-detected)"
    required: true
    default: ''
  release-name:
    description: "GitHub release name (optional, can be auto-detected)"
    required: true
    default: ''


runs:
  using: composite
  steps:
    - id: notify_release
      uses: DCx7C5/actions/tg-notify@v1
      with:
        parse-mode: 'HTML'
        chat-id: ${{ inputs.chat-id }}
        tg-token: ${{ inputs.tg-token }}
        message: |
          <b>🚀 New Signed Release Published!</b>

          <b>📦 Release Details:</b>
          - <b>Repository:</b> <code>${{ inputs.repository }}</code>
          - <b>Tag:</b> <code>${{ inputs.tag-name }}</code>
          - <b>Release Name:</b> <code>${{ inputs.release-name }}</code>
          - <b>Commit:</b> <code>${{ inputs.commit }}</code>
          - <b>Branch:</b> <code>${{ inputs.branch }}</code>
          - <b>Actor:</b> <code>${{ inputs.actor }}</code>

          <b>🔐 Signing:</b>
          - <b>GPG Fingerprint:</b> <code>${{ inputs.fingerprint }}</code>

          <b>🔗 Links:</b>
          <a href="https://github.com/${{ inputs.repository }}/releases/tag/${{ inputs.tag-name }}">View Release</a> | <a href="https://github.com/${{ inputs.repository }}/commit/${{ inputs.commit }}">View Commit</a>
        step-summary: |
          ## 🚀 New Signed Release Published!

          | Field | Value |
          |---|---|
          | **Repository** | ${{ inputs.repository }} |
          | **Tag** | ${{ inputs.tag-name }} |
          | **Release Name** | ${{ inputs.release-name }} |
          | **Branch** | ${{ inputs.branch }} |
          | **Commit** | ${{ inputs.commit }} |
          | **Actor** | ${{ inputs.actor }} |
          | **GPG Fingerprint** | ${{ inputs.fingerprint }} |

          🔗 [View Release](https://github.com/${{ inputs.repository }}/releases/tag/${{ inputs.tag-name }}) | [View Commit](https://github.com/${{ inputs.repository }}/commit/${{ inputs.commit }})
