#file: noinspection GithubFunctionSignatureValidation
name: "Test gh-variables in GitHub Actions"
on:
  workflow_dispatch:
  push:
    paths:
      - 'gh-variables/**'

permissions: 
  contents: write
  actions: write

jobs:
  
  create-testcases:
    runs-on: ubuntu-latest
    outputs:
      matrix_variables_set: ${{ steps.set_variables.outputs.matrix_variables_set }}
      matrix_variables_get: ${{ steps.set_variables.outputs.matrix_variables_get }}
      matrix_variables_delete: ${{ steps.set_variables.outputs.matrix_variables_delete }}
    steps:

      - name: Prepare Test Cases
        id: set_variables
        shell: bash
        run: |
          # Variablen-Testfälle (nur gültige Kombinationen, nur ein Feld gesetzt)
          cat > matrix_variables.json <<EOF
          [
            {"action": "set", "variable-name": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions"},
            {"action": "set", "variable-name": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST"},
            {"action": "get", "variable-name": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions", "json": "value"},
            {"action": "get", "variable-name": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST", "json": "value"},
            {"action": "delete", "variable-name": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions"},
            {"action": "delete", "variable-name": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST"}
          ]
          EOF

          # Stelle sicher, dass jedes Objekt ein body-Feld hat (ggf. leer)
          jq 'map(if has("body") then . else . + {"body": ""} end)' matrix_variables.json > tmp && mv tmp matrix_variables.json

          matrix_variables_set=$(jq -cr 'map(select(.action == "set"))' matrix_variables.json)
          echo "matrix_variables_set=${matrix_variables_set:-[]}" >> "$GITHUB_OUTPUT"
          matrix_variables_get=$(jq -cr 'map(select(.action == "get"))' matrix_variables.json)
          echo "matrix_variables_get=${matrix_variables_get:-[]}" >> "$GITHUB_OUTPUT"
          matrix_variables_delete=$(jq -cr 'map(select(.action == "delete"))' matrix_variables.json)
          echo "matrix_variables_delete=${matrix_variables_delete:-[]}" >> "$GITHUB_OUTPUT"


  test-set-variables:
    runs-on: ubuntu-latest
    needs:
      - create-testcases
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json_encode: ${{ matrix.json_encode || false }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}

  test-get-variables:
    runs-on: ubuntu-latest
    needs:
      - create-testcases
      - test-set-variables
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_get) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}

  test-delete-variables:
    runs-on: ubuntu-latest
    needs:
      - create-testcases
      - test-set-variables
      - test-get-variables
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_delete) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}
