name: "Build AUR Package"
description: "Build an AUR package using a secure Arch Linux container with GPG and ccache support"
author: "DCx7C5"


inputs:
  pkg_name:
    required: true
    description: "Name of the package to build (should match the directory name containing the PKGBUILD)"
  gpg_sign:
    required: false
    default: 'false'
    description: "Whether to sign the package with GPG (default: false)"
  gpg_key_id:
    required: false
    default: ''
    description: "GPG key ID or fingerprint to use for signing (if needed)"
  gpg_passhphrase:
    required: false
    default: ''
    description: "Passphrase for GPG key (if needed)"
  gpg_home:
    required: false
    default: ''
    description: "Path to GPG home directory (optional, defaults to GNUPGHOME environment variable)"
  github_token:
    required: false
    default: ''
    description: "GitHub token for API access (defaults to github.token)"


runs:
  using: composite
  steps:
    - id: build_pkg
      uses: ./arch-run-cmd
      with:
        gpg_passhphrase: ${{ inputs.gpg_passhphrase }}
        run_with_sudo: 'true'
        enable_ccache: 'true'
        preset_cache: 'true'
        gpg_home: ${{ inputs.gpg_home || env.GNUPGHOME }}
        github_token: ${{ inputs.github_token || env.GH_TOKEN || github.token }}
        gpg_key_id: ${{ inputs.gpg_key_id }}
        run: |
          if [[ -n "${{ inputs.gpg_passphrase }}" && "${{ inputs.gpg_sign }}" == 'true' ]]; then
            echo "::notice::GPG signing is enabled with passphrase (will use passphrase for signing)"
            makepkg -sr --sign -C -c --noconfirm --noprogressbar
          else
            echo "::notice::GPG signing is disabled (no key ID provided)"
            makepkg -sr -C -c --noconfirm --noprogressbar
          fi
          
          echo "::notice::Package build completed successfully"
