name: "Update Repository Tag & Release"


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update-tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag_latest
        uses: DCx7C5/actions/tag-get-latest@v1
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Fail if latest tag is already up to date
        if: steps.tag_latest.outputs.tag_name != 'v1'
        shell: bash
        run: exit 1

      - name: Setup GPG Environment
        id: gpg_setup
        uses: DCx7C5/actions/gpg-setup-home@v1

      - name: Import GPG key
        id: gpg_import
        uses: DCx7C5/actions/gpg-import@v1
        env:
          GNUPGHOME: ${{ steps.gpg_setup.outputs.gpg_home }}
        with:
          method: 'secret'
          gpg_key: '${{ secrets.GPG_PRIVATE_KEY }}'
          pass: ${{ secrets.GPG_PASSPHRASE }}
          delete_after_import: 'true'

      - name: Configure Git client to sign with GPG
        id: git_config
        uses: DCx7C5/actions/git-configure-gnupg@v1
        env:
          GNUPGHOME: ${{ steps.gpg_setup.outputs.gpg_home }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Delete old tag (if exists)
        id: tag_delete
        uses: DCx7C5/actions/tag-delete@v1
        with:
          tag_name: "v1"

      - name: Create and push new signed Tag
        id: tag_create
        uses: DCx7C5/actions/tag-create-and-push@v1
        env:
          GNUPGHOME: ${{ steps.gpg_setup.outputs.gpg_home }}
        with:
          fingerprint: ${{ steps.gpg_import.outputs.fingerprint }}
          pass: ''
          version: "v1"
          commit_msg: "Release v1"

      - name: Create GitHub Release
        id: rel_create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1"
          name: "v1"
          body: "Release v1 - Updated tag to point to latest commit on main branch"
          draft: false
          prerelease: false
          generate_release_notes: ''
          fail_on_unmatched_files: true

      - name: Cleanup GPG keys from runner
        if: steps.gpg_setup.outputs.gpg_home != ''
        uses: DCx7C5/actions/gpg-cleanup@v1
        env:
          GNUPGHOME: ${{ steps.gpg_setup.outputs.gpg_home }}

      - name: Notify on success
        if: success()
        uses: DCx7C5/actions/telegram-notify@v1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          parse_mode: 'HTML'
          message: |
            <b>✅ New Signed Release Published!</b>

            <b>📦 Release Details:</b>
            - <b>Repository:</b> <code>${{ github.repository }}</code>
            - <b>Version:</b> <code>v1</code>
            - <b>Commit:</b> <code>${{ github.sha }}</code>
            - <b>Branch:</b> <code>${{ github.ref_name }}</code>
            - <b>Actor:</b> <code>${{ github.actor }}</code>

            <b>🔐 Signing:</b>
            - <b>GPG Fingerprint:</b> <code>${{ steps.gpg_import.outputs.fingerprint }}</code>
            - <b>Total Keys Available:</b> <code>${{ steps.gpg_import.outputs.keys_total }}</code>

            <b>🏷️ Tag & Release:</b>
            - <b>Tag Created:</b> <code>${{ steps.tag_create.outputs.tag }}</code>
            - <b>Release Name:</b> <code>v1</code>

            <b>🔗 Links:</b>
            <a href="https://github.com/${{ github.repository }}/releases/tag/v1">View Release</a> | <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">View Commit</a>
  
