name: "Update Repository Tag & Release"


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: "update-tag-and-release"
  cancel-in-progress: true


jobs:
  update-tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag_latest
        uses: ./tag-get-latest
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Fail if latest tag is already up to date
        if: steps.tag_latest.outputs.tag_name != 'v1'
        shell: bash
        run: exit 0

      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          method: 'inline'
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          delete_after_import: 'true'
          configure_git: 'true'
          setup_home: 'true'
          preset_pass: 'true'

      - name: Delete old tag & release (if exists)
        id: tag_delete
        uses: ./tag-delete
        with:
          tag_name: "v1"
          delete_release: 'true'

      - name: Create and push new signed Tag
        id: tag_create
        uses: ./tag-create-and-push
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
        with:
          sign: 'true'
          version: "v1"
          commit_msg: "Release v1"
          pass: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create release on GitHub
        id: release_create
        uses: ./gh-create-release
        env:
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
        with:
          github_token: ${{ steps.app_token.outputs.token || env.GH_TOKEN || github.token }}
          release_tag: ${{ steps.tag_create.outputs.tag_name }}
          release_name: ${{ steps.tag_create.outputs.tag_name }}
          generate_notes: 'false'
          fail_if_exists: 'true'
          prerelease: 'false'
          draft: 'false'

      - name: Cleanup GPG keys from runner
        if: steps.gpg_import.outputs.gpg_home != ''
        uses: ./gpg-cleanup
        with:
          gpg_home: ${{ steps.gpg_import.outputs.gpg_home }}

      - name: Notify on success
        if: success()
        uses: ./tg-notify-release
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          fingerprint: ${{ steps.gpg_import.outputs.fingerprint }}
          tag_name: ${{ steps.tag_create.outputs.tag_name }}
          release_name: ${{ steps.tag_create.outputs.tag_name }}
