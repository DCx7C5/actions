name: "Import unprotected GPG Key from file or inline variable"
description: "Import GPG key from file path or inline key material without protection checks"
author: "DCx7C5"

branding:
  icon: unlock
  color: blue


inputs:
  gpg_key:
    required: true
    description: "GPG key path or inline variable"
  gpg_home:
    required: false
    default: ''
    description: "Custom GPG home directory (optional, defaults to $GITHUB_WORKSPACE/.gnupg)"


outputs:
  fingerprint:
    description: "Fingerprint of the imported GPG key"
    value: ${{ steps.import.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available after import"
    value: ${{ steps.import.outputs.keys_total }}
  keys_public:
    description: "Number of public keys available after import"
    value: ${{ steps.import.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys available after import"
    value: ${{ steps.import.outputs.keys_secret }}


runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg-home || env.GNUPGHOME }}
      run: |
        set -euo pipefail
        
        if [[ -n "${{ inputs.gpg_key }}" ]]; then
          echo "::add-mask::${{ inputs.gpg_key }}"
        fi
        
        key_input="${{ inputs.gpg_key }}"

        if [[ -f "$key_input" ]]; then
          gpg --batch --import "$key_input"
        else
          printf '%s\n' "$key_input" | gpg --batch --import
        fi
        
        fingerprint=$(gpg --batch --with-colons --list-keys | grep '^fpr:' | head -1 | cut -d: -f10)
        keys_total=$(gpg --batch --with-colons --list-keys | grep -c '^pub:' || echo 0)
        keys_public=$(gpg --batch --with-colons --list-public-keys | grep -c '^pub:' || echo 0)
        keys_secret=$(gpg --batch --with-colons --list-secret-keys | grep -c '^sec:' || echo 0)

        {
          echo "fingerprint=${fingerprint}"
          echo "keys_total=${keys_total}"
          echo "keys_public=${keys_public}"
          echo "keys_secret=${keys_secret}"
        } >> "$GITHUB_OUTPUT"
