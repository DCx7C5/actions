name: "Delete Package from PKGBUILDS repository"
description: "Deletes a package directory from the repository and stages the change"
author: "DCx7C5"

branding:
  icon: trash-2
  color: red

inputs:
  pkg_name:
    description: "Name of the package to delete"
    required: true
  stage_changes:
    description: "Whether to stage the deletion changes (true/false)"
    required: false
    default: 'true'
  packages_json_path:
    description: "Path to packages.json metadata file"
    required: false
    default: '${{ github.workspace }}/.ci/packages.json'

outputs:
  changed:
    description: "Whether deletion produced changes (staged if stage enabled, otherwise workspace changes)"
    value: ${{ steps.finalize.outputs.changed }}
  staged_files:
    description: "New-line separated staged file list"
    value: ${{ steps.finalize.outputs.staged_files }}


runs:
  using: composite
  steps:
    - name: Delete package
      id: delete_pkg
      shell: bash
      run: |
        set -euo pipefail
        pkg_name="${{ inputs.pkg_name }}"
        [[ -n "$pkg_name" ]] || { 
          echo "::error::pkg_name is required." >&2
          exit 1
        }
        rm -rf -- "$pkg_name"

    - name: Delete package from package.json
      id: del_json
      uses: DCx7C5/actions/json-packages@v1
      with:
        path: '${{ inputs.packages_json_path }}'
        action: 'remove'
        pkg_name: ${{ inputs.pkg_name }}

    - name: Stage changes
      id: stage
      if: inputs.stage_changes == 'true'
      uses: DCx7C5/actions/git-stage-changes@v1
      with:
        paths: |
          ${{ inputs.pkg_name }}
          ${{ inputs.packages_json_path }}

    - name: Finalize outputs
      id: finalize
      if: always()
      shell: bash
      env:
        STAGE_CHANGES: ${{ inputs.stage_changes }}
        PKG_NAME: ${{ inputs.pkg_name }}
        PACKAGES_JSON_PATH: ${{ inputs.packages_json_path }}
      run: |
        set -euo pipefail

        if [[ "$STAGE_CHANGES" == "true" ]]; then
          echo "changed=${{ steps.stage.outputs.staged || 'false' }}" >> "$GITHUB_OUTPUT"
          
          echo "staged_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ steps.stage.outputs.staged_files || '' }}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -n "$(git status --porcelain -- "$PKG_NAME" "$PACKAGES_JSON_PATH")" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "staged_files=" >> "$GITHUB_OUTPUT"
