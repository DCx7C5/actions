name: "Set Trust Level for GPG Key"
description: "Set the trust level for a GPG key in GitHub Actions"
author: "DCx7C5"

branding:
  icon: lock
  color: purple


inputs:
  fingerprint:
    required: true
    description: "Fingerprint of the GPG key to set trust level for"
  trust-level:
    required: false
    default: '6'
    description: "Set trust level of GPG Key (default: ultimate=6)"
  gpg-home:
    required: false
    default: ''
    description: "Path to GNUPGHOME directory (where keys are stored)"


runs:
  using: composite
  steps:
    - name: Set GPG key trust level
      id: set_trust
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg-home || env.GNUPGHOME }}
      run: |
        # Validate inputs and environment, then set the trust level for the specified 
        # GPG key fingerprint using gpg --import-ownertrust, and handle errors appropriately
        set -euo pipefail

        if [ -z '${{ inputs.fingerprint }}' ]; then
          echo "::error::fingerprint input is required" >&2
          exit 1
        fi
        if [ -z '${{ inputs.trust-level }}' ]; then
          echo "::error::trust_level input is required" >&2
          exit 1
        fi
        
        export GNUPGHOME=${GNUPGHOME:-"${{ github.workspace }}/.gnupg"}
        if ! echo "${{ inputs.fingerprint }}:${{ inputs.trust-level }}:" | gpg --no-tty --batch --import-ownertrust; then
          echo "::error::Failed setting trust level of key: ${{ inputs.fingerprint }}" >&2
          exit 1
        fi
        
        echo "::notice::Successfully set trust level for key: ${{ inputs.fingerprint }}"
