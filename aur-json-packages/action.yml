name: "Manage packages.json file"
description: "Action to manage the packages.json file in the repository, allowing for adding, updating, and removing package entries"
author: "DCx7C5"

branding:
  icon: "package"
  color: "blue"


inputs:
  json_file:
    required: true
    description: "Path to the packages.json file to manage. Can also be GitHub Actions Variable string (default: .ci/packages.json)."
    default: ${{ vars.JSON_PACKAGES || '.ci/packages.json' }}
  pkg_name:
    required: false
    default: ''
    description: "Name of the package to operate on. Required for targeted actions."
  key:
    required: false
    default: ''
    description: "Key in the package object to add, update, or remove (e.g. 'repository', 'custom')."
  value:
    required: false
    default: ''
    description: "Value to set for the given key. Used for add/update actions."
  env:
    required: false
    description: "Set deployment environment variable"
    default: ''
  org:
    required: false
    description: "Name of the organisation to store the variable in (defaults to current organisation based on variable_type)"
    default: ''
  repo:
    required: false
    description: "Set repository variable (defaults to current repository)"
    default: ''
  steps_out:
    required: false
    default: 'false'
    description: "Whether to set the updated JSON as a step output (true/false)."
  gh_token:
    required: false
    description: "GitHub Token with permissions to manage secrets (usually GITHUB_TOKEN)"
    default: ''
  action:
    required: false
    default: 'get'
    description: >-
      Action to perform on the packages.json file. Valid actions are:
      - get: Retrieve package information. If pkg_name is provided, retrieves details for that package; otherwise, retrieves the entire packages.json content.
      - add: Add a new package entry. Requires pkg_name, key, and value inputs.
      - update: Update an existing package entry. Requires pkg_name, key, and value inputs.
      - remove: Remove a package entry. Requires  pkg_name input.
      - count: Count the number of packages in the packages.json file.
      

outputs:
  out:
    description: "Output channel for the action. "
    value: ${{ steps.get_all_packages.outputs.packages }}
  repository:
    description: "Repository URL for the package (for 'get' with pkg_name). Shows the upstream repository."
    value: ${{ steps.get_pkg_value.outputs.repository }}
  custom:
    description: "Custom flag for the package (for 'get' with pkg_name). Indicates if the package is marked as custom."
    value: ${{ steps.get_pkg_value.outputs.custom }}
  remote_path:
    description: "Remote type for the package (for 'get' with pkg_name). E.g. 'PKG' or 'GIT'."
    value: ${{ steps.get_pkg_value.outputs.remote_dir }}
  remote_url:
    description: "Remote URL for the package (for 'get' with pkg_name). Shows the URL of the remote repository or source."
    value: ${{ steps.get_pkg_value.outputs.remote_url }}
  submodule:
    description: "Submodule info for the package (for 'get' with pkg_name). Shows submodule if present."
    value: ${{ steps.get_pkg_value.outputs.submodule }}
  default:
    description: "Default output channel for the action."
    value: ${{ outputs.out }}


runs:
  using: composite
  steps:
    - id: validate_inputs
      shell: bash
      env:
        PKG_NAME: "${{ inputs.pkg_name }}"
        JSON_PATH: "${{ inputs.json_file }}"
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
        ACTION: "${{ inputs.action }}"
      run: |
        set -euo pipefail

        valid_actions=("get" "add" "update" "remove" "count")

        if [[ ! " ${valid_actions[*]} " =~ " ${ACTION} " ]]; then
          echo "::error::Invalid action '${ACTION}'. Valid actions are: ${valid_actions[*]}" >&2
          exit 1
        elif [[ ! "${{ inputs.env != '' && 'true' }}${{ inputs.repo != '' && 'true' }}${{ inputs.org != '' && 'true' }}" =~ ^true$ ]]; then
          echo "::error::Not more than one of 'env', 'repo' or 'org' can be set to a non-empty value" >&2
          exit 1
        elif [[ -z "$JSON_PATH" && ! -f "$JSON_PATH" ]]; then
          echo "::error::File '$JSON_PATH' does not exist." >&2
          exit 1
        elif [[ -n "${{ inputs.key }}" && -z "${{ inputs.value }}" && ! "$ACTION" =~ '^remove|get$' ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -z "${{ inputs.key }}" && -n "${{ inputs.value }}" ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -n "${{ inputs.key }}" && -n "${{ inputs.value }}" && ! "$ACTION" =~ ^add|update|get$ ]]; then
          echo "::error::'key' and 'value' inputs are only valid for 'add' and 'update' actions." >&2
          exit 1
        elif [[ -n "${{ inputs.key }}" && -z "${{ inputs.value }}" && ! "$ACTION" =~ '^remove|get$' ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -z "${{ inputs.key }}" && -n "${{ inputs.value }}" ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -n "${{ inputs.key }}" && -n "${{ inputs.value }}" && ! "$ACTION" =~ ^add|update|get$ ]]; then
          echo "::error::'key' and 'value' inputs are only valid for 'add' and 'update' actions." >&2
          exit 1
        elif [[ "${{ inputs.visibility }}" == "selected" && -z "${{ inputs.repos }}" ]]; then
          echo "::warning::Visibility 'selected' has no repositories specified"
        fi
        
        if [[ -n "$JSON_PATH" && -f "$JSON_PATH" ]]; then
          echo "inline_json=false" >> "$GITHUB_OUTPUT"
        elif echo "$JSON_PATH" | jq -e 2>/dev/null; then
          echo "inline_json=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::'json_file' input is required and must point to a valid file or variable name." >&2
          exit 1
        fi
        
        echo "level=${{ case(
          inputs.action == 'get', 'info',
          inputs.action == 'count', 'notice',
          'warning'
        )}}" >> "$GITHUB_OUTPUT"

    - name: Dynamical Filter
      id: filter
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
      run: |
        set -euo pipefail


        gh variable get "${{ inputs.variable_name }}" ${GH_CMD[@]} ${FILTER[@]} 2>/dev/null


    - name: Save updated JSON to inline again
      id: save_updated_json
      if: steps.validate_inputs.outputs.inline_json == 'true' && 
         (steps.add_pkg.outputs.new_json != '' || steps.add_update_pkg.outputs.new_json != '' || steps.remove_pkg.outputs.new_json != '')
      uses: DCx7C5/actions/gh-variables@v1
      with:
        action: 'set'
        variable-name: ${{ inputs.variable_name }}
        body: ${{ steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json }}
        repo: ${{ inputs.repo }}
        org: ${{ inputs.org }}
        env: ${{ inputs.env }}
        repos: ${{ inputs.repos }}
        visibility: ${{ inputs.visibility }}
        gh-token: ${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN }}

    - name: Set step output for updated JSON
      id: set_output_updated_json
      if: inputs.steps_out == 'true' && 
          steps.validate_inputs.outputs.inline_json == 'true' && 
         (steps.add_pkg.outputs.new_json != '' || steps.add_update_pkg.outputs.new_json != '' || steps.remove_pkg.outputs.new_json != '')
      shell: bash
      run: |
        set -euo pipefail
        
        JSON="${{ steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json || '' }}"
        
        cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
        ## Updated JSON Output
        
        ```json
        EOF
        JSON_PRETTY=$(echo "$JSON" | jq .)
        printf '%s\n' "$JSON_PRETTY" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
