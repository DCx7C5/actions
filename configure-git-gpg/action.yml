name: "Configure GitHub clients for GPG signing"
description: "Configure GitHub (git & gh) client for GPG signing from GitHub Actions"
author: "DCx7C5"

inputs:
  fingerprint:
    description: "Fingerprint of the GPG key to use for signing (optional, will use default key if not provided)"
    required: false
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: "${{ github.workspace }}/.gnupg"

outputs:
  fingerprint:
    description: "Fingerprint of the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.fingerprint }}
  name:
    description: "Name associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_name }}
  email:
    description: "Email associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_mail }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      if: inputs.fingerprint != ''
      run: |
        echo "::add-mask::${{ inputs.fingerprint }}"

    - name: Get GNUPGHOME with fallback
      shell: bash
      id: get_gpg_home
      run: |
        if [[ -n "${{ inputs.gpg_home }}" ]]; then
          echo "gpg_home=${{ inputs.gpg_home }}" >> $GITHUB_OUTPUT
        elif [[ -n "$GNUPGHOME" ]]; then
          echo "gpg_home=$GNUPGHOME" >> $GITHUB_OUTPUT
        elif [[ -z "$GNUPGHOME" ]]; then
          echo "gpg_home=${{ inputs.gpg_home }}" >> $GITHUB_OUTPUT
        else
          echo "::error::Could not determine GNUPGHOME directory" >&2
          exit 1
        fi

    - name: Parse Key Credentials
      id: parse_gpg
      shell: bash
      env:
        INPUT_FINGERPRINT: ${{ inputs.fingerprint }}
        GNUPGHOME: ${{ steps.get_gpg_home.outputs.gpg_home }}
      run: |
        set -euo pipefail
        
        FINGERPRINT=""
        GPG_NAME="GitHub Actions"
        GPG_MAIL="actions@github.com"
        HAS_KEY=false
        
        # ────────────────────────────────────────────────
        # 1. Try user-provided fingerprint (safe check)
        # ────────────────────────────────────────────────
        if [ -n "$INPUT_FINGERPRINT" ]; then
          # Test existence without crashing
          if gpg --with-colons --list-secret-keys "$INPUT_FINGERPRINT" >/dev/null 2>&1; then
            FINGERPRINT="$INPUT_FINGERPRINT"
            HAS_KEY=true
            echo "Using provided fingerprint: $FINGERPRINT"
          else
            echo "::warning::Provided fingerprint '$INPUT_FINGERPRINT' not found in secret keys"
          fi
        fi
        
        # ────────────────────────────────────────────────
        # 2. Fallback: first available secret key (safe)
        # ────────────────────────────────────────────────
        if [ "$HAS_KEY" = false ]; then
          # This line is safe — no argument to gpg
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -n "$FINGERPRINT" ]; then
            HAS_KEY=true
            echo "Found default secret key: $FINGERPRINT"
          else
            echo "::notice::No secret GPG keys found in $GNUPGHOME → using fallback identity"
          fi
        fi
        
        # ────────────────────────────────────────────────
        # 3. ONLY extract name/email if we actually have a valid key
        # ────────────────────────────────────────────────
        if [ "$HAS_KEY" = true ] && [ -n "$FINGERPRINT" ]; then
          # Now it's safe — $FINGERPRINT is guaranteed non-empty
          UID_LINE=$(gpg --with-colons --list-keys "$FINGERPRINT" | awk -F: '/^uid:/ {print $0; exit}')
          if [ -n "$UID_LINE" ]; then
            UID_DECODED=$(echo "$UID_LINE" | cut -d: -f10 | sed 's/%20/ /g; s/%3C/</g; s/%3E/>/g; s/%40/@/g')
            if [[ "$UID_DECODED" =~ ^([^<]+)[[:space:]]+\<(.*)\>$ ]]; then
              GPG_NAME="${BASH_REMATCH[1]//^[[:space:]]+|[[:space:]]+$/}"
              GPG_MAIL="${BASH_REMATCH[2]}"
              echo "Extracted identity: $GPG_NAME <$GPG_MAIL>"
            else
              echo "::warning::Could not parse uid from: $UID_DECODED"
            fi
          fi
        fi
        
        # ────────────────────────────────────────────────
        # 4. gh CLI check
        # ────────────────────────────────────────────────
        GH_CLI=false
        command -v gh >/dev/null 2>&1 && GH_CLI=true
        
        # ────────────────────────────────────────────────
        # 5. Outputs — always set, even if no key
        # ────────────────────────────────────────────────
        echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
        echo "gpg_name=$GPG_NAME"       >> $GITHUB_OUTPUT
        echo "gpg_mail=$GPG_MAIL"       >> $GITHUB_OUTPUT
        echo "gh_cli=$GH_CLI"           >> $GITHUB_OUTPUT
        echo "has_key=$HAS_KEY"         >> $GITHUB_OUTPUT

    - name: Configure git for GPG signing
      id: gitconfig
      if: steps.parse_gpg.outputs.has_key == 'true'
      shell: bash
      env:
        GNUPGHOME: ${{ steps.get_gpg_home.outputs.gpg_home }}
        GPG_NAME: ${{ steps.parse_gpg.outputs.gpg_name }}
        GPG_MAIL: ${{ steps.parse_gpg.outputs.gpg_mail }}
        FINGERPRINT: ${{ steps.parse_gpg.outputs.fingerprint }}
      run: |
        set -euo pipefail
        
        git config --global user.name "$GPG_NAME"
        git config --global user.email "$GPG_MAIL"
        git config --global user.signingkey "$FINGERPRINT"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true
        git config --global tag.forceSignAnnotated true
        git config --global gpg.program gpg
        
        echo "Configured git with GPG key: $FINGERPRINT (${GPG_NAME} <${GPG_MAIL}>)"

    - name: Configure gh for GPG signing
      id: ghconfig
      if: steps.parse_gpg.outputs.gh_cli == 'true' && steps.parse_gpg.outputs.has_key == 'true'
      shell: bash
      env:
        GNUPGHOME: ${{ steps.get_gpg_home.outputs.gpg_home }}
        GPG_NAME: ${{ steps.parse_gpg.outputs.gpg_name }}
        GPG_MAIL: ${{ steps.parse_gpg.outputs.gpg_mail }}
        FINGERPRINT: ${{ steps.parse_gpg.outputs.fingerprint }}
      run: |
        set -euo pipefail
        
        gh config set -h github.com gpg_key_id "$FINGERPRINT"
        gh config set -h github.com git_protocol https
        
        echo "Configured gh CLI with GPG key: $$FINGERPRINT (${GPG_NAME} <${GPG_MAIL}>)"
