name: "Create & Push Signed Tag"
description: "Create & push a signed git tag"
author: "DCx7C5"


inputs:
  version:
    description: "The new version to use (e.g. v1.2.3 or 1.2.3)"
    required: true
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: "${{ github.workspace }}/.gnupg"
  fingerprint:
    description: "GPG key fingerprint or email to use for signing the tag (optional)"
    required: false
    default: ""
  gpg_pass:
    description: "Passphrase for the GPG key (if needed, optional)"
    required: false
    default: ""
  commit_msg:
    description: "Commit message for the annotated tag"
    required: false
    default: "Release ${{ inputs.version }}"


runs:
  using: composite
  steps:
    - name: Mask sensitive values
      id: mask_vars
      shell: bash
      if: inputs.fingerprint != ''
      run: |
        echo '::add-mask::${{ inputs.gpg_pass }}'

    - name: Create & sign annotated tag
      id: tag_create
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home }}
        TAG: ${{ inputs.version }}
        FINGERPRINT: ${{ inputs.fingerprint }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "::notice::Attempting to create signed tag: $TAG"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists."
          exit 1
        fi
        
        SIGN_ARGS=()
        if [ -n "$FINGERPRINT" ]; then
          SIGN_ARGS=(--local-user "$FINGERPRINT")
          echo "::notice::Using explicit key: $FINGERPRINT"
        else
          echo "::warning::No explicit fingerprint → using default key"
        fi
    
        # Export passphrase to agent (loopback mode must be allowed)
        if [ -n '${{ inputs.gpg_pass }}' ]; then
          KEY_GRIP=$(gpg --with-keygrip -K | grep "Keygrip" | head -1 | awk -F'Keygrip = ' '{print $2}')
          echo "allow-preset-passphrase" >> "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent 2>/dev/null || true
          sleep 1
          gpgconf --homedir "$GNUPGHOME" --launch gpg-agent
          echo "::notice::Caching phrase" 
          echo '${{ inputs.gpg_pass }}' | \
            /usr/lib/gnupg/gpg-preset-passphrase --homedir "$GNUPGHOME" --preset "$KEY_GRIP" || true
        fi
        # Create the tag (no gpg-sign-options)
        if ! git tag -a "$TAG" -m "${{ inputs.commit_msg }}" "${SIGN_ARGS[@]}" -s; then
          echo "::error::git tag signing failed"
          exit 1
        fi
    
        echo "::notice::Signed tag created successfully: $TAG"
        git show --pretty=fuller "$TAG" || true

    - name: Push (signed) tag
      id: tag_push
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if ! git push origin "${{ inputs.version }}"; then
          echo "::error::Failed pushing TAG to repository"
          exit 1
        fi
        
        echo "::notice::Successfully pushed TAG to repository"
