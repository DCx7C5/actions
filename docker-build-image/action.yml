name: "Build Arch Linux Docker Image"
description: "Build the Arch Linux Docker image used for AUR builds"
author: "DCx7C5"

inputs:
  image_tag:
    description: "Docker image tag to build"
    required: true
  image_version:
    description: "Docker image version tag (defaults to 'latest')"
    required: false
    default: 'latest'
  dockerfile_path:
    description: "Path to the Dockerfile to use for building the image"
    required: false
    default: '.'
  image_working_directory:
    description: "Working directory inside container"
    required: false
    default: ''
  runtime_working_directory:
    description: "Working directory for the build context (defaults to github.workspace)"
    required: false
    default: ''
  gpg_home:
    description: "GPG home directory (usually in workspace)"
    required: false
    default: ''
  ccache_dir:
    description: "ccache directory for build caching"
    required: false
    default: ''
  user:
    description: "User name to create inside the container (defaults to runner.user)"
    required: false
    default: ''
  group:
    description: "Group name to create inside the container (defaults to runner.group)"
    required: false
    default: ''
  uid:
    description: "User ID to use inside the container (defaults to current user ID)"
    required: false
    default: ''
  gid:
    description: "Group ID to use inside the container (defaults to current group ID)"
    required: false
    default: ''
  gpg_key:
    description: "GPG private key to import into the container (if needed, should be provided as a secret and passed via environment variable)"
    required: false
    default: ''
  gh_token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ''
  build_args:
    description: "New-line separated list of additional build arguments to pass to 'docker build' (optional)"
    required: false
    default: ''

outputs:
  image:
    description: "The Docker image tag that was built"
    value: ${{ inputs.image }}
  image_tag:
    description: "The Docker image tag (without version) that was built"
    value: ${{ inputs.image_tag }}
  image_version:
    description: "The Docker image version tag that was built"
    value: ${{ inputs.image_version }}

runs:
  using: composite
  steps:
    - id: build_image
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || github.token }}"
        USER: "${{ inputs.user || env.USER || runner.user }}"
        GROUP: "${{ inputs.group || env.GROUP || runner.group }}"
        UID: "${{ inputs.uid || env.UID || '1000' }}"
        GID: "${{ inputs.gid || env.GID || '1000' }}"
        GNUPGHOME: "${{ inputs.gpg_home || env.GNUPGHOME || format('{0}/.gnupg', github.workspace) }}"
        IMAGE_WORKING_DIR: "${{ inputs.image_working_directory || env.IMAGE_WORKING_DIR || format('{0}/arch-run-cmd', github.workspace) }}"
        WORKING_DIR: "${{ inputs.runtime_working_directory || env.RUNTIME_WORKING_DIR || github.workspace || '.' }}"
        RUNTIME_WORKING_DIR: "${{ env.WORKING_DIR }}"
        DOCKERFILE: "${{ inputs.dockerfile_path || format('{0}/Dockerfile', inputs.image_working_directory || env.IMAGE_WORKING_DIR) }}"
      working-directory: "${{ inputs.image_working_directory || env.IMAGE_WORKING_DIR }}"
      run: |
        set -euo pipefail
        
        [[ "$(pwd)" != "$IMAGE_WORKING_DIR" ]] && cd "$IMAGE_WORKING_DIR"
        
        if [[ -z "$DOCKERFILE" || ! -f "$DOCKERFILE" ]]; then
          DOCKERFILE="${DOCKERFILE:-"Dockerfile}"
          if [[ -z "$DOCKERFILE" || ! -f "$DOCKERFILE" ]]; then
            echo "::error::Dockerfile not found at path: $DOCKERFILE"
            exit 1
          fi
        fi
        
        IMAGE='${{ inputs.image_tag }}:${{ inputs.image_version }}'
        
        DOCKER_BUILD_ARGS=()
        DOCKER_BUILD_ARGS+=(--build-arg "WORKING_DIR=$RUNTIME_WORKING_DIR")
        DOCKER_BUILD_ARGS+=(--build-arg "GNUPGHOME=${{ inputs.gpg_home || env.GNUPGHOME || format('{0}/.gnupg', github.workspace) || '.gnupg' }}")
        DOCKER_BUILD_ARGS+=(--build-arg "CCACHE_DIR=${{ inputs.ccache_dir || env.CCACHE_DIR || format('{0}/.ccache', github.workspace) || '.ccache' }}")
        DOCKER_BUILD_ARGS+=(--build-arg "USER=${{ inputs.user }}")
        DOCKER_BUILD_ARGS+=(--build-arg "GROUP=${{ inputs.group }}")
        DOCKER_BUILD_ARGS+=(--build-arg "UID=${{ inputs.uid }}")
        DOCKER_BUILD_ARGS+=(--build-arg "GID=${{ inputs.gid }}")
        DOCKER_BUILD_ARGS+=(--build-arg "GPG_KEY=${{ inputs.gpg_key }}")
        
        if [[ -n "${{ inputs.build_args }}" ]]; then
          while IFS= read -r arg; do
            if [[ -n "$arg" && "$arg" =~ ^[A-Z]*\=[a-zA-Z0-9\s]*$ ]]; then
              DOCKER_BUILD_ARGS+=(--build-arg "$arg")
            fi
          done <<< "${{ inputs.build_args }}"
        fi
        
        echo "::notice::Building Arch Linux Docker image for AUR builds..."
        docker build \
          "$DOCKER_BUILD_ARGS[@]" \
          -f "$DOCKERFILE" \
          -t "${{ inputs.image_tag }}:${{ inputs.image_version }}" .
        
        cd "${{ github.workspace }}" || true
        
        echo "::notice::Docker image built successfully: $IMAGE"
