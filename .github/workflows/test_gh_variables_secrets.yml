#file: noinspection GithubFunctionSignatureValidation
name: "Test gh-variables and gh-secrets in GitHub Actions"
on:
  workflow_dispatch:
  push:
    paths:
      - 'gh-secrets/**'
      - 'gh-variables/**'

permissions: 
  contents: write
  actions: write

jobs:
  
  create-testcases:
    runs-on: ubuntu-latest
    outputs:
      matrix_variables_set: ${{ steps.set_variables.outputs.matrix_variables_set }}
      matrix_variables_get: ${{ steps.set_variables.outputs.matrix_variables_get }}
      matrix_variables_delete: ${{ steps.set_variables.outputs.matrix_variables_delete }}
      matrix_secrets_set: ${{ steps.set_variables.outputs.matrix_secrets_set }}
      matrix_secrets_delete: ${{ steps.set_variables.outputs.matrix_secrets_delete }}
    steps:
      - name: Prepare Test Cases
        id: set_variables
        shell: bash
        run: |
          # Cross-Kombinations-Testcases für gh-variables
          cat <<'EOF' > matrix_variables.json
          [
            {"action": "set", "variable-name": "TEST_VAR_REPO", "body": "varvalue", "repo": "repo1", "org": "", "env": "", "repos": "", "visibility": "all", "json_encode": false, "json": "value"},
            {"action": "set", "variable-name": "TEST_VAR_ORG", "body": "varvalue", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "all", "json_encode": false, "json": "value"},
            {"action": "set", "variable-name": "TEST_VAR_ORG_REPOS_SELECTED", "body": "varvalue", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "json_encode": false, "json": "value"},
            {"action": "set", "variable-name": "TEST_VAR_ENV", "body": "varvalue", "repo": "", "org": "", "env": "env1", "repos": "", "visibility": "all", "json_encode": false, "json": "value"},
            {"action": "set", "variable-name": "TEST_VAR_ORG_REPOS_SELECTED_JSON", "body": "varvalue", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "json_encode": true, "json": "json"},
            {"action": "get", "variable-name": "TEST_VAR_REPO", "repo": "repo1", "org": "", "env": "", "repos": "", "visibility": "all", "json": "value"},
            {"action": "get", "variable-name": "TEST_VAR_ORG", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "all", "json": "value"},
            {"action": "get", "variable-name": "TEST_VAR_ORG_REPOS_SELECTED", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "json": "value"},
            {"action": "get", "variable-name": "TEST_VAR_ENV", "repo": "", "org": "", "env": "env1", "repos": "", "visibility": "all", "json": "value"},
            {"action": "get", "variable-name": "TEST_VAR_ORG_REPOS_SELECTED_JSON", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "json": "json"},
            {"action": "delete", "variable-name": "TEST_VAR_REPO", "repo": "repo1", "org": "", "env": "", "repos": "", "visibility": "all"},
            {"action": "delete", "variable-name": "TEST_VAR_ORG", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "all"},
            {"action": "delete", "variable-name": "TEST_VAR_ORG_REPOS_SELECTED", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected"},
            {"action": "delete", "variable-name": "TEST_VAR_ENV", "repo": "", "org": "", "env": "env1", "repos": "", "visibility": "all"}
          ]
          EOF
          # Cross-Kombinations-Testcases für gh-secrets
          cat <<'EOF' > matrix_secrets.json
          [
            {"action": "set", "secret-name": "TEST_SECRET_REPO", "body": "secretvalue", "repo": "repo1", "org": "", "env": "", "repos": "", "visibility": "all", "no-repos-select": "false", "print": true},
            {"action": "set", "secret-name": "TEST_SECRET_ORG", "body": "secretvalue", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "all", "no-repos-select": "false", "print": false},
            {"action": "set", "secret-name": "TEST_SECRET_ORG_REPOS_SELECTED", "body": "secretvalue", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "no-repos-select": "false", "print": true},
            {"action": "set", "secret-name": "TEST_SECRET_ORG_REPOS_SELECTED_NOREPOS", "body": "secretvalue", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "selected", "no-repos-select": "true", "print": false},
            {"action": "set", "secret-name": "TEST_SECRET_ENV", "body": "secretvalue", "repo": "", "org": "", "env": "env1", "repos": "", "visibility": "all", "no-repos-select": "false", "print": true},
            {"action": "delete", "secret-name": "TEST_SECRET_REPO", "repo": "repo1", "org": "", "env": "", "repos": "", "visibility": "all", "no-repos-select": "false"},
            {"action": "delete", "secret-name": "TEST_SECRET_ORG", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "all", "no-repos-select": "false"},
            {"action": "delete", "secret-name": "TEST_SECRET_ORG_REPOS_SELECTED", "repo": "", "org": "org1", "env": "", "repos": "repo1\nrepo2", "visibility": "selected", "no-repos-select": "false"},
            {"action": "delete", "secret-name": "TEST_SECRET_ORG_REPOS_SELECTED_NOREPOS", "repo": "", "org": "org1", "env": "", "repos": "", "visibility": "selected", "no-repos-select": "true"},
            {"action": "delete", "secret-name": "TEST_SECRET_ENV", "repo": "", "org": "", "env": "env1", "repos": "", "visibility": "all", "no-repos-select": "false"}
          ]
          EOF
          echo "matrix_variables_set=$(cat matrix_variables.json | jq -c .)" >> $GITHUB_OUTPUT
          echo "matrix_variables_get=$(cat matrix_variables.json | jq -c 'map(select(.action == "get"))')" >> $GITHUB_OUTPUT
          echo "matrix_variables_delete=$(cat matrix_variables.json | jq -c 'map(select(.action == "delete"))')" >> $GITHUB_OUTPUT
          echo "matrix_secrets_set=$(cat matrix_secrets.json | jq -c .)" >> $GITHUB_OUTPUT
          echo "matrix_secrets_delete=$(cat matrix_secrets.json | jq -c 'map(select(.action == "delete"))')" >> $GITHUB_OUTPUT
          

  test-set-variables:
    runs-on: ubuntu-latest
    needs: create-testcases
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables@v1
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json_encode: ${{ matrix.json_encode || false }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'all' }}

  test-set-secrets:
    runs-on: ubuntu-latest
    needs: create-testcases
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_secrets_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Secret Action
        id: test_secret
        uses: ./gh-secrets@v1
        with:
          secret-name: ${{ matrix.secret-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          print: ${{ matrix.print || false }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'selected' }}
          no-repos-select: ${{ matrix.no-repos-select || 'false' }}

  test-get-variables:
    runs-on: ubuntu-latest
    needs: test-set-variables
    strategy:
      matrix:

        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_get) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables@v1
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'all' }}

  test-get-secrets:
    runs-on: ubuntu-latest
    needs: test-set-secrets
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_secrets_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Secret Action
        id: test_secret
        uses: ./gh-secrets@v1
        with:
          secret-name: ${{ matrix.secret-name }}
          body: ${{ matrix.body || '' }}
          action: get
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'selected' }}
          no-repos-select: ${{ matrix.no-repos-select || 'false' }}

  test-delete-variables:
    runs-on: ubuntu-latest
    needs: test-get-variables
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_delete) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables@v1
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'all' }}

  test-delete-secrets:
    runs-on: ubuntu-latest
    needs: test-get-secrets
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_secrets_delete) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - name: Test Secret Action
        id: test_secret
        uses: ./gh-secrets@v1
        with:
          secret-name: ${{ matrix.secret-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || 'selected' }}
          no-repos-select: ${{ matrix.no-repos-select || 'false' }}

