name: "Run Command In Arch Linux Docker (AUR Build)"
description: "Minimal, secure Arch Linux container for AUR builds with GPG & ccache support"
author: "DCx7c5"

inputs:
  command:
    description: "Command/script to execute inside container"
    required: true
  working_directory:
    description: "Working directory inside container"
    required: false
    default: ${{ github.workspace }}
  gpg_home:
    description: "GPG home directory (usually in workspace)"
    required: false
    default: ''
  ccache_dir:
    description: "ccache directory for build caching"
    required: false
    default: ''
  enable_ccache:
    description: "Enable ccache for faster incremental builds"
    required: false
    default: "true"
  github_token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ''
  gpg_key_id:
    description: "GPG key ID or fingerprint to use for signing (if needed, will be passed via environment variable)"
    required: false
    default: ''
  gpg_passhphrase:
    description: "Passphrase for GPG key (if needed, will be passed via environment variable)"
    required: false
    default: ''
  preset_cache:
    description: "Whether to preset GPG passphrase in gpg-agent cache before running the command (default: true)"
    required: false
    default: "true"
  run_with_sudo:
    description: "Whether to run the command with sudo inside the container (default: false)"
    required: false
    default: "false"
  gpg_key:
    description: "GPG private key to import into the container (if needed, should be provided as a secret and passed via environment variable)"
    required: false
    default: ''
  image:
    description: "Docker image to use (if set, skips build and uses this image tag)"
    required: false
    default: 'arch-run-cmd:latest'

runs:
  using: docker
  image: arch-run-cmd:latest
  env:
    CI: "true"
    GITHUB_ACTIONS: "true"
    GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || github.token }}"
    MAKEFLAGS: '-j ${{ runner.cpu_count }}'
    CCACHE_DIR: ${{ inputs.ccache_dir || env.CCACHE_DIR || format('{0}/.ccache', github.workspace) }}
    GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME || format('{0}/.gnuphome', github.workspace) }}
    CCACHE_MAXSIZE: "2G"
    CCACHE_COMPRESS: "1"
    CCACHE_COMPRESSLEVEL: "6"
    DISABLE_TELEMETRY: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    RUN_WITH_SUDO: ${{ inputs.run_with_sudo || env.RUN_WITH_SUDO || 'false' }}
    GPG_KEY_ID: ${{ inputs.gpg_key_id || env.GPG_KEY_ID || '' }}
    GPG_PASSPHRASE: ${{ inputs.gpg_passhphrase || '' }}
    PRESET_CACHE: ${{ inputs.preset_cache || env.PRESET_CACHE || 'false' }}
    WORKING_DIRECTORY: ${{ inputs.working_directory || env.WORKING_DIRECTORY || github.workspace || '.' }}
    WORK_DIR: ${{ inputs.working_directory || github.workspace || env.WORK_DIR || '.' }}
    KEYGRIPS: ${{ steps.gpg_import.outputs.key_grips || env.KEYGRIPS || '' }}
  post-entrypoint: /post_entrypoint.sh
  args:
    - ${{ inputs.command }}
