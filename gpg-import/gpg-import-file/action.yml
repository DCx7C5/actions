name: "Import GPG Keys from Files"
description: "Import GPG keys from local files"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"

inputs:
  key:
    required: false
    default: ''
    description: "Path to GPG key file"
  pass:
    required: false
    default: ''
    description: "Passphrase for the private key - will be masked in logs"
  delete-after-import:
    required: false
    default: 'true'
    description: "Securely delete private key file after import"
  gpg-type:
    required: false
    default: 'auto'
    description: "Type of GPG key to import (auto, private, public) - auto-detects based on file content"
  gpg-home:
    required: false
    default: ''
    description: "Path to GPG Home Directory (optional, can also be set via GNUPGHOME env variable)"

outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key"
    value: ${{ steps.import_protected.outputs.fingerprint || steps.import_unprotected.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.import_protected.outputs.keys_total || steps.import_unprotected.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.import_protected.outputs.keys_public || steps.import_unprotected.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.import_protected.outputs.keys_secret || steps.import_unprotected.outputs.keys_secret }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      id: mask_and_validate
      shell: bash
      run: |
        # Mask the passphrase if provided
        if [ -n '${{ inputs.pass }}' ]; then
          echo "::add-mask::${{ inputs.pass }}"
        fi
        
        if [ -z '${{ inputs.key }}' ]; then
          echo "::error::key input is required" >&2
          exit 1
        fi

    - name: Determine Key Type
      id: keytype
      if: inputs.gpg-type == 'auto'
      shell: bash
      env:
        GPG_KEY: '${{ inputs.key }}'
        GNUPGHOME: "${{ inputs.gpg-home }}"
      run: |
        # Auto-detect key type based on file content
        set -euo pipefail
        if [ ! -f "$GPG_KEY" ]; then
          echo "::error::GPG key file not found: $GPG_KEY" >&2
          exit 1
        fi
        
        if grep -qE "BEGIN PGP (PRIVATE|SECRET) KEY BLOCK" "$GPG_KEY"; then
          echo "key_type=secret" >> "$GITHUB_OUTPUT"
        elif grep -q "BEGIN PGP PUBLIC KEY BLOCK" "$GPG_KEY"; then
          echo "key_type=public" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Invalid GPG key format in file: $GPG_KEY" >&2
          exit 1
        fi

    - name: Import Protected Key
      id: import_protected
      if: (inputs.gpg-type == 'auto' && steps.keytype.outputs.key_type == 'secret') || inputs.gpg-type == 'private'
      uses: DCx7C5/actions/gpg-import/gpg-import-protected@v1
      with:
        key: '${{ inputs.key }}'
        pass: ${{ inputs.pass }}
        type: 'file'
        gpg-home: "${{ inputs.gpg-home }}"

    - name: Import Unprotected Key
      id: import_unprotected
      if: (inputs.gpg-type == 'auto' && steps.keytype.outputs.key_type == 'public') || inputs.gpg-type == 'public'
      uses: DCx7C5/actions/gpg-import/gpg-import-no-protection@v1
      with:
        key: '${{ inputs.key }}'
        gpg-home: "${{ inputs.gpg-home }}"

    - name: Delete key file after import (if requested)
      if: inputs.delete-after-import == 'true'
      shell: bash
      env:
        GNUPGHOME: "${{ inputs.gpg-home }}"
      run: |
        # Securely delete the key file after import if it's a private key and deletion is requested
        set -euo pipefail
        key_file='${{ inputs.key }}'
        if [ -f "$key_file" ]; then
          shred -vfz -n 11 "$key_file" || rm -f "$key_file"
          echo "::notice::GPG key file securely deleted: $key_file"
        fi
