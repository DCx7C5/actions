name: "Decrypt File (GPG/SSL/Plaintext Detection)"
description: "Detects encryption type (GPG, or plaintext) and decrypts accordingly"
author: "DCx7C5"

branding:
  icon: "unlock"
  color: "green"

inputs:
  key:
    required: true
    description: "GPG private key (inline for secret or file path) - will be masked in logs"
  pass:
    required: false
    default: ''
    description: "Password/Passphrase for decryption (GPG or SSL) - will be masked in logs"
  format:
    required: false
    default: 'pgp'
    description: "Output format: 'pgp' (with PGP headers) or 'ssl' (any)"


outputs:
  format:
    description: "Detected encryption type: 'gpg', 'ssl', or 'plaintext'"
    value: ${{ steps.decrypt.outputs.encryption_type }}
  decrypted_content:
    description: "The decrypted file content (format depends on 'format' input: base64, raw, or pgp-block)"
    value: ${{ steps.decrypt.outputs.decrypted_content }}


runs:
  using: composite
  steps:
    - name: Mask sensitive values
      shell: bash
      run: |
        if [ -n '${{ inputs.pass }}' ]; then
          echo "::add-mask::${{ inputs.pass }}"
          echo "::add-mask::${{ inputs.key }}"
        fi

    - name: Validate and detect encryption
      shell: bash
      run: |
        set -euo pipefail
        
        FILE_PATH="${{ inputs.key }}"
        
        if [ ! -f "$FILE_PATH" ]; then
          echo "::error::File not found: $FILE_PATH" >&2
          exit 1
        fi
        
        echo "::notice::Analyzing file: $FILE_PATH"

    - name: Detect encryption type
      id: detect
      shell: bash
      env:
        FILE_PATH: ${{ inputs.key }}
        PASS: '${{ inputs.pass }}'
        FORMAT: '${{ inputs.format }}'
      run: |
        set -euo pipefail
        
        trap 'unset PASS 2>/dev/null || true' EXIT
        
        _file_type=$(file -b "$FILE_PATH")
        if [[ "$FORMAT" == "ssl" ]] && grep -qi "^openssl" "$_file_type"; then
          if [[ head -c 8 "$FILE_PATH" == "Salted__" ]] || grep -qi "^data" "$_file_type"; then
            _encoding="binary"
          else
            _encoding="base64"
          fi
        elif [[ "$FORMAT" == "pgp" ]] && file -b --mime-type "$FILE_PATH" | grep -qi "pgp-keys$"; then
          if [[ "$FORMAT" == "pgp" ]] && head -1 "$FILE_PATH" | grep -q "^-----BEGIN PGP"; then
            _encoding="base64"
          elif od -An -t x1 -N 1 keybin | grep  "^ 95|^ C5|^ 96|^ C6"; then
            _encoding="binary"
          fi
        elif [[ "$FORMAT" == "raw" ]]; then
          _encoding="plaintext"
        fi
        
        echo "::notice::Detected encoding: ${_encoding:-unknown}"
        
        # Passphrase nur für verschlüsselte Dateien erzwingen
        if [[ "$_encoding" != "plaintext" && -z "$PASS" ]]; then
          echo "::error::Passphrase/password required for encrypted file" >&2
          exit 1
        fi
        
        echo "::notice::Decrypted content size: $FILE_SIZE bytes"
                
        
        # ===== Outputs (streamed, no plaintext buffering) =====
        
        echo "format=$FORMAT" >> "$GITHUB_OUTPUT"
        echo "enc_type=${_encoding}" >> "$GITHUB_OUTPUT"
        echo "decrypted_content<<__DECRYPTED_CONTENT__" >> "$GITHUB_OUTPUT"
        
        # Output format handling
        if [ "$_encoding" = "base64" ]; then
        
          if [ "$FORMAT" = "gpg" ]; then
            echo "$PASS" | gpg --no-tty --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt "$FILE_PATH" 2>/dev/null | base64 | tr -d '\n' >> "$GITHUB_OUTPUT"
          elif [ "$FORMAT" = "ssl" ]; then
            echo "$PASS" | openssl enc -d -aes-256-cbc -pbkdf2 -in "$FILE_PATH" -pass stdin 2>/dev/null | base64 | tr -d '\n' >> "$GITHUB_OUTPUT"
          else
            base64 "$FILE_PATH" | tr -d '\n' >> "$GITHUB_OUTPUT"
          fi
        
        elif [ "$FORMAT" = "raw" ]; then
          # Raw plaintext format (direct output)
          if [ "$_en" = "gpg" ]; then
            echo "$PASS" | gpg --no-tty --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt "$FILE_PATH" 2>/dev/null >> "$GITHUB_OUTPUT"
          elif [ "$ENCRYPTION_TYPE" = "ssl" ]; then
            echo "$PASS" | openssl enc -d -aes-256-cbc -pbkdf2 -in "$FILE_PATH" -pass stdin 2>/dev/null >> "$GITHUB_OUTPUT"
          else
            cat "$FILE_PATH" >> "$GITHUB_OUTPUT"
          fi
        
        elif [ "$FORMAT" = "pgp-block" ]; then
          # PGP block format (with headers/footers)
          if [ "$ENCRYPTION_TYPE" = "gpg" ]; then
            echo "-----BEGIN PGP PRIVATE KEY BLOCK-----" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$PASS" | gpg --no-tty --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt "$FILE_PATH" 2>/dev/null | base64 | tr -d '\n' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "-----END PGP PRIVATE KEY BLOCK-----" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PGP-block format only valid for GPG-encrypted files" >&2
            exit 1
          fi
        
        else
          echo "::error::Invalid format: $FORMAT. Must be one of: base64, raw, pgp-block" >&2
          exit 1
        fi
        
        echo "__DECRYPTED_CONTENT__" >> "$GITHUB_OUTPUT"

    - name: Decrypt PGP file
      if: inputs.format == 'gpg'
      shell: bash
      env:
        FILE_PATH: ${{ inputs.key_or_file }}
        PASS: '${{ inputs.pass }}'
      run: |
        set -euo pipefail

    - name: Decrypt SSL file
      if: inputs.format == 'ssl'
      shell: bash
      env:
        FILE_PATH: ${{ inputs.key_or_file }}
        PASS: '${{ inputs.pass }}'
      run: |
        set -euo pipefail