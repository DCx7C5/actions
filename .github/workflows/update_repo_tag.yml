name: "Update Repository Tag & Release"


on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: "update-tag-and-release"
  cancel-in-progress: true


jobs:
  update-tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag_latest
        uses: ./tag-get-latest
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Fail if latest tag is already up to date
        if: steps.tag_latest.outputs.tag_name != 'v1'
        shell: bash
        run: exit 0

      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        with:
          import-method: 'inline'
          key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-pass: ${{ secrets.GPG_PASSPHRASE }}
          delete-after-import: 'true'
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'true'
          gh-token: ${{ steps.app_token.outputs.token }}

      - name: Resolve previous release target
        id: previous_release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          target="$(gh release view v1 --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits since last release
        id: release_notes
        shell: bash
        env:
          PREV_TARGET: ${{ steps.previous_release.outputs.target }}
        run: |
          set -euo pipefail

          if [ -n "${PREV_TARGET}" ] && git rev-parse --verify "${PREV_TARGET}" >/dev/null 2>&1; then
            header="## Commits since last release (${PREV_TARGET:0:8})"
            notes="$(git log --no-merges --pretty=format:'- %h %s (%an)' "${PREV_TARGET}..HEAD" || true)"
          else
            header="## Commits in current release"
            notes="$(git log --no-merges --pretty=format:'- %h %s (%an)' -n 30 HEAD || true)"
          fi

          if [ -z "${notes}" ]; then
            notes="- No new commits."
          fi

          {
            echo "body<<EOF"
            echo "${header}"
            echo
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete old tag & release (if exists)
        id: tag_delete
        uses: ./tag-delete
        with:
          tag-name: "v1"
          delete-release: 'true'
          gh-token: ${{ steps.app_token.outputs.token }}

      - name: Create and push new signed Tag
        id: tag_create
        uses: ./tag-create-and-push
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          sign: 'true'
          version: "v1"
          commit-msg: "Release v1"
          pass: ${{ secrets.GPG_PASSPHRASE }}
          gpg-home: ${{ steps.gpg_import.outputs.gpg_home }}

      - name: Create release on GitHub
        id: release_create
        uses: ./gh-create-release
        env:
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
        with:
          gh-token: ${{ steps.app_token.outputs.token || env.GH_TOKEN || github.token }}
          release-tag: ${{ steps.tag_create.outputs.tag_name }}
          release-name: ${{ steps.tag_create.outputs.tag_name }}
          release-body: ${{ steps.release_notes.outputs.body }}
          generate-notes: 'false'
          fail-if-exists: 'false'
          prerelease: 'false'
          draft: 'false'

      - name: Cleanup GPG keys from runner
        if: steps.gpg_import.outputs.gpg_home != ''
        uses: ./gpg-cleanup
        with:
          gpg-home: ${{ steps.gpg_import.outputs.gpg_home }}

      - name: Notify on success
        if: success()
        uses: ./tg-notify-release
        with:
          tg-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          actor: ${{ github.actor }}
          fingerprint: ${{ steps.gpg_import.outputs.fingerprint }}
          tag-name: ${{ steps.tag_create.outputs.tag_name }}
          release-name: ${{ steps.tag_create.outputs.tag_name }}
