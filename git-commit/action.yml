name: "Create Git Commit"
description: "Create a Git commit with specified message and options"
author: "DCx7C5"


inputs:
  message:
    required: false
    description: "Commit message for the Git commit"
    default: ''
  copilot:
    required: false
    default: "false"
    description: "Whether the commit message was generated by GitHub Copilot (true/false)"
  amend:
    required: false
    default: "false"
    description: "Amend the previous commit instead of creating a new one (true/false)"
  signoff:
    required: false
    default: "false"
    description: "Add a Signed-off-by line to the commit message (true/false)"
  allow_empty:
    required: false
    default: "false"
    description: "Allow creating an empty commit when no staged changes exist (true/false)"
  no_verify:
    required: false
    default: "false"
    description: "Bypass pre-commit and commit-msg hooks (true/false)"
  gpg_sign:
    required: false
    default: "false"
    description: "GPG sign the commit (true/false)"
  gpg_key_id:
    required: false
    default: ""
    description: "GPG key ID to use for signing the commit (if gpg_sign is true)"
  gpg_passphrase:
    required: false
    default: ""
    description: "Passphrase for the GPG key (if gpg_sign is true and key is passphrase-protected)"
  pre_cached_pass:
    required: false
    default: "false"
    description: "Whether the GPG passphrase is already cached in the GPG agent (true/false)"
  skip_if_no_changes:
    required: false
    default: "true"
    description: "Skip commit when there are no staged changes (true/false)"
  github_token:
    required: false
    default: ''
    description: "GitHub token for API access (defaults to github.token)"

outputs:
  commit_sha:
    description: "SHA of the created commit (empty if no commit was made)"
    value: "${{ steps.commit.outputs.commit_sha }}"
  message:
    description: "Resolved commit message used by the action (input/copilot/fallback)"
    value: "${{ steps.commit.outputs.message }}"
  committed:
    description: "Whether a commit was created (true/false)"
    value: "${{ steps.commit.outputs.committed }}"
  amended:
    description: "Whether the commit was an amendment of the previous commit (true/false)"
    value: "${{ steps.commit.outputs.amended }}"


runs:
  using: composite
  steps:

    - name: Generate commit message with Copilot (if enabled and no message provided)
      if: inputs.copilot == 'true' && inputs.message == ''
      id: copilot_msg
      shell: bash
      run: |
        echo "Generating commit message with GitHub Copilot CLI..."
        GENERATED_MSG=$(gh copilot -p "Summarize this week's commits" --allow-tool 'shell(git)')
        
        if [[ -n "$GENERATED_MSG" ]]; then
          echo "Generated commit message:"
          echo "$GENERATED_MSG"
          echo "message=$GENERATED_MSG" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::GitHub Copilot CLI failed to generate a commit message – proceeding with empty message"
          echo "message=" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare commit command
      id: prepare
      shell: bash
      env:
        AMEND: ${{ inputs.amend }}
        ALLOW_EMPTY: ${{ inputs.allow_empty }}
        NO_VERIFY: ${{ inputs.no_verify }}
        SIGNOFF: ${{ inputs.signoff }}
        GPG_SIGN: ${{ inputs.gpg_sign }}
        GPG_KEYID: ${{ inputs.gpg_key_id }}
        SKIP_NO_CHANGES: ${{ inputs.skip_if_no_changes }}
      run: |
        commit_args=()
        
        if [[ "$AMEND" == "true" ]]; then
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "::error::Cannot amend – no previous commit exists" >&2
            exit 1
          fi
          commit_args+=("--amend" "--no-edit")
        fi
        
        [[ "$ALLOW_EMPTY" == "true" ]] && commit_args+=("--allow-empty")
        [[ "$NO_VERIFY" == "true" ]] && commit_args+=("--no-verify")
        [[ "$SIGNOFF" == "true" ]] && commit_args+=("--signoff")
        
        if [[ "$GPG_SIGN" == "true" ]]; then
          if [[ -n "$GPG_KEYID" ]]; then
            commit_args+=("--gpg-sign=$GPG_KEYID")
          else
            commit_args+=("--gpg-sign")
          fi
        
          if [[ -n "${{ inputs.gpg_passphrase }}" ]]; then
            echo "${{ inputs.gpg_passphrase }}" | \
              gpg --batch --pinentry-mode=loopback --passphrase-fd 0 \
                  --sign --local-user "${GPG_KEYID:-default}" \
                  --output /dev/null --yes || {
              echo "::error::GPG passphrase or key invalid – cannot sign commit" >&2
              exit 1
            }
          else
            echo "test" | gpg --batch --sign --output /dev/null || {
              echo "::error::GPG signing requested but key requires passphrase (provide gpg_passphrase)" >&2
              exit 1
            }
          fi
        fi
        
        echo "commit_args=${commit_args[*]}" >> "$GITHUB_OUTPUT"

    - name: Check for staged changes
      id: check_changes
      if: inputs.skip_if_no_changes == 'true'
      shell: bash
      run: |
        if git diff --cached --quiet; then
          echo "No staged changes → skipping commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No changes to commit – action completed without commit"
          exit 0
        else
          echo "committed=pending" >> "$GITHUB_OUTPUT"
        fi

    - name: Create the commit
      id: commit
      if: steps.check_changes.outputs.committed != 'false'
      shell: bash
      env:
        COMMIT_ARGS: ${{ steps.prepare.outputs.commit_args }}
        COMMIT_MSG: ${{ inputs.message }}
        COPILOT_MSG: ${{ steps.copilot_msg.outputs.message }}
        GPG_PASSPHRASE: ${{ inputs.gpg_passphrase }}
      run: |
        set -euo pipefail
        
        echo "Creating commit..."
        
        LAST_COMMIT_SHA=$(git log -1 --pretty=%H || git rev-parse --verify HEAD)
        
        
        FINAL_MSG="$COMMIT_MSG"
        if [[ -z "$FINAL_MSG" && -n "$COPILOT_MSG" ]]; then
          FINAL_MSG="$COPILOT_MSG"
        fi
        if [[ -z "$FINAL_MSG" ]]; then
          FINAL_MSG="chore: automated commit"
          echo "::notice::No commit message provided/generated; using fallback message."
        fi

        {
          echo "message<<EOF"
          echo "$FINAL_MSG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
        if [[ -n "${GPG_PASSPHRASE}" ]]; then
          if [[ "${{ inputs.pre_cached_pass }}" == "true" ]]; then
            git commit ${COMMIT_ARGS} -m "${FINAL_MSG}" 2>&1 | tee commit.log || {
              echo "::error::Commit failed (check GPG passphrase or key)" >&2
              cat commit.log
              exit 1
            }
          else
            echo "${GPG_PASSPHRASE}" | \
              git commit ${COMMIT_ARGS} -m "${FINAL_MSG}" 2>&1 | tee commit.log || {
              echo "::error::Commit failed (check GPG passphrase or key)" >&2
              cat commit.log
              exit 1
            }
          fi
          
        else
          git commit ${COMMIT_ARGS} -m "${FINAL_MSG}" || {
            echo "::error::Commit failed" >&2
            exit 1
          }
        fi
        
        COMMIT_SHA=$(git rev-parse HEAD)
        echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
        echo "committed=true" >> "$GITHUB_OUTPUT"
        echo "amended=${{ inputs.amend }}" >> "$GITHUB_OUTPUT"
        
        {
          echo "message<<<EOF"
          echo "$FINAL_MSG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
        echo "::group::Commit details:"
        if [[ "$COMMIT_SHA" != "$LAST_COMMIT_SHA" ]]; then
          git log -1 --pretty=fuller
          echo "✅ Commit created successfully: $COMMIT_SHA"
        elif [[ "$COMMIT_SHA" == "$LAST_COMMIT_SHA" && ${{ inputs.amend }} == 'true' ]]; then
          git log -1 --pretty=fuller
          echo "✅ Commit amended successfully: $COMMIT_SHA"
        else
          echo "::warn::⚠️ No new commit created (SHA unchanged: $COMMIT_SHA)"
        fi
        echo "::endgroup::"
