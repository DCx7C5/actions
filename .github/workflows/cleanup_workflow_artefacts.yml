name: "Cleanup Repository Workflow Artifacts"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # At 00:00 on Sunday.


jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Cleanup Canceled Workflow Artifacts
        uses: DCx7C5/actions/gh-workflow-run@v1
        with:
          action: 'delete'
          workflow_status: 'cancelled'
          gh-token: ${{ steps.app_token.outputs.token }}

      - name: Cleanup Failed Workflow Artifacts
        uses: DCx7C5/actions/gh-workflow-run@v1
        with:
          keep: '10'
          action: 'delete'
          workflow_status: 'failure'
          gh-token: ${{ steps.app_token.outputs.token }}

      #- name: Cleanup Successful Workflow Artifacts
