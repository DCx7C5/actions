name: "Get remote package changes from AUR"
description: "Get the list of changed package files between the current branch and the AUR repository, and optionally output a matrix of changes for GitHub Actions"
author: "DCx7C5"

branding:
  icon: git-branch
  color: blue

inputs:
  remote_name:
    required: false
    description: "Name of the remote to add for the AUR repository (default: upstream)"
    default: "upstream"
  remote_ref:
    required: false
    description: "Git reference to compare against (default: main)"
    default: "main"
  exclude_paths_delete:
    required: false
    description: "New-line separated list of paths to exclude from comparison (default: none)"
    default: ""
  exclude_paths_new:
    required: false
    description: "New-line separated list of paths to exclude from new/changed comparison (default: none)"
    default: ""
  exclude_paths_changed:
    required: false
    description: "New-line separated list of paths to exclude from changed comparison (default: none)"
    default: ""
    


outputs:
  has_updates:
    description: "Whether any new or changed package directories were detected"
    value: ${{ steps.get_new.outputs.new_dirs != '' || steps.get_changes.outputs.changed_dirs != '' }}
  has_removed:
    description: "Whether any removed package directories were detected"
    value: ${{ steps.get_removed.outputs.removed_dirs != '' }}
  new_dirs:
    description: "New package directories (exist in compare but not in base)"
    value: ${{ steps.get_new.outputs.new_dirs }}
  new_dirs_matrix:
    description: "JSON matrix for new package directories in GitHub Actions include format"
    value: ${{ steps.get_new.outputs.new_dirs_matrix }}
  changed_dirs:
    description: "Changed package directories (PKGBUILD differs between branches)"
    value: ${{ steps.get_changes.outputs.changed_dirs }}
  changed_dirs_matrix:
    description: "JSON matrix for changed package directories in GitHub Actions include format"
    value: ${{ steps.get_changes.outputs.changed_dirs_matrix }}
  removed_dirs:
    description: "Removed package directories (exist in base but not in compare)"
    value: ${{ steps.get_removed.outputs.removed_dirs }}
  removed_dirs_matrix:
    description: "JSON matrix for removed package directories in GitHub Actions include format"
    value: ${{ steps.get_removed.outputs.removed_dirs_matrix }}

runs:
  using: composite
  steps:
    - name: Get removed package directories
      id: get_removed
      shell: bash
      run: |
        set -euo pipefail
        
        exclude_args=()
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude_paths_delete }}"
        
        # Get list of removed files between current branch and upstream target_ref
        removed_files=$(git diff --no-renames --name-only --diff-filter=D HEAD "${{ inputs.remote_name }}/${{ inputs.remote_ref }}" -- . "${exclude_args[@]}")
        
        # Filter for PKGBUILD files and get unique directories
        removed_dirs=$(printf '%s\n' "$removed_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)
        
        # Save removed directories to output variable
        {
          echo "removed_dirs<<EOF"
          echo "$removed_dirs"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        removed_dirs_matrix=$(jq -Rn --arg dirs "$removed_dirs" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "removed_dirs_matrix=$removed_dirs_matrix" >> "$GITHUB_OUTPUT"


    - name: Get new package directories
      id: get_new
      shell: bash
      run: |
        set -euo pipefail
        
        exclude_args=()
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude_paths_new }}"

        # Get list of new files between current branch and upstream target_ref
        new_files=$(git diff --no-renames --name-only --diff-filter=A HEAD "${{ inputs.remote_name }}/${{ inputs.remote_ref }}" -- . "${exclude_args[@]}")
        
        # Filter for PKGBUILD files and get unique directories
        new_dirs=$(printf '%s\n' "$new_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)
        
        # Save new directories to output variable
        {
          echo "new_dirs<<EOF"
          echo "$new_dirs"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
        new_dirs_matrix=$(jq -Rn --arg dirs "$new_dirs" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "new_dirs_matrix=$new_dirs_matrix" >> "$GITHUB_OUTPUT"

    - name: Get changed package directories
      id: get_changes
      shell: bash
      run: |
        set -euo pipefail

        exclude_args=()
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude_paths_changed }}"

        # Get list of modified files between current branch and upstream target_ref
        changed_pkgbuild_files=$(git diff --no-renames --name-only --diff-filter=M HEAD "${{ inputs.remote_name }}/${{ inputs.remote_ref }}" -- . "${exclude_args[@]}")


        # Filter for modified PKGBUILD files and get unique directories.
        changed_dirs=$(printf '%s\n' "$changed_pkgbuild_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)

        # Save changed directories to output variable
        {
          echo "changed_dirs<<EOF"
          echo "$changed_dirs"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        changed_dirs_matrix=$(jq -Rn --arg dirs "$changed_dirs" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "changed_dirs_matrix=$changed_dirs_matrix" >> "$GITHUB_OUTPUT"

