#file: noinspection GithubFunctionSignatureValidation
name: "Push Docker Image to Registry"
description: "Push a Docker image to a registry (e.g., Docker Hub, GitHub Container Registry) with optional authentication and tagging"
author: "DCx7C5"


inputs:
  image-tag:
    description: "Name of the Docker image to push (e.g., 'my-image' or 'my-registry/my-image')"
    required: true
  image-version:
    description: "Version of the Docker image to push (defaults to 'latest')"
    required: true
    default: 'latest'
  registry:
    description: "URL of the Docker registry to push to (e.g., 'docker.io' for Docker Hub, 'ghcr.io' for GitHub Container Registry)"
    required: false
    default: 'ghcr.io'
  gh-token:
    description: "GitHub Token for authentication (required if pushing to GitHub Container Registry)"
    required: false
    default: ''
  user:
    description: "Username for registry login (defaults to github.actor)"
    required: false
    default: ''


outputs:
  full_image:
    description: "Full image reference that was pushed (e.g., ghcr.io/owner/image:version)"
    value: ${{ steps.push_image.outputs.full_image }}


runs:
  using: composite
  steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.user || github.actor }}
        password: ${{ inputs.gh-token || env.GH_TOKEN || github.token }}

    - id: push_image
      shell: bash
      env:
        REGISTRY: "${{ inputs.registry }}"
        IMAGE_TAG: "${{ inputs.image-tag }}"
        IMAGE_VERSION: "${{ inputs.image-version }}"
        OWNER: "${{ github.repository_owner }}"
      run: |
        set -euo pipefail

        if [[ -z "$IMAGE_TAG" || -z "$IMAGE_VERSION" || -z "$REGISTRY" ]]; then
          echo "::error::image-tag, image-version, and registry inputs are required." >&2
          exit 1
        fi

        registry="${REGISTRY,,}"
        registry="${registry%/}"
        owner="${OWNER,,}"

        # ghcr.io format: ghcr.io/OWNER/IMAGE:VERSION
        full_image="${registry}/${owner}/${IMAGE_TAG,,}:${IMAGE_VERSION}"

        echo "::notice::Tagging ${IMAGE_TAG}:${IMAGE_VERSION} → ${full_image}"
        docker tag "${IMAGE_TAG}:${IMAGE_VERSION}" "${full_image}"

        echo "::notice::Pushing ${full_image}..."
        docker push "${full_image}"

        echo "full_image=${full_image}" >> "$GITHUB_OUTPUT"

    - name: Logout
      if: always()
      shell: bash
      run: docker logout ${{ inputs.registry }}
