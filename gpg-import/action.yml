name: "Import GPG Keys"
description: "Smart dispatcher for importing GPG keys from various sources (secrets, files, or keyserver)"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"


inputs:
  gpg_key:
    required: false
    default: ''
    description: "GPG key (inline for 'secret', or file path for 'file', or fingerprint/identifier for 'keyserver')"
  pass:
    required: false
    default: ''
    description: "Passphrase/password for decryption (GPG or SSL)"
  keyserver_url:
    required: false
    default: 'hkps://keys.openpgp.org'
    description: "Keyserver URL to use for 'keyserver' method"
  delete_after_import:
    required: false
    default: 'true'
    description: "For 'file' method: securely delete private key file after import"
  method:
    required: false
    default: 'auto'
    description: "Import method to use (secret, file, keyserver)"
  gpg_home:
    required: false
    default: ''
    description: "Path to GPG Home Directory (optional, can also be set via GNUPGHOME env variable)"


outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key or keyserver import"
    value: ${{ steps.dispatch.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.dispatch.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.dispatch.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.dispatch.outputs.keys_secret }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      run: |
        if [ -n '${{ inputs.gpg_key }}' ]; then
          echo "::add-mask::${{ inputs.gpg_key }}"
        fi
        if [ -n '${{ inputs.pass }}' ]; then
          echo "::add-mask::${{ inputs.pass }}"
        fi

    - name: Validate GPG Key input
      id: validate
      uses: ./gpg-import/gpg-validate-import
      with:
        gpg_key: ${{ inputs.gpg_key }}

    - name: Decrypt SSL-encrypted key (if applicable)
      id: decrypt_ssl
      if: steps.validate.outputs.is_ssl_enc_and_armored_key == 'true' || steps.validate.outputs.is_ssl_enc_binary_key == 'true'
      uses: DCx7C5/actions/ssl-decrypt@v1
      with:
        enc_input: ${{ steps.validate.outputs.gpg_key }}
        passphrase: '${{ inputs.pass }}'
        type: ${{ steps.validate.outputs.is_file == 'true' && 'file' || 'inline' }}
        encoding: ${{ steps.validate.outputs.is_ssl_enc_binary_key == 'true' && 'binary' || 'text' }}
        cleanup: 'true'

    - name: Import from secret/variable/inline value
      id: inline_import
      if: steps.validate.outputs.is_secret == 'true'
      uses: ./gpg-import/gpg-import-inline
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }} || ${{ github.workspace }}/.gnupg
      with:
        gpg_key: ${{ steps.decrypt_ssl.outputs.gpg_key || steps.validate.outputs.gpg_key }}
        pass: ${{ inputs.pass }}

    - name: Import from file
      id: file_import
      if: steps.validate.outputs.is_file == 'true'
      uses: ./gpg-import/gpg-import-file
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }} || ${{ github.workspace }}/.gnupg
      with:
        gpg_key: ${{ steps.decrypt_ssl.outputs.decrypted_content || steps.validate.outputs.gpg_key }}
        pass: ${{ inputs.pass }}
        delete_after_import: ${{ inputs.delete_after_import }}

    - name: Import from keyserver
      id: keyserver_import
      if: steps.validate.outputs.is_fingerprint == 'true'
      uses: ./gpg-import/gpg-import-keyserver
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }} || ${{ github.workspace }}/.gnupg
      with:
        fingerprint: ${{ steps.validate.outputs.gpg_key }}
        keyserver_url: ${{ inputs.keyserver_url }}

    - name: Aggregate outputs
      id: dispatch
      shell: bash
      run: |
        # Determine which import method was used and propagate its outputs
        METHOD='${{ inputs.method }}'
        
        case "$METHOD" in
          secret)
            FP='${{ steps.secret_import.outputs.fingerprint }}'
            PUB='${{ steps.secret_import.outputs.keys_public }}'
            SEC='${{ steps.secret_import.outputs.keys_secret }}'
            TOT='${{ steps.secret_import.outputs.keys_total }}'
            ;;
          file)
            FP='${{ steps.file_import.outputs.fingerprint }}'
            PUB='${{ steps.file_import.outputs.keys_public }}'
            SEC='${{ steps.file_import.outputs.keys_secret }}'
            TOT='${{ steps.file_import.outputs.keys_total }}'
            ;;
          keyserver)
            FP='${{ steps.keyserver_import.outputs.fingerprint }}'
            PUB='${{ steps.keyserver_import.outputs.keys_public }}'
            SEC='${{ steps.keyserver_import.outputs.keys_secret }}'
            TOT='${{ steps.keyserver_import.outputs.keys_total }}'
            ;;
        esac
        
        echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
        echo "keys_public=$PUB" >> "$GITHUB_OUTPUT"
        echo "keys_secret=$SEC" >> "$GITHUB_OUTPUT"
        echo "keys_total=$TOT" >> "$GITHUB_OUTPUT"

    - name: Set Owner Trust (if private key imported)
      if: inputs.method != 'keyserver' && steps.validate.outputs.is_secretkey == 'true'
      uses: DCx7C5/actions/gpg-set-ownertrust@v1
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }} || ${{ github.workspace }}/.gnupg
      with:
        fingerprint: ${{ steps.dispatch.outputs.fingerprint }}
