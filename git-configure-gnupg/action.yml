name: "Configure GitHub clients for GPG signing"
description: "Configure GitHub (git & gh) client for GPG signing from GitHub Actions"
author: "DCx7C5"


inputs:
  key_id:
    description: "KeyID or Fingerprint of the GPG key to use for signing (optional, will use default key if not provided)"
    required: false
    default: ''
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: ''
  token:
    description: "GitHub token for gh CLI configuration (optional, will use GH_TOKEN environment variable if not provided)"
    required: false
    default: ''


outputs:
  fingerprint:
    description: "Fingerprint of the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.fingerprint }}
  name:
    description: "Name associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_name }}
  email:
    description: "Email associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_mail }}
  key_grips:
    description: "Keygrips of the GPG key used for signing (if available)"
    value: ${{ steps.parse_gpg.outputs.key_grips }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      if: inputs.key_id != ''
      run: |
        echo "::add-mask::${{ inputs.key_id }}"
        echo "::add-mask::$FINGERPRINT"
        echo "::add-mask::$INPUT_FINGERPRINT"

    - name: Parse Key Credentials
      id: parse_gpg
      shell: bash
      env:
        INPUT_FINGERPRINT: ${{ inputs.key_id }}
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      run: |
        set -euo pipefail
        
        GPG_NAME="GitHub Actions"
        GPG_MAIL="actions@github.com"
        GPG_EMPTY=$(gpg --with-colons --list-secret-keys 2>/dev/null | wc -l)
        
        if [[ -n "$INPUT_FINGERPRINT" && "$GPG_EMPTY" -eq 0 ]]; then
          echo "::error::Provided fingerprint not found in GNUPGHOME: $GNUPGHOME" >&2
          exit 1
        fi
        
        if [[ "$GPG_EMPTY" -ne 0 && -n "$INPUT_FINGERPRINT" ]]; then
          echo "::notice::Using provided GPG key with fingerprint: $INPUT_FINGERPRINT"
          FINGERPRINT=$(gpg --with-colons --list-secret-keys "$INPUT_FINGERPRINT" | awk -F: '/^fpr:/ {print $10; exit}')
        elif [[ "$GPG_EMPTY" -ne 0 && -z "$INPUT_FINGERPRINT" ]]; then
          echo "::notice::Using default GPG key found in GNUPGHOME: $GNUPGHOME"
          FINGERPRINT=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
        elif [[ "$GPG_EMPTY" -eq 0 ]]; then
          echo "::warning::No GPG keys found in GNUPGHOME: $GNUPGHOME, using fallback identity"
          FINGERPRINT=""
        fi
        
        if [[ -n "$FINGERPRINT" ]]; then
          UID_LINE=$(gpg --with-colons --list-secret-keys "$FINGERPRINT" 2>/dev/null | awk -F: '/^uid:/ {print $0; exit}')
        fi
        
        if [[ -n "$FINGERPRINT" && -n "$UID_LINE" ]]; then
          UID_DECODED=$(echo "$UID_LINE" | cut -d: -f10 | sed 's/%20/ /g; s/%3C/</g; s/%3E/>/g; s/%40/@/g')
          if [[ "$UID_DECODED" =~ ^([^<]+)[[:space:]]+\<(.*)\>$ ]]; then
            GPG_NAME="${BASH_REMATCH[1]//^[[:space:]]+|[[:space:]]+$/}"
            GPG_MAIL="${BASH_REMATCH[2]}"
          fi
        fi
        
        if [[ -n "$FINGERPRINT" ]]; then
          KEY_GRIPS=$(gpg --with-colons --list-secret-keys "$FINGERPRINT" 2>/dev/null | awk -F: '/^grp:/ {print $10}')
        else
          KEY_GRIPS=$(gpg --with-colons --list-secret-keys 2>/dev/null | awk -F: '/^grp:/ {print $10}')
        fi
        
        echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
        echo "gpg_name=$GPG_NAME" >> "$GITHUB_OUTPUT"
        echo "gpg_mail=$GPG_MAIL" >> "$GITHUB_OUTPUT"
        echo "gpg_empty=$GPG_EMPTY" >> "$GITHUB_OUTPUT"
        
        echo "key_grips<<EOF"
        echo "$KEY_GRIPS"
        echo "EOF" >> "$GITHUB_OUTPUT"
        

    - name: Configure git for GPG signing
      id: gitconfig
      if: steps.parse_gpg.outputs.gpg_empty != '0'
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        GPG_NAME: ${{ steps.parse_gpg.outputs.gpg_name }}
        GPG_MAIL: ${{ steps.parse_gpg.outputs.gpg_mail }}
        FINGERPRINT: ${{ steps.parse_gpg.outputs.fingerprint }}
        GH_TOKEN: ${{ inputs.token || env.GH_TOKEN }}
      run: |
        set -euo pipefail
        
        GPG_WRAPPER="$GNUPGHOME/gpg-loopback.sh"
        {
          echo '#!/usr/bin/env bash'
          echo 'set -euo pipefail'
          echo 'exec gpg --batch --no-tty --pinentry-mode loopback "$@"'
        } > "$GPG_WRAPPER"
        chmod 700 "$GPG_WRAPPER"
        
        echo "::debug::Created GPG wrapper at: $GPG_WRAPPER"
        echo "::debug::Wrapper contents:"
        cat "$GPG_WRAPPER" | while IFS= read -r line; do echo "::debug::  $line"; done

        git config --global user.name "$GPG_NAME"
        git config --global user.email "$GPG_MAIL"
        git config --global user.signingkey "$FINGERPRINT"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true
        git config --global tag.forceSignAnnotated true
        git config --global gpg.program "$GPG_WRAPPER"

        command -v gh >/dev/null 2>&1 && \
          gh config set -h github.com git_protocol https

        echo "::notice::Configured git with GPG key: $FINGERPRINT (${GPG_NAME} <${GPG_MAIL}>)"
