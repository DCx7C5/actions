name: "Import GPG Keys (Secure)"
description: "Import GPG Keys from GitHub Actions"
author: "DCx7C5"

inputs:
  gpg_priv:
    required: false
    default: ''
    description: "GPG private key or path to private key file (will be masked in logs)"
  gpg_pass:
    required: false
    default: ''
    description: "GPG key passphrase (will be masked in logs)"
  gpg_pub:
    required: false
    default: ''
    description: "GPG public key or path to public key file, or key fingerprint for keyserver import"
  from_file:
    required: false
    default: 'false'
    description: "Import from files instead of secrets"
  from_secrets:
    required: false
    default: 'false'
    description: "Import from secrets/environment variables"
  from_keyserver:
    required: false
    default: 'false'
    description: "Import from keyserver (gpg_pub should be the fingerprint)"
  keyserver_url:
    required: false
    default: 'hkps://keys.openpgp.org'
    description: "Keyserver URL to use for imports (e.g., hkps://keys.openpgp.org, hkps://keyserver.ubuntu.com)"

outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key"
    value: ${{ steps.gpg_import.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.gpg_import.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.gpg_import.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.gpg_import.outputs.keys_secret }}

runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      run: |
        if [ -n "${{ inputs.gpg_priv }}" ]; then
          echo "::add-mask::${{ inputs.gpg_priv }}"
        fi
        if [ -n "${{ inputs.gpg_pass }}" ]; then
          echo "::add-mask::${{ inputs.gpg_pass }}"
        fi
        if [ -n "${{ inputs.gpg_pub }}" ]; then
          echo "::add-mask::${{ inputs.gpg_pub }}"
        fi

    - name: Validate inputs and environment
      shell: bash
      run: |
        set -euo pipefail
        
        # Check GNUPGHOME
        if [ -z "${GNUPGHOME:-}" ] || [ ! -d "${GNUPGHOME}" ]; then
          echo "::error::GNUPGHOME not set or does not exist: ${GNUPGHOME:-'(empty)'}" >&2
          exit 1
        fi
        
        # Check that at least one key source is provided
        if [ -z "${{ inputs.gpg_priv }}" ] && [ -z "${{ inputs.gpg_pub }}" ]; then
          echo "::error::Either gpg_priv or gpg_pub input is required" >&2
          exit 1
        fi
        
        # Check that exactly one import method is selected
        FROM_SECRETS="${{ inputs.from_secrets }}"
        FROM_FILE="${{ inputs.from_file }}"
        FROM_KEYSERVER="${{ inputs.from_keyserver }}"
        
        # Count how many import methods are set to true
        IMPORT_METHODS=0
        [ "$FROM_SECRETS" = "true" ] && ((IMPORT_METHODS++))
        [ "$FROM_FILE" = "true" ] && ((IMPORT_METHODS++))
        [ "$FROM_KEYSERVER" = "true" ] && ((IMPORT_METHODS++))
        
        if [ $IMPORT_METHODS -eq 0 ]; then
          echo "::error::At least one import method must be set: from_secrets, from_file, or from_keyserver" >&2
          exit 1
        fi
        
        if [ $IMPORT_METHODS -gt 1 ]; then
          echo "::error::Cannot use multiple import methods at the same time. Choose only one: from_secrets, from_file, or from_keyserver" >&2
          exit 1
        fi
        
        # Check passphrase when private key is provided (not needed for keyserver-only imports)
        if [ -n "${{ inputs.gpg_priv }}" ] && [ -z "${{ inputs.gpg_pass }}" ]; then
          echo "::error::gpg_pass (passphrase) is required when importing a private key" >&2
          exit 1
        fi

    - name: Import GPG Keys
      id: gpg_import
      shell: bash
      env:
        GPG_PRIV: ${{ inputs.gpg_priv }}
        GPG_PASS: ${{ inputs.gpg_pass }}
        GPG_PUB: ${{ inputs.gpg_pub }}
        FROM_SECRETS: ${{ inputs.from_secrets }}
        FROM_FILE: ${{ inputs.from_file }}
        FROM_KEYSERVER: ${{ inputs.from_keyserver }}
        KEYSERVER_URL: ${{ inputs.keyserver_url }}
      run: |
        set -euo pipefail
        
        trap 'unset GPG_PASS GPG_PRIV 2>/dev/null || true' EXIT
        
        # ===== Import Private Key =====
        if [ -n "$GPG_PRIV" ]; then
          if [ "$FROM_SECRETS" = "true" ]; then
            # Import from secret (inline key material)
            if echo "$GPG_PRIV" | gpg --no-tty --batch --pinentry-mode loopback \
               --passphrase "$GPG_PASS" --import 2>&1 | grep -q "imported\|unchanged"; then
              echo "::notice::Private key imported successfully from secret"
            else
              echo "::error::Failed to import private key from secret" >&2
              exit 1
            fi
          elif [ "$FROM_FILE" = "true" ]; then
            # Import from file
            if [ ! -f "$GPG_PRIV" ]; then
              echo "::error::Private key file not found: $GPG_PRIV" >&2
              exit 1
            fi
            
            if gpg --no-tty --batch --pinentry-mode loopback \
               --passphrase "$GPG_PASS" --import "$GPG_PRIV" 2>&1 | grep -q "imported\|unchanged"; then
              echo "::notice::Private key imported successfully from file"
              
              # Securely delete the file after import
              if command -v shred &>/dev/null; then
                shred -vfz -n 3 "$GPG_PRIV" 2>/dev/null || true
              else
                rm -f "$GPG_PRIV"
              fi
              echo "::notice::Private key file securely removed"
            else
              echo "::error::Failed to import private key from file: $GPG_PRIV" >&2
              exit 1
            fi
          fi
        fi
        
        # ===== Import Public Key =====
        if [ -n "$GPG_PUB" ]; then
          if [ "$FROM_SECRETS" = "true" ]; then
            # Import from secret (inline key material)
            if echo "$GPG_PUB" | gpg --no-tty --batch --import 2>&1 | grep -q "imported\|unchanged"; then
              echo "::notice::Public key imported successfully from secret"
            else
              echo "::error::Failed to import public key from secret" >&2
              exit 1
            fi
          elif [ "$FROM_FILE" = "true" ]; then
            # Import from file
            if [ ! -f "$GPG_PUB" ]; then
              echo "::error::Public key file not found: $GPG_PUB" >&2
              exit 1
            fi
            
            if gpg --no-tty --batch --import "$GPG_PUB" 2>&1 | grep -q "imported\|unchanged"; then
              echo "::notice::Public key imported successfully from file"
            else
              echo "::error::Failed to import public key from file: $GPG_PUB" >&2
              exit 1
            fi
          elif [ "$FROM_KEYSERVER" = "true" ]; then
            # Import from keyserver using fingerprint
            if [ -z "$GPG_PUB" ] || [ ${#GPG_PUB} -lt 16 ]; then
              echo "::error::Invalid fingerprint for keyserver import. gpg_pub must be a valid GPG fingerprint (at least 16 characters)" >&2
              exit 1
            fi
            
            echo "::notice::Importing public key from keyserver: $KEYSERVER_URL"
            if gpg --no-tty --batch --keyserver "$KEYSERVER_URL" --recv-keys "$GPG_PUB" 2>&1 | grep -q "imported\|unchanged"; then
              echo "::notice::Public key imported successfully from keyserver"
            else
              echo "::error::Failed to import public key from keyserver: $KEYSERVER_URL" >&2
              exit 1
            fi
          fi
        fi
        
        # ===== Count Keys =====
        KEY_COUNT_PUB=$(gpg --list-keys --with-colons 2>/dev/null | grep -c "^pub:" || echo "0")
        KEY_COUNT_SEC=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec:" || echo "0")
        KEY_COUNT_TOTAL=$((KEY_COUNT_PUB + KEY_COUNT_SEC))
        
        echo "::notice::GPG Keys - Public: $KEY_COUNT_PUB, Secret: $KEY_COUNT_SEC, Total: $KEY_COUNT_TOTAL"
        
        # ===== Set Owner Trust =====
        if [ -n "$GPG_PRIV" ]; then
          FINGERPRINT=$(gpg --batch --list-secret-keys --with-colons 2>/dev/null | grep "^fpr:" | head -1 | cut -d: -f10)
          
          if [ -n "$FINGERPRINT" ]; then
            echo "$FINGERPRINT:6:" | gpg --import-ownertrust 2>/dev/null || true
            echo "::notice::Owner trust level set for fingerprint: $FINGERPRINT"
            echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not determine fingerprint for owner trust setup"
            echo "fingerprint=" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "fingerprint=" >> "$GITHUB_OUTPUT"
        fi
        
        # ===== Outputs =====
        echo "keys_public=$KEY_COUNT_PUB" >> "$GITHUB_OUTPUT"
        echo "keys_secret=$KEY_COUNT_SEC" >> "$GITHUB_OUTPUT"
        echo "keys_total=$KEY_COUNT_TOTAL" >> "$GITHUB_OUTPUT"
