name: "Import GPG Keys from Secrets"
description: "Import GPG keys from GitHub Actions secrets or environment variables"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"

inputs:
  gpg_key:
    required: false
    default: ''
    description: "GPG key (inline) - will be masked in logs"
  pass:
    required: false
    default: ''
    description: "Passphrase for the private key - will be masked in logs"


outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key"
    value: ${{ steps.import.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.import.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.import.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.import.outputs.keys_secret }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      run: |
        if [ -n '${{ inputs.gpg_key }}' ]; then
          echo "::add-mask::${{ inputs.gpg_key }}"
        fi
        if [ -n '${{ inputs.pass }}' ]; then
          echo "::add-mask::${{ inputs.pass }}"
        fi

    - name: Validate inputs and environment
      shell: bash
      run: |
        set -euo pipefail
        
        if [ -z "${GNUPGHOME:-}" ] || [ ! -d "${GNUPGHOME}" ]; then
          echo "::error::GNUPGHOME not set or does not exist: ${GNUPGHOME:-'(empty)'}" >&2
          exit 1
        fi
        
        if [ -z '${{ inputs.gpg_key }}' ]; then
          echo "::error::gpg_key input is required" >&2
          exit 1
        fi

    - name: Get Key Type
      id: keytype
      shell: bash
      env:
        GPG_KEY: '${{ inputs.gpg_key }}'
      run: |
        set -euo pipefail
        header=(echo "$GPG_KEY" | head -n 1)
        if [[ "$header" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
          echo "seckey=$GPG_KEY" >> "$GITHUB_OUTPUT"
        elif [[ "$header" == *"BEGIN PGP PUBLIC KEY BLOCK"* ]]; then
          echo "pubkey=$GPG_KEY" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Invalid GPG key format: missing PGP block header" >&2
          exit 1
        fi

    - name: Import GPG keys from secrets
      id: import
      shell: bash
      env:
        GPG_PRIV: '${{ steps.keytype.outputs.seckey }}'
        PASS: '${{ inputs.pass }}'
        GPG_PUB: '${{ steps.keytype.outputs.pubkey }}'
      run: |
        set -euo pipefail
        
        # Source helper library
        source "${{ github.action_path }}/../lib/gpg-helpers.sh"
        
        trap 'unset PASS GPG_PRIV 2>/dev/null || true' EXIT
        
        # ===== Import Private Key =====
        if [ -n "$GPG_PRIV" ]; then
          if echo "$GPG_PRIV" | gpg --no-tty --batch --pinentry-mode loopback \
             --passphrase "$PASS" --import 2>&1 | grep -qE "imported|unchanged"; then
            echo "::notice::Private key imported successfully from secret"
          else
            echo "::error::Failed to import private key from secret" >&2
            exit 1
          fi
        fi
        
        # ===== Import Public Key =====
        if [ -n "$GPG_PUB" ]; then
          if echo "$GPG_PUB" | gpg --no-tty --batch --import 2>&1 | grep -qE "imported|unchanged"; then
            echo "::notice::Public key imported successfully from secret"
          else
            echo "::error::Failed to import public key from secret" >&2
            exit 1
          fi
        fi

        # ===== Count Keys =====
        read -r KEY_COUNT_TOTAL KEY_COUNT_PUB KEY_COUNT_SEC <<< "$(gpg_count_keys)"
        gpg_log_key_stats "$KEY_COUNT_TOTAL" "$KEY_COUNT_PUB" "$KEY_COUNT_SEC"
        
        # ===== Outputs =====
        echo "fingerprint=$(gpg_get_fingerprint)" >> "$GITHUB_OUTPUT"
        echo "keys_public=$KEY_COUNT_PUB" >> "$GITHUB_OUTPUT"
        echo "keys_secret=$KEY_COUNT_SEC" >> "$GITHUB_OUTPUT"
        echo "keys_total=$KEY_COUNT_TOTAL" >> "$GITHUB_OUTPUT"
