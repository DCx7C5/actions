name: "Run updpkgsums to update PKGBUILD checksums"
description: "Runs updpkgsums on all PKGBUILD files to update their checksums"
author: "DCx7C5"


inputs:
  pkg_name:
    required: true
    description: "Name of the package to update"
  working_directory:
    required: false
    description: "Working directory to run makepkg in (default: the repository root or current directory if github.workspace is not set)"
    default: ''


runs:
  using: composite
  steps:
    - id: run_updpkgsums
      uses: DCx7C5/actions/arch-run-cmd@v1
      working-directory: ${{ inputs.working_directory || github.workspace || '.' }}
      with:
        run-with-sudo: 'false'
        enable-ccache: 'false'
        preset-passphrase-cache: 'false'
        command: |
          set -euo pipefail
          
          cd "${{ inputs.pkg_name }}"
          echo "::group::Running updpkgsums for package '${{ inputs.pkg_name }}'"
          updpkgsums
          echo "::endgroup::"
          echo "::notice::updpkgsums completed successfully for package '${{ inputs.pkg_name }}'"
