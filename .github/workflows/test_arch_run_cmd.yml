name: "Test arch-run-cmd:latest"


on:
  workflow_dispatch:
    inputs:
      user:
        description: "User name inside the container"
        required: false
        default: 'runner'
        type: string
      enable_ccache:
        description: "Enable ccache in the Arch Run Command Action"
        required: false
        default: true
        type: boolean
      run_with_sudo:
        description: "Whether to run the command with sudo inside the container"
        required: false
        default: true
        type: boolean


  push:
    branches:
      - main
    paths:
      - arch-run-cmd/**
      - .github/workflows/test_arch_run_cmd.yml


concurrency:
  group: 'test-arch-run-cmd-${{ github.ref }}'
  cancel-in-progress: true


jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      packages: write
      contents: write
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          repositories: actions

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Build Docker image
        id: build_image
        uses: ./docker-build-image
        with:
          image-working-directory: ${{ github.workspace }}/arch-run-cmd
          runtime-working-directory: ${{ github.workspace }}
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          ccache-dir: ${{ format('{0}/.ccache', github.workspace) }}
          user: runner
          group: runner
          uid: '1001'
          gid: '127'
          gh-token: ${{ steps.app_token.outputs.token }}
          image-tag: 'arch-run-cmd'
          image-version: 'latest'
          dockerfile-path: Dockerfile

      - name: Push Docker image
        id: push_image
        if: steps.build_image.outcome == 'success'
        uses: ./docker-push-image
        with:
          registry: 'ghcr.io'
          user: ${{ github.actor }}
          image-tag: 'arch-run-cmd'
          image-version: 'latest'
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        with:
          import-method: 'inline'
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-pass: ${{ secrets.GPG_PASSPHRASE }}
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'false'
          gh-token: ${{ steps.app_token.outputs.token }}

      - name: Test Arch Run Command Action
        id: test_arch_run_cmd
        uses: ./arch-run-cmd
        with:
          gh-token: ${{ steps.app_token.outputs.token }}
          enable-ccache: ${{ inputs.enable_ccache && 'true' || 'false' }}
          working-directory: ${{ github.workspace }}
          gpg-key-id: ${{ steps.gpg_import.outputs.fingerprint }}
          gpg-keygrips: ${{ steps.gpg_import.outputs.key_grips }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-home: ${{ steps.gpg_import.outputs.gpg_home }}
          preset-passphrase-cache: 'false'
          run-with-sudo: ${{ inputs.run_with_sudo && 'true' || 'false' }}
          command: 'ls -la / && whoami && gpg --list-keys && echo "Hello from inside the Arch Linux container!"'

      - name: Job Summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_image.outcome }}
          PUSH_OUTCOME: ${{ steps.push_image.outcome }}
          GPG_OUTCOME: ${{ steps.gpg_import.outcome }}
          GPG_FP: ${{ steps.gpg_import.outputs.fingerprint }}
          RUN_OUTCOME: ${{ steps.test_arch_run_cmd.outcome }}
          RUN_USER: ${{ inputs.user || 'runner' }}
          SUDO: ${{ inputs.run_with_sudo && 'true' || 'false' }}
          CCACHE: ${{ inputs.enable_ccache && 'true' || 'false' }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '\u2714' || printf '\u2718'; }

          {
            echo "### Arch Run Command Test"
            echo ""
            echo "| Step | Status |"
            echo "|:-----|:------:|"
            echo "| Build Image | $(s "$BUILD_OUTCOME") \`${BUILD_OUTCOME}\` |"
            echo "| Push Image | $(s "$PUSH_OUTCOME") \`${PUSH_OUTCOME}\` |"
            echo "| GPG Import | $(s "$GPG_OUTCOME") \`${GPG_OUTCOME}\` |"
            echo "| Container Run | $(s "$RUN_OUTCOME") \`${RUN_OUTCOME}\` |"
            echo ""
            echo "| Parameter | Value |"
            echo "|:----------|:------|"
            echo "| User | \`${RUN_USER}\` |"
            echo "| Sudo | \`${SUDO}\` |"
            echo "| ccache | \`${CCACHE}\` |"
            [[ -n "$GPG_FP" ]] && echo "| GPG Key | \`${GPG_FP:(-16)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
