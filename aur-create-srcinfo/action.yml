name: "Create .SRCINFO file for AUR package"
description: "Generates a .SRCINFO file for an AUR package using makepkg"
author: "DCx7C5"


inputs:
  pkg-name:
    required: true
    description: "Name of the package to create .SRCINFO for (should match the directory name containing the PKGBUILD)"
  working-directory:
    required: false
    description: "Working directory to run makepkg in (default: the repository root or current directory if github.workspace is not set)"
    default: ''


runs:
  using: composite
  steps:
    - id: create_srcinfo
      uses: DCx7C5/actions/arch-run-cmd@v1
      working-directory: ${{ inputs.working-directory || github.workspace || '.' }}
      with:
        run-with-sudo: 'false'
        enable-ccache: 'false'
        preset-passphrase-cache: 'false'
        command: |
          set -euo pipefail
          
          cd "${{ inputs.pkg-name }}"
          
          makepkg --printsrcinfo > .SRCINFO
          echo "::notice::.SRCINFO file created successfully for package '${{ inputs.pkg-name }}'"
