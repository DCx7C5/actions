name: "Test Arch Run Command Action"


on:
  workflow_dispatch:
    inputs:
      user:
        description: "User name to create inside the container"
        required: false
        default: 'runner'
        type: string
      image_tag:
        description: "The name of the Docker image to build and run"
        required: false
        default: 'arch-run-cmd'
        type: string
      image_version:
        description: "The version tag of the Docker image to build and run"
        required: false
        default: 'latest'
        type: string
      enable_ccache:
        description: "Enable ccache in the Arch Run Command Action"
        required: false
        default: true
        type: boolean
      run_with_sudo:
        description: "Whether to run the command with sudo inside the container"
        required: false
        default: true
        type: boolean


  push:
    branches:
      - main
    paths:
      - arch-run-cmd/**
      - .github/workflows/test_arch_run_cmd.yml


concurrency:
  group: 'test-arch-run-cmd-${{ github.ref }}'
  cancel-in-progress: true


jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      packages: write
      contents: write
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          repositories: actions

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          method: 'inline'
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          delete_after_import: 'true'
          configure_git: 'true'
          setup_home: 'true'
          preset_pass: 'false'

      - name: Test Arch Run Command Action
        id: test_arch_run_cmd
        uses: ./arch-run-cmd
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          gh-token: ${{ steps.app_token.outputs.token }}
          image-tag: ${{ inputs.image_tag || 'arch-run-cmd' }}
          image-version: ${{ inputs.image_version || 'latest' }}
          enable-ccache: ${{ inputs.enable_ccache && 'true' || 'false' }}
          working-directory: ${{ github.workspace }}
          gpg-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-key-id: ${{ steps.gpg_import.outputs.fingerprint }}
          gpg-keygrips: ${{ steps.gpg_import.outputs.key_grips }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-home: ${{ steps.gpg_import.outputs.gpg_home }}
          import-key-during-build: 'false'
          preset-passphrase-cache: 'false'
          run-with-sudo: ${{ inputs.run_with_sudo && 'true' || 'false' }}
          user: ${{ inputs.user || 'runner' }}
          command: 'ls -la / && whoami && echo "Hello from inside the Arch Linux container!"'

      - name: Job Summary
        if: always()
        env:
          GPG_OUTCOME: ${{ steps.gpg_import.outcome }}
          GPG_FP: ${{ steps.gpg_import.outputs.fingerprint }}
          RUN_OUTCOME: ${{ steps.test_arch_run_cmd.outcome }}
          IMAGE_TAG: ${{ inputs.image_tag || 'arch-run-cmd' }}
          IMAGE_VERSION: ${{ inputs.image_version || 'latest' }}
          RUN_USER: ${{ inputs.user || 'runner' }}
          SUDO: ${{ inputs.run_with_sudo && 'true' || 'false' }}
          CCACHE: ${{ inputs.enable_ccache && 'true' || 'false' }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '\u2714' || printf '\u2718'; }

          {
            echo "### Arch Run Command Test"
            echo ""
            echo "| Step | Status |"
            echo "|:-----|:------:|"
            echo "| GPG Import | $(s "$GPG_OUTCOME") \`${GPG_OUTCOME}\` |"
            echo "| Container Run | $(s "$RUN_OUTCOME") \`${RUN_OUTCOME}\` |"
            echo ""
            echo "| Parameter | Value |"
            echo "|:----------|:------|"
            echo "| Image | \`${IMAGE_TAG}:${IMAGE_VERSION}\` |"
            echo "| User | \`${RUN_USER}\` |"
            echo "| Sudo | \`${SUDO}\` |"
            echo "| ccache | \`${CCACHE}\` |"
            [[ -n "$GPG_FP" ]] && echo "| GPG Key | \`${GPG_FP:(-16)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

