name: "Test Arch Run Command Action"
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "The name of the Docker image to build and run"
        required: false
        default: 'arch-run-cmd'
        type: string
      image_version:
        description: "The version tag of the Docker image to build and run"
        required: false
        default: 'latest'
        type: string
      enable_ccache:
        description: "Enable ccache in the Arch Run Command Action"
        required: false
        default: true
        type: boolean
      run_with_sudo:
        description: "Whether to run the command with sudo inside the container (for testing root permissions)"
        required: false
        default: true
        type: boolean
      passphrase:
        description: "Passphrase for GPG key (if needed, will be passed via environment variable)"
        required: false
        default: ''
        type: string
      gpg_key:
        description: "GPG private key to import into the container (if needed, should be provided as a secret and passed via environment variable)"
        required: false
        default: ''
        type: string
      gpg_key_id:
        description: "GPG key ID or fingerprint to use for signing (if needed, will be passed via environment variable)"
        required: false
        default: ''
        type: string
      gpg_keygrips:
        description: "Keygrips of GPG keys to preset in gpg-agent cache (if needed, will be passed via environment variable as a comma-separated list)"
        required: false
        default: ''
        type: string

  push:
    branches:
      - main
    paths:
      - 'arch-run-cmd/action.yml'
      - 'docker-build-image/action.yml'
      - 'docker-push-image/action.yml'
      - 'docker-run-image/action.yml'
      - '.github/workflows/test_arch_run_cmd.yml'


concurrency:
  group: 'test-arch-run-cmd'
  cancel-in-progress: true

jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          permission-packages: 'write'
          repositories: |
            actions
            
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Import GPG key
        id: gpg_import
        uses: ./gpg-import
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          method: 'inline'
          gpg_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_pass: ${{ secrets.GPG_PASSPHRASE }}
          delete_after_import: 'true'
          configure_git: 'true'
          setup_home: 'true'
          preset_pass: 'false'

      - name: Test Arch Run Command Action
        id: test_arch_run_cmd
        uses: ./arch-run-cmd
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          gh_token: ${{ steps.app_token.outputs.token }}
          image_tag: ${{ inputs.image_tag || 'arch-run-cmd' }}
          image_version: ${{ inputs.image_version || 'latest' }}
          enable_ccache: ${{ inputs.enable_ccache }}
          working_directory: ${{ github.workspace }}
          gpg_key: ${{ inputs.gpg_key || steps.gpg_import.outputs.gpg_key || '' }}
          gpg_key_id: ${{ inputs.gpg_key_id || steps.gpg_import.outputs.gpg_key_id || '' }}
          gpg_keygrips: ${{ inputs.gpg_keygrips || steps.gpg_import.outputs.gpg_keygrips || '' }}
          gpg_passhphrase: ${{ inputs.passphrase || '' }}
          gpg_home: ${{ inputs.gpg_home || steps.gpg_import.outputs.gpg_home }}
          import_key_during_build: 'false'
          preset_passphrase_cache: 'false'
          run_with_sudo: 'true'
          command: 'ls -la / && whoami && echo "Hello from inside the Arch Linux container!"'
