name: "Test GPG Key Import"


on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gpg-import/**
      - gpg-setup-home/action.yml
      - gpg-preset-pass/action.yml
      - git-configure-gnupg/action.yml
      - gpg-set-ownertrust/action.yml
      - .github/workflows/test_gpg_import.yml


concurrency:
  group: 'test-gpg-import-${{ github.ref }}'
  cancel-in-progress: true


jobs:

  test-inline-import:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          repositories: actions

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Import GPG key (inline, protected)
        id: gpg_import
        uses: ./gpg-import
        with:
          key: ${{ secrets.GPG_PRIVATE_KEY }}
          import-method: 'inline'
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          gpg-pass: ${{ secrets.GPG_PASSPHRASE }}
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'true'
          gh-token: ${{ steps.app_token.outputs.token }}

      - name: Verify import
        id: verify
        env:
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
          GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
          KEY_GRIPS: ${{ steps.gpg_import.outputs.key_grips }}
          KEYS_SECRET: ${{ steps.gpg_import.outputs.keys_secret }}
          KEYS_PUBLIC: ${{ steps.gpg_import.outputs.keys_public }}
        run: |
          set -euo pipefail

          echo "verify_ok=false" >> "$GITHUB_OUTPUT"

          # 1) fingerprint output must exist
          if [[ -z "$FP" ]]; then
            echo "::error::No fingerprint returned from gpg-import"
            exit 1
          fi

          # 2) key must be in the secret keyring
          if ! gpg --batch --list-secret-keys "$FP" >/dev/null 2>&1; then
            echo "::error::Imported key $FP not found in secret keyring"
            exit 1
          fi

          # 3) git signing key must match
          git_key="$(git config --global user.signingkey || true)"
          if [[ "$git_key" != "$FP" ]]; then
            echo "::error::Git signing key ($git_key) does not match imported fingerprint ($FP)"
            exit 1
          fi

          # 4) test signing with explicit passphrase
          if ! echo "gpg-test" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASS" --local-user "$FP" --armor --detach-sign >/dev/null 2>&1; then
            echo "::error::Test signing with key $FP failed"
            exit 1
          fi

          # 5) verify owner trust is set to ultimate (level 6 in export format = trust level 5 input)
          trust_line="$(gpg --export-ownertrust 2>/dev/null | grep "$FP" || true)"
          if [[ -z "$trust_line" ]]; then
            echo "::error::Owner trust not set for key $FP"
            exit 1
          fi
          if [[ "$trust_line" != *":6:" ]]; then
            echo "::error::Owner trust for $FP is not ultimate. Got: $trust_line"
            exit 1
          fi

          # 6) verify key_grips output is non-empty
          if [[ -z "$KEY_GRIPS" ]]; then
            echo "::error::key_grips output is empty"
            exit 1
          fi

          # 7) verify key counts are sane
          if [[ "${KEYS_SECRET:-0}" -lt 1 ]]; then
            echo "::error::Expected at least 1 secret key, got ${KEYS_SECRET:-0}"
            exit 1
          fi

          # 8) test signing via gpg-agent cache (without explicit passphrase)
          if ! echo "agent-cache-test" | gpg --batch --pinentry-mode loopback --local-user "$FP" --armor --detach-sign >/dev/null 2>&1; then
            echo "::warning::Signing without explicit passphrase failed — gpg-agent cache may not be preset"
          fi

          echo "verify_ok=true" >> "$GITHUB_OUTPUT"

      - name: Job Summary
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.gpg_import.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_OK: ${{ steps.verify.outputs.verify_ok }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
          GPG_HOME: ${{ steps.gpg_import.outputs.gpg_home }}
          KEYS_PUB: ${{ steps.gpg_import.outputs.keys_public }}
          KEYS_SEC: ${{ steps.gpg_import.outputs.keys_secret }}
          KEYS_TOT: ${{ steps.gpg_import.outputs.keys_total }}
          KEY_GRIPS: ${{ steps.gpg_import.outputs.key_grips }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '✅' || printf '❌'; }

          {
            echo "### 🔐 GPG Import — Inline Protected Key"
            echo ""
            echo "| Check | Status |"
            echo "|:------|:------:|"
            echo "| Import | $(s "$IMPORT_OUTCOME") \`${IMPORT_OUTCOME}\` |"
            echo "| Verify | $(s "$VERIFY_OUTCOME") \`${VERIFY_OUTCOME}\` |"
            echo ""
            echo "| Property | Value |"
            echo "|:---------|:------|"
            echo "| Fingerprint | \`${FP:-n/a}\` |"
            echo "| GNUPGHOME | \`${GPG_HOME:-n/a}\` |"
            echo "| Public keys | \`${KEYS_PUB:-0}\` |"
            echo "| Secret keys | \`${KEYS_SEC:-0}\` |"
            echo "| Total keys | \`${KEYS_TOT:-0}\` |"
            echo "| Key grips | \`${KEY_GRIPS:-n/a}\` |"
            echo ""
            echo "**Checks performed:**"
            echo "- ✔ Fingerprint returned"
            echo "- ✔ Key present in secret keyring"
            echo "- ✔ Git signing key matches fingerprint"
            echo "- ✔ Test detach-sign with explicit passphrase"
            echo "- ✔ Owner trust set to ultimate"
            echo "- ✔ Key grips output non-empty"
            echo "- ✔ Secret key count ≥ 1"
            echo "- ✔ Signing via gpg-agent cache (without passphrase)"
          } >> "$GITHUB_STEP_SUMMARY"

  test-keyserver-import:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          repositories: actions

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Import GPG key (keyserver)
        id: gpg_import
        uses: ./gpg-import
        with:
          import-method: 'keyserver'
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          key: '14A71FEDA1F764F7075FFA40FF64D67D0F00DD12'
          keyserver-url: 'hkps://keyserver.ubuntu.com'
          configure-git: 'false'
          initialize-home: 'true'
          preset-passphrase-cache: 'false'

      - name: Verify keyserver import
        id: verify
        env:
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
        run: |
          set -euo pipefail

          echo "verify_ok=false" >> "$GITHUB_OUTPUT"

          # 1) fingerprint output must exist
          if [[ -z "$FP" ]]; then
            echo "::error::No fingerprint returned from gpg-import"
            exit 1
          fi

          # 2) key must be in the public keyring
          if ! gpg --batch --list-keys "$FP" >/dev/null 2>&1; then
            echo "::error::Imported key $FP not found in public keyring"
            exit 1
          fi

          # 3) extract uid from imported key
          uid="$(gpg --batch --with-colons --list-keys "$FP" | awk -F: '/^uid:/ {print $10; exit}')"
          if [[ -z "$uid" ]]; then
            echo "::warning::No UID found for key $FP"
          fi

          # 4) verify configure_git: false — git signing key must NOT be set
          git_key="$(git config --global user.signingkey 2>/dev/null || true)"
          if [[ -n "$git_key" ]]; then
            echo "::error::Git signing key should not be set with configure_git: false, got: $git_key"
            exit 1
          fi

          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          echo "verify_ok=true" >> "$GITHUB_OUTPUT"

      - name: Job Summary
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.gpg_import.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_OK: ${{ steps.verify.outputs.verify_ok }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
          GPG_HOME: ${{ steps.gpg_import.outputs.gpg_home }}
          KEYS_PUB: ${{ steps.gpg_import.outputs.keys_public }}
          KEYS_TOT: ${{ steps.gpg_import.outputs.keys_total }}
          UID_LINE: ${{ steps.verify.outputs.uid }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '✅' || printf '❌'; }

          {
            echo "### 🌐 GPG Import — Keyserver"
            echo ""
            echo "| Check | Status |"
            echo "|:------|:------:|"
            echo "| Import | $(s "$IMPORT_OUTCOME") \`${IMPORT_OUTCOME}\` |"
            echo "| Verify | $(s "$VERIFY_OUTCOME") \`${VERIFY_OUTCOME}\` |"
            echo ""
            echo "| Property | Value |"
            echo "|:---------|:------|"
            echo "| Fingerprint | \`${FP:-n/a}\` |"
            echo "| UID | \`${UID_LINE:-n/a}\` |"
            echo "| GNUPGHOME | \`${GPG_HOME:-n/a}\` |"
            echo "| Public keys | \`${KEYS_PUB:-0}\` |"
            echo "| Total keys | \`${KEYS_TOT:-0}\` |"
            echo ""
            echo "**Checks performed:**"
            echo "- ✔ Fingerprint returned"
            echo "- ✔ Key present in public keyring"
            echo "- ✔ UID extracted from imported key"
            echo "- ✔ Git signing key NOT set (configure_git: false)"
          } >> "$GITHUB_STEP_SUMMARY"

  test-file-import:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          repositories: actions

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write key to temp file
        id: write_key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          KEY_FILE="$(mktemp "${RUNNER_TEMP}/gpg-key-XXXXXX.asc")"
          echo "$GPG_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Import GPG key (file method)
        id: gpg_import
        uses: ./gpg-import
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          import-method: 'file'
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          key: ${{ steps.write_key.outputs.key_file }}
          gpg-pass: ${{ secrets.GPG_PASSPHRASE }}
          delete-after-import: 'true'
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'false'

      - name: Verify file import
        id: verify
        env:
          GNUPGHOME: ${{ steps.gpg_import.outputs.gpg_home }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
          KEY_FILE: ${{ steps.write_key.outputs.key_file }}
          KEYS_SECRET: ${{ steps.gpg_import.outputs.keys_secret }}
        run: |
          set -euo pipefail

          echo "verify_ok=false" >> "$GITHUB_OUTPUT"

          # 1) fingerprint must exist
          if [[ -z "$FP" ]]; then
            echo "::error::No fingerprint returned from file import"
            exit 1
          fi

          # 2) key in secret keyring
          if ! gpg --batch --list-secret-keys "$FP" >/dev/null 2>&1; then
            echo "::error::Imported key $FP not found in secret keyring"
            exit 1
          fi

          # 3) key file deleted after import
          if [[ -f "$KEY_FILE" ]]; then
            echo "::error::Key file $KEY_FILE was NOT deleted after import (delete_after_import: true)"
            exit 1
          fi

          # 4) secret key count
          if [[ "${KEYS_SECRET:-0}" -lt 1 ]]; then
            echo "::error::Expected at least 1 secret key, got ${KEYS_SECRET:-0}"
            exit 1
          fi

          echo "verify_ok=true" >> "$GITHUB_OUTPUT"

      - name: Job Summary
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.gpg_import.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FP: ${{ steps.gpg_import.outputs.fingerprint }}
          GPG_HOME: ${{ steps.gpg_import.outputs.gpg_home }}
          KEYS_SEC: ${{ steps.gpg_import.outputs.keys_secret }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '✅' || printf '❌'; }

          {
            echo "### 📁 GPG Import — File Method"
            echo ""
            echo "| Check | Status |"
            echo "|:------|:------:|"
            echo "| Import | $(s "$IMPORT_OUTCOME") \`${IMPORT_OUTCOME}\` |"
            echo "| Verify | $(s "$VERIFY_OUTCOME") \`${VERIFY_OUTCOME}\` |"
            echo ""
            echo "| Property | Value |"
            echo "|:---------|:------|"
            echo "| Fingerprint | \`${FP:-n/a}\` |"
            echo "| GNUPGHOME | \`${GPG_HOME:-n/a}\` |"
            echo "| Secret keys | \`${KEYS_SEC:-0}\` |"
            echo ""
            echo "**Checks performed:**"
            echo "- ✔ Fingerprint returned"
            echo "- ✔ Key present in secret keyring"
            echo "- ✔ Key file deleted after import"
            echo "- ✔ Secret key count ≥ 1"
          } >> "$GITHUB_STEP_SUMMARY"
