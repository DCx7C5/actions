name: "Run Command in Docker Container"
description: "Run a command inside a pre-built Docker container with optional GPG & ccache support"
author: "DCx7c5"

inputs:
  command:
    description: "Command/script to execute inside container"
    required: true
  working-directory:
    description: "Working directory inside container"
    required: false
    default: ''
  gpg-home:
    description: "GPG home directory to mount"
    required: false
    default: ''
  ccache-dir:
    description: "ccache directory for build caching"
    required: false
    default: ''
  user:
    description: "User name inside the container"
    required: false
    default: ''
  group:
    description: "Group name inside the container"
    required: false
    default: ''
  uid:
    description: "User ID inside the container"
    required: false
    default: ''
  gid:
    description: "Group ID inside the container"
    required: false
    default: ''
  enable-ccache:
    description: "Enable ccache for faster incremental builds"
    required: false
    default: "true"
  gh-token:
    description: "GitHub token for API access"
    required: false
    default: ''
  gpg-key-id:
    description: "GPG key ID or fingerprint to use for signing"
    required: false
    default: ''
  gpg-keygrips:
    description: "Keygrips of GPG keys to preset in gpg-agent cache"
    required: false
    default: ''
  gpg-passphrase:
    description: "Passphrase for GPG key"
    required: false
    default: ''
  preset-passphrase-cache:
    description: "Whether to preset GPG passphrase in gpg-agent cache"
    required: false
    default: 'false'
  run-with-sudo:
    description: "Whether to run the command with sudo inside the container"
    required: false
    default: 'false'
  gpg-key:
    description: "GPG private key to make available inside the container"
    required: false
    default: ''
  image-tag:
    description: "Docker image tag to run"
    required: false
    default: 'arch-run-cmd'
  image-version:
    description: "Docker image version tag"
    required: false
    default: 'latest'


runs:
  using: composite
  steps:
    - id: run_cmd
      shell: bash
      env:
        IMAGE: "${{ inputs.image-tag }}:${{ inputs.image-version }}"
        CMD: "${{ inputs.command }}"
        GH_TOKEN: "${{ inputs.gh-token || github.token }}"
        CCACHE_DIR: "${{ inputs.ccache-dir || format('{0}/.ccache', github.workspace) }}"
        GNUPGHOME: "${{ inputs.gpg-home || format('{0}/.gnupg', github.workspace) }}"
        RUN_WITH_SUDO: "${{ inputs.run-with-sudo || 'false' }}"
        GPG_KEY_ID: "${{ inputs.gpg-key-id }}"
        GPG_PASSPHRASE: "${{ inputs.gpg-passphrase }}"
        PRESET_CACHE: "${{ inputs.preset-passphrase-cache || 'false' }}"
        WORKING_DIR: "${{ inputs.working-directory || github.workspace }}"
        KEYGRIPS: "${{ inputs.gpg-keygrips }}"
        CONTAINER_USER: "${{ inputs.user || 'runner' }}"
        CONTAINER_GROUP: "${{ inputs.group || 'runner' }}"
        CONTAINER_UID: "${{ inputs.uid || '1001' }}"
        CONTAINER_GID: "${{ inputs.gid || '127' }}"
      run: |
        set -euo pipefail

        DOCKER_VOLS=(-v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}")

        # Mount GNUPGHOME separately if outside workspace
        if [[ -d "${GNUPGHOME}" && "${GNUPGHOME}" != "${GITHUB_WORKSPACE}"* ]]; then
          DOCKER_VOLS+=(-v "${GNUPGHOME}:${GNUPGHOME}")
        fi

        # Mount CCACHE_DIR separately if outside workspace
        if [[ -d "${CCACHE_DIR}" && "${CCACHE_DIR}" != "${GITHUB_WORKSPACE}"* ]]; then
          DOCKER_VOLS+=(-v "${CCACHE_DIR}:${CCACHE_DIR}")
        fi

        docker run --rm \
          -e CI=true \
          -e GITHUB_ACTIONS=true \
          -e "GH_TOKEN=${GH_TOKEN}" \
          -e "MAKEFLAGS=-j$(nproc)" \
          -e "CCACHE_DIR=${CCACHE_DIR}" \
          -e "GNUPGHOME=${GNUPGHOME}" \
          -e CCACHE_MAXSIZE=2G \
          -e CCACHE_COMPRESS=1 \
          -e CCACHE_COMPRESSLEVEL=6 \
          -e DISABLE_TELEMETRY=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          -e "RUN_WITH_SUDO=${RUN_WITH_SUDO}" \
          -e "GPG_KEY_ID=${GPG_KEY_ID}" \
          -e "GPG_PASSPHRASE=${GPG_PASSPHRASE}" \
          -e "PRESET_CACHE=${PRESET_CACHE}" \
          -e "WORKING_DIR=${WORKING_DIR}" \
          -e "KEYGRIPS=${KEYGRIPS}" \
          -e "USER=${CONTAINER_USER}" \
          -e "GROUP=${CONTAINER_GROUP}" \
          -e "UID=${CONTAINER_UID}" \
          -e "GID=${CONTAINER_GID}" \
          "${DOCKER_VOLS[@]}" \
          -w "${WORKING_DIR}" \
          "${IMAGE}" \
          "${CMD}"

    - id: post_cleanup
      name: Post-run cleanup
      if: always()
      shell: bash
      env:
        IMAGE: "${{ inputs.image-tag }}:${{ inputs.image-version }}"
        GNUPGHOME: "${{ inputs.gpg-home || format('{0}/.gnupg', github.workspace) }}"
        GPG_KEY_ID: "${{ inputs.gpg-key-id }}"
      run: |
        if [[ -n "${GPG_KEY_ID}" ]]; then
          docker run --rm \
            -e "GNUPGHOME=${GNUPGHOME}" \
            -e "GPG_KEY_ID=${GPG_KEY_ID}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            "${IMAGE}" \
            /post_entrypoint.sh 2>/dev/null || true
        fi
