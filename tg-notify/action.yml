name: "Telegram Notify Action (Secure)"
description: "Send Telegram messages from GitHub Actions with security hardening"
author: "DCx7C5"

inputs:
  tg-token:
    description: "Telegram Bot Token"
    required: true
  chat-id:
    description: "Chat ID (user, group or channel)"
    required: true
  message:
    description: "Message text (MarkdownV2 supported)"
    required: true
  parse-mode:
    description: "Parse mode: MarkdownV2 (default), Markdown, or HTML"
    required: false
    default: "HTML"
  silent:
    description: "Disable notification sound (true/false)"
    required: false
    default: "false"
  step-summary:
    description: "If set, adds this text as additional step summary"
    default: ''
    required: false


runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail

        # Validate token format (number:alphanumeric-underscore)
        if ! [[ "${{ inputs.tg-token }}" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
          echo "::error::Invalid Telegram bot token format" >&2
          exit 1
        fi

        # Validate chat ID (must be numeric, can be negative)
        if ! [[ "${{ inputs.to }}" =~ ^-?[0-9]+$ ]]; then
          echo "::error::Invalid Telegram chat ID format" >&2
          exit 1
        fi

        # Validate parse mode
        case "${{ inputs.parse-mode }}" in
          MarkdownV2|Markdown|HTML) ;;
          *)
            echo "::error::Invalid parse mode: ${{ inputs.parse-mode }}" >&2
            exit 1
            ;;
        esac

        echo "::notice::Input validation passed"

    - name: Send Telegram Message
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.tg-token }}
        TELEGRAM_TO: ${{ inputs.chat-id }}
        TELEGRAM_MESSAGE: ${{ inputs.message }}
        TELEGRAM_PARSE_MODE: ${{ inputs.parse-mode }}
        TELEGRAM_SILENT: ${{ inputs.silent }}
      run: |
        ${{ github.action_path }}/entrypoint.sh

    - name: Add step summary
      if: inputs.step-summary != ''
      shell: bash
      run: |
        echo "${{ inputs.step-summary }}" >> "$GITHUB_STEP_SUMMARY"
