name: "Store As GitHub Secret"
description: "Store as GitHub Secret from GitHub Actions with security hardening"
author: "DCx7C5"

inputs:
  value:
    required: true
    description: "Value to store as GitHub Secret (can be multiline, e.g. for GPG keys)"
  secret_name:
    required: true
    description: "Name of GitHub Secret to create or update"
  token:
    required: false
    description: "GitHub Token with permissions to manage secrets (usually GITHUB_TOKEN)"
    default: ${{ secrets.GITHUB_TOKEN }} || ${{ github.token }}
  secret_type:
    required: false
    description: "Type of GitHub Secret (repo or org or env)"
    default: 'org'

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup GitHub CLI
      uses: actions4gh/setup-gh@v1
      with:
        token: ${{ inputs.token }}

    - name: Store as GitHub Repository Secret
      if: inputs.var_type == 'repo'
      id: store_as_repo_secret
      shell: bash
      run: |
        set -euo pipefail
        gh secret set "${{ inputs.secret_name }}" --body "${{ inputs.value }}" --repo "${{ github.repository }}" || { echo "ERROR: Failed to store secret ${{ inputs.secret_name }}" >&2; exit 1; }

    - name: Store as GitHub Organisation Secret
      if: inputs.var_type == 'org'
      id: store_as_org_secret
      shell: bash
      run: |
        set -euo pipefail
        gh secret set "${{ inputs.secret_name }}" --body "${{ inputs.value }}" --org "${{ github.repository_owner }}" || { echo "ERROR: Failed to store secret ${{ inputs.secret_name }}" >&2; exit 1; }

    - name: Store as GitHub Environment Secret
      if: inputs.var_type == 'env'
      id: store_as_env_secret
      shell: bash
      run: |
        set -euo pipefail
        gh secret set "${{ inputs.secret_name }}" --body "${{ inputs.value }}" --env "${{ github.environment }}" || { echo "ERROR: Failed to store secret ${{ inputs.secret_name }}" >&2; exit 1; }
