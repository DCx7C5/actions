name: "Setup GPG Environment"
description: "Setup GPG Environment from GitHub Actions with security hardening"
author: "DCx7C5"

outputs:
  gpg_home:
    description: "Path to GPG home directory"
    value: "${{ steps.create_dir.outputs.gpg_home }}"

runs:
  using: composite
  steps:
    - name: Create secure GPG directory
      shell: bash
      id: create_dir
      run: |
        set -euo pipefail

        if [[ -z "${{ inputs.gpg_home }}" ]]; then
          GNUPGHOME=$(mktemp -d .gnupg.XXXXXXX)
          export GNUPGHOME="$(pwd)/${GNUPGHOME}"
        else
          export GNUPGHOME="${{ inputs.gpg_home }}"
        fi

        if [ ! -d "$GNUPGHOME" ]; then
          mkdir -p -- "$GNUPGHOME"
        fi

        chmod 700 "$GNUPGHOME"

        echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
        echo "gpg_home=$GNUPGHOME" >> $GITHUB_OUTPUT

        echo "Created GPG home: $GNUPGHOME"

    - name: Setup secure GPG configuration
      if: steps.create_dir.outputs.gpg_version == 2
      shell: bash
      id: gpg_setup_legacy
      run: |
        set -euo pipefail
        echo "::warning::Please ensure your runner has GPG 4.0 or higher for best security practices"
        mkdir -p "$GNUPGHOME"/{private-keys-v1.d,pubring.d}
        chmod 700 "$GNUPGHOME"/private-keys-v1.d
        chmod 755 "$GNUPGHOME"/pubring.d

        cat > "$GNUPGHOME/gpg.conf" << 'GPGCONF'

        # Strong algorithm preferences (GnuPG 2.2 compatible)
        personal-cipher-preferences AES256 AES192 AES
        personal-digest-preferences SHA512 SHA384 SHA256 SHA224
        cert-digest-algo SHA512
        default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB
        
        # Explicitly disable legacy/weak ciphers
        disable-cipher-algo 3DES IDEA CAST5 BLOWFISH TWOFISH
        
        # Keyserver (secure HKPS)
        keyserver hkps://keys.openpgp.org
        keyserver-options auto-key-retrieve
        
        # Clean output & long IDs
        keyid-format LONG
        with-fingerprint
        no-comments
        
        # Trust model & security
        trust-model pgp
        require-cross-certification
        GPGCONF

        # Set proper permissions on config file
        chmod 600 "$GNUPGHOME/gpg.conf"

        # Verify GPG is working
        if ! gpg --list-keys > /dev/null 2>&1; then
          echo "::warning::GPG initialization check - creating initial keyring"
          gpg --list-keys > /dev/null 2>&1 || true
        fi

        echo "Successfully setup secure GPG environment"

    - name: Setup secure GPG configuration
      shell: bash
      id: gpg_setup
      run: |
        set -euo pipefail

        mkdir -p "$GNUPGHOME"/{private-keys-v1.d,pubring.d}
        chmod 700 "$GNUPGHOME"/private-keys-v1.d
        chmod 755 "$GNUPGHOME"/pubring.d

        cat > "$GNUPGHOME/gpg.conf" << 'GPGCONF'

        # Encryption cipher preferences (strongest first)
        cipher-algo AES256
        digest-algo SHA256
        cert-digest-algo 512
        compress-algo ZLIB

        # Disable weak algorithms
        disable-cipher-algo 3DES
        disable-cipher-algo IDEA

        # Key server with HKPS (HTTPS)
        keyserver hkps://keys.openpgp.org
        keyserver-options no-try-dns-srv

        # Default key format and IDs
        keyid-format LONG

        # Trust model: Only explicitly trusted keys
        trust-model pgp

        # Key expiration defaults
        default-key-lifetime 3650

        # Require cross-certification for subkeys
        require-cross-certification

        # Weak digest algorithms to disable
        weak-digest-algos SHA1
        GPGCONF

        # Set proper permissions on config file
        chmod 600 "$GNUPGHOME/gpg.conf"

        # Verify GPG is working
        if ! gpg --list-keys > /dev/null 2>&1; then
          echo "::warning::GPG initialization check - creating initial keyring"
          gpg --list-keys > /dev/null 2>&1 || true
        fi

        echo "Successfully setup secure GPG environment"

    - name: Configure gpg-agent for non-interactive signing
      id: gpgagent
      shell: bash
      env:
        GNUPGHOME: ${{ steps.get_gpg_home.outputs.gpg_home }}
      run: |
        set -euo pipefail
        
        cat > "$GNUPGHOME/gpg-agent.conf" << 'EOF'
        default-cache-ttl 600
        max-cache-ttl 7200
        allow-loopback-pinentry
        pinentry-program /bin/true
        EOF
        
        echo "Configured gpg-agent for non-interactive signing"
