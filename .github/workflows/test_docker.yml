name: "Test Docker Build/Push"
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "The name of the Docker image to build and push"
        required: false
        default: 'arch-build'
        type: string
      image-version:
        description: "The version tag of the Docker image to build and push"
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - main
    paths:
      - docker-build-image/action.yml
      - docker-push-image/action.yml
      - .github/workflows/test_docker.yml

concurrency:
  group: 'test-docker-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test-docker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      packages: write
      contents: read
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        id: build_image
        uses: ./docker-build-image
        with:
          image-working-directory: ${{ github.workspace }}/arch-run-cmd
          runtime-working-directory: ${{ github.workspace }}
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          ccache-dir: ${{ format('{0}/.ccache', github.workspace) }}
          user: runner
          group: runner
          uid: '1001'
          gid: '127'
          gh-token: ${{ steps.app_token.outputs.token }}
          image-tag: ${{ inputs.image-tag || 'arch-build' }}
          image-version: ${{ inputs.image-version || 'latest' }}
          dockerfile-path: Dockerfile

      - name: Push Docker image to GitHub Container Registry
        id: push_image
        if: success()
        uses: ./docker-push-image
        with:
          registry: 'ghcr.io'
          user: ${{ github.actor }}
          image-tag: ${{ inputs.image-tag || 'arch-build' }}
          image-version: ${{ inputs.image-version || 'latest' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        env:
          BUILD_IMAGE: ${{ steps.build_image.outputs.image }}
          FULL_IMAGE: ${{ steps.push_image.outputs.full_image }}
          BUILD_OUTCOME: ${{ steps.build_image.outcome }}
          PUSH_OUTCOME: ${{ steps.push_image.outcome }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '\u2714' || printf '\u2718'; }

          {
            echo "### Docker Build \u0026 Push"
            echo ""
            echo "| Step | Status | Image |"
            echo "|:-----|:------:|:------|"
            echo "| Build | $(s "$BUILD_OUTCOME") \`${BUILD_OUTCOME}\` | \`${BUILD_IMAGE:-n/a}\` |"
            echo "| Push  | $(s "$PUSH_OUTCOME") \`${PUSH_OUTCOME}\` | \`${FULL_IMAGE:-n/a}\` |"
            echo ""
            if [[ "$BUILD_OUTCOME" == "success" && "$PUSH_OUTCOME" == "success" ]]; then
              echo '```sh'
              echo "docker pull ${FULL_IMAGE}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
