name: "Delete Release"
description: "Deletes an existing Release via GitHub Actions"
author: "DCx7C5"

branding:
  icon: "package"
  color: "red"

inputs:
  release_tag:
    required: true
    description: "The release tag/version to delete"
  github_token:
    required: false
    default: ${{ github.token }}
    description: "GitHub token for API access (defaults to github.token)"
  delete_tag:
    required: false
    default: 'false'
    description: "Whether to also delete the Git tag associated with the release (if true, will attempt to delete the tag as well)"


outputs:
  deleted:
    description: "Whether the release was successfully deleted"
    value: ${{ steps.rel_delete.outputs.deleted }}
  release_id:
    description: "The ID of the deleted release (if it existed)"
    value: ${{ steps.rel_delete.outputs.release_id }}

runs:
  using: composite
  steps:
    - name: Delete release
      id: rel_delete
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        
        # Validate input
        if [ -z "$RELEASE_TAG" ]; then
          echo "::error::release_tag input is required and cannot be empty" >&2
          exit 1
        fi
        
        # Get the release ID for the given tag
        RELEASE_ID=$(gh release view "$RELEASE_TAG" --json id --jq '.id' 2>/dev/null || echo "")
        
        if [ -n "$RELEASE_ID" ]; then
          echo "::notice::Deleting release for tag '$RELEASE_TAG' (ID: $RELEASE_ID)"
          
          if gh release delete "$RELEASE_TAG" --yes 2>&1; then
            echo "::notice::Release '$RELEASE_TAG' deleted successfully"
            echo "deleted=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to delete release '$RELEASE_TAG'" >&2
            exit 1
          fi
        else
          echo "::warning::Release for tag '$RELEASE_TAG' not found - nothing to delete"
          echo "deleted=false" >> "$GITHUB_OUTPUT"
          echo "release_id=" >> "$GITHUB_OUTPUT"
        fi

    - name: Delete tag
      if: inputs.delete_tag == 'true'
      id: tag_delete
      shell: bash
      env:
        TAG_NAME: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail

        # Validate input
        if [ -z "$TAG_NAME" ]; then
          echo "::error::release_tag input is required and cannot be empty" >&2
          exit 1
        fi

        TAG_EXISTS=false
        PUSH_SUCCESS=false

        # Check if tag exists locally
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          TAG_EXISTS=true
          echo "::notice::Tag '$TAG_NAME' found locally - deleting..."

          if git tag --delete "$TAG_NAME"; then
            echo "::notice::Local tag '$TAG_NAME' deleted successfully"
          else
            echo "::error::Failed to delete local tag '$TAG_NAME'" >&2
            exit 1
          fi
        else
          echo "::notice::Tag '$TAG_NAME' does not exist locally"
        fi

        # Try to delete from remote (don't fail if tag doesn't exist remotely)
        if git push origin --delete "$TAG_NAME" 2>&1; then
          echo "::notice::Remote tag '$TAG_NAME' deleted successfully"
          PUSH_SUCCESS=true
        else
          # Don't fail here - remote deletion is best-effort
          if [ "$TAG_EXISTS" = true ]; then
            echo "::warning::Local tag was deleted but remote deletion failed (tag may not exist on remote)"
            PUSH_SUCCESS=false
          else
            echo "::notice::Tag '$TAG_NAME' does not exist remotely - nothing to delete"
            PUSH_SUCCESS=false
          fi
        fi

        # Set outputs - Action succeeds if ANYTHING was deleted
        if [ "$TAG_EXISTS" = true ] || [ "$PUSH_SUCCESS" = true ]; then
          echo "deleted=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag deletion completed successfully"
        else
          echo "deleted=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag '$TAG_NAME' did not exist locally or remotely - no action taken"
        fi

        echo "tag_existed=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
        echo "pushed=$PUSH_SUCCESS" >> "$GITHUB_OUTPUT"
