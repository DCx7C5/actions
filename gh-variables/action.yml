name: "Manage a GitHub Variable"
description: "Manage a GitHub Variable from GitHub Actions"
author: "DCx7C5"


inputs:
  action:
    required: false
    description: "Action to perform (get or set, defaults to 'set')"
    default: 'set'
  variable-name:
    required: true
    description: "Name of GitHub Variable to create or update"
  body:
    required: true
    description: "Value to store as GitHub Variable (can be multiline, e.g. for GPG keys)"
  env:
    required: false
    description: "Set deployment environment variable"
    default: ''
  org:
    required: false
    description: "Name of the organisation to store the variable in (defaults to current organisation based on variable_type)"
    default: ''
  repo:
    required: false
    description: "Set repository variable (defaults to current repository)"
    default: ''
  repos:
    required: false
    description: "New-line separated list of repositories to set the secret in (only for organisation secrets, defaults to all repositories in the organisation)"
    default: ''
  visibility:
    required: false
    description: "Visibility of the secret in the selected repositories (only for organisation secrets, (all|private|selected) defaults to 'all')"
    default: 'all'
  jq:
    required: false
    default: ''
    description: >-
      Filter JSON output using a jq expression.
      JSON FIELDS
           createdAt, name, numSelectedRepos, selectedReposURL, updatedAt, value, visibility
  json:
    required: false
    description: "Output JSON with the specified fields"
    default: ''
  gh-token:
    required: false
    description: "GitHub Token with permissions to manage secrets (usually GITHUB_TOKEN)"
    default: ''
  exit-on-error:
    required: false
    description: "Whether the action should fail if the variable cannot be retrieved or set (true/false, defaults to 'true')"
    default: 'true'


outputs:
  variable-name:
    description: "Name of the GitHub Variable that was created or updated"
    value: ${{ inputs.variable-name }}
  value:
    description: "Value of the GitHub Variable that was created or updated (only if 'print' input is set to 'true')"
    value: ${{ steps.get_variable.outputs.value || '' }}
  json:
    description: "JSON output with the specified fields (only if 'json' input is set)"
    value: ${{ steps.get_variable.outputs.json || '' }}
  success:
    description: "Whether the action succeeded (true/false)"
    value: ${{ steps.get_variable.outputs.success || steps.set_variable.outputs.success ||'false' }}


runs:
  using: composite
  steps:
    - name: Validate Inputs
      id: validate_and_parse
      shell: bash
      env:
        EONERROR: "${{ inputs.exit-on-error }}"
        TYPE: >-
          ${{ case(
            inputs.env == 'true', '--env ${{ github.environment }}',
            inputs.org == 'true', '--org ${{ github.repository_owner }}',
            inputs.repo == 'true', '--repo ${{ github.repository }}',
            inputs.env != '', '--env ${{ inputs.env }}',
            inputs.org != '', '--org ${{ inputs.org }}', 
            inputs.repo != '', '--repo ${{ inputs.repo }}',
            '--repo ${{ github.repository }}'
          ) }}
        TYPE_OPT: >-
          ${{ case( 
            inputs.org != '' && inputs.repos != '', '--repos $(echo "${{ inputs.repos }}" | tr '\n\ \,' ',' | sed 's/,$//')',
            inputs.org != '' && inputs.visibility != '', '--visibility ${{ inputs.visibility }}',
          ) }}
        INPUTS_JSON: "${{ inputs.json }}"
        INPUTS_VISIBILITY: "${{ inputs.visibility }}"
        INPUTS_ACTION: "${{ inputs.action }}"
        INPUTS_REPOS: "${{ inputs.repos }}"
        INPUTS_ORG: "${{ inputs.org }}"
      run: |
        if [[ -n "${{ inputs.gh-token }}" ]]; then 
          echo "::add-mask::${{ inputs.gh-token }}"
        fi

        if [[ ! "${{ inputs.env != '' && 'true' }}${{ inputs.repo != '' && 'true' }}${{ inputs.org != '' && 'true' }}" =~ ^true$ ]]; then
          echo "::error::Not more than one of 'env', 'repo' or 'org' can be set to a non-empty value" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ -n "$INPUTS_VISIBILITY" && ! "$INPUTS_VISIBILITY" =~ ^all|private|selected$ ]]; then
          echo "::error::Invalid visibility '$INPUTS_VISIBILITY'. Valid options are: all, private, selected" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ "EONERROR" =~ ^true|false$ ]]; then
          echo "::error::Invalid value for 'exit_on_error': '$EONERROR'. Valid options are: true, false" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ "$INPUTS_ACTION" =~ ^get|set$ ]]; then
          echo "::error::Invalid action '$INPUTS_ACTION'. Valid actions are: get, set" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        elif [[ "$INPUTS_ACTION" = 'set' && (-n "$INPUTS_JSON" || -n "${{ inputs.jq }}") ]]; then
          echo "::error::Cannot use both 'json' and 'jq' inputs at the same time" >&2
          [[ "$EONERROR" =~ ^true$ ]] && exit 1
        fi
        
        if [[ "$INPUTS_VISIBILITY" == "selected" && -z "$INPUTS_REPOS" ]]; then
          echo "::warning::Visibility 'selected' has no repositories specified"
        fi
        
        if [[ -n "$INPUTS_ORG" && -n "$INPUTS_REPOS" && -z "$INPUTS_VISIBILITY" ]]; then
          echo "::warning::Repos specified without visibility defaults to 'all', which may not be intended"
        fi
        
        if [[ -n "$INPUTS_ORG" && -n "$INPUTS_JSON" ]]; then
          echo 'json=--repos $(echo "$INPUTS_REPOS" | tr '\n\ ' ',' | sed 's/,$//")' >> "$GITHUB_OUTPUT"
        fi
        
        if [[ -n "$INPUTS_ORG" && -n "$INPUTS_VISIBILITY" ]]; then
          echo "json=--visibility $INPUTS_VISIBILITY" >> "$GITHUB_OUTPUT"
        fi
        
        [ -n "$TYPE" ] && echo "type=$TYPE" >> "$GITHUB_OUTPUT"
        [ -n "$TYPE_OPT" ] && echo "type_opt=$TYPE_OPT" >> "$GITHUB_OUTPUT"

    - name: Get GitHub Variable
      id: get_variable
      if: inputs.action == 'get'
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.gh-token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
        TYPE: "${{ steps.validate_and_parse.outputs.type }}"
        TYPE_OPT: "${{ steps.validate_and_parse.outputs.type_opt }}"
        OUT_VAR: "${{ inputs.json != '' && 'json' || 'value' }}"
        EONERROR: "${{ inputs.exit-on-error }}"
        INPUTS_VARIABLE_NAME: "${{ inputs.variable-name }}"
      run: |
        GH_CMD=(${TYPE} ${TYPE_OPT})
                
        [ -n "${{ steps.validate.outputs.json }}" ] && GH_CMD+=($(echo "${{ steps.validate.outputs.json }}" | tr '\n\ \,' ',' | sed 's/,$//'))
        [ -n "${{ inputs.jq }}" ] && GH_CMD+=(${{ inputs.jq }})
        
        value=$(gh variable get '$INPUTS_VARIABLE_NAME' "${GH_CMD[@]}" || {
          echo "::error::Failed to get variable '$INPUTS_VARIABLE_NAME' with type '${TYPE}'" >&2
        })
        
        status=$?
        [[ $status -ne 0 && "$EONERROR" =~ ^true$ ]] && exit $status
        [[ $status -eq 0 && -n "$value" ]] && { echo "success=true" >> "$GITHUB_OUTPUT"; } || { 
          echo "success=false" >> "$GITHUB_OUTPUT" 
        }
        
        { echo "$OUT_VAR<<EOF"
          echo "$value"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
        echo "::debug::Successfully executed: gh variable get '$INPUTS_VARIABLE_NAME' ${GH_CMD[*]}"

    - name: Set GitHub Variable
      id: set_variable
      if: inputs.action == 'set'
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.gh-token || env.GH_TOKEN || env.GITHUB_TOKEN }}"
        TYPE: "${{ steps.validate.outputs.type }}"
        TYPE_OPT: "${{ steps.validate.outputs.type_opt }}"
        EONERROR: "${{ inputs.exit-on-error }}"
        INPUTS_VARIABLE_NAME: "${{ inputs.variable-name }}"
      run: |
        GH_CMD=(${TYPE} ${TYPE_OPT})
        
        printf '%s' "${{ inputs.body }}" | gh variable set "$INPUTS_VARIABLE_NAME" "${GH_CMD[@]}" || {
          echo "::error::Failed to set variable '$INPUTS_VARIABLE_NAME' with type '${TYPE} ${TYPE_OPT}'" >&2
        }
        status=$?
        [[ $status -ne 0 && "$EONERROR" =~ ^true$ ]] && exit $status
        [ $status -eq 0 ] && { echo "success=true" >> "$GITHUB_OUTPUT"; } || { 
          echo "success=false" >> "$GITHUB_OUTPUT"
        }
        
        echo "::debug::Successfully executed: printf '%s' '<body>' | gh variable set $INPUTS_VARIABLE_NAME' ${GH_CMD[*]}"
