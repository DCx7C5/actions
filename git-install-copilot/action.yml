name: "Install GitHub Copilot CLI"
description: "Installs the GitHub Copilot CLI tool via GitHub Actions"
author: "DCx7C5"


inputs:
  version:
    required: false
    default: 'latest'
    description: "Version of GitHub Copilot CLI to install (default: latest)"
  install_path:
    required: false
    default: '/usr/local/bin/copilot'
    description: "Path to install the GitHub Copilot CLI executable (default: /usr/local/bin/copilot)"
  github_token:
    required: false
    default: '${{ github.token }}'
    description: "GitHub token for authentication (if required for private releases or API rate limits)"


runs:
  using: composite
  steps:
    - name: Mask GitHub Token and Validate Inputs
      id: mask_and_validate
      shell: bash
      run: |
        set -euo pipefail
        
        if command -v copilot &> /dev/null; then
          echo "::notice::GitHub Copilot CLI is already installed at '$(which copilot)'. Skipping installation."
          echo "is_installed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        if [[ -n '${{ inputs.github_token }}' ]]; then
          echo '::add-mask::${{ inputs.github_token }}'
        fi

    - name: Install GitHub Copilot CLI
      id: install_copilot
      if: steps.mask_and_validate.outputs.is_installed != 'true'
      shell: bash
      env:
        COPILOT_VERSION: ${{ inputs.version }}
        INSTALL_PATH: ${{ inputs.install_path }}
      run: |
        set -euo pipefail
            
        echo "::notice::Installing GitHub Copilot CLI version '$COPILOT_VERSION' to '$INSTALL_PATH'"
            
        # Determine the platform and architecture for downloading the correct binary
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"

        # Construct the download URL for the specified version
        if [ "$COPILOT_VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://api.github.com/repos/github/copilot-cli/releases/latest"
        else
          DOWNLOAD_URL="https://api.github.com/repos/github/copilot-cli/releases/tags/${COPILOT_VERSION}"
        fi
        
        # Fetch the release information from GitHub API
        RESPONSE=$(curl -sL -H "Authorization: token ${{ inputs.github_token }}"
            -H "Accept: application/vnd.github.v3+json" "$DOWNLOAD_URL")
        
        # Extract the download URL for the appropriate binary asset
        ASSET_URL=$(echo "$RESPONSE" | jq -r --arg platform "$PLATFORM" --arg arch "$ARCH" \
            '.assets[] | select(.name | test("copilot-cli.*" + $platform + ".*" + $arch + ".*")) | .browser_download_url')
        
        # Download the binary and install it to the specified path
        if [ -n "$ASSET_URL" ]; then
          echo "::notice::Downloading GitHub Copilot CLI from '$ASSET_URL'"
          curl -sL -H "Authorization: token ${{ inputs.github_token }}" -o "$INSTALL_PATH" "$ASSET_URL"
          chmod +x "$INSTALL_PATH"
          echo "::notice::GitHub Copilot CLI installed successfully at '$INSTALL_PATH'"
        else
          echo "::error::Failed to find a compatible GitHub Copilot CLI release for platform '$PLATFORM' and architecture '$ARCH'"
          exit 1
        fi
        
        echo "::notice::Installation complete. You can verify the installation by running '$INSTALL_PATH --version'"

    - name: Setup GitHub Token for API Access
      if: steps.mask_and_validate.outputs.is_installed != 'true' && inputs.github_token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "::notice::GitHub token provided, setting up authentication for API access"
        gh auth login --with-token < "$GH_TOKEN"
