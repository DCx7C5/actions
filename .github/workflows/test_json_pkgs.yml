name: "Test JSON Packages"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ./aur-json-packages/action.yml
      - .github/workflows/test_json_pkgs.yml


jobs:
  test-json-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: 'DystopianOS'

      - uses: actions/checkout@v6
        with:
          token: '${{ steps.app_token.outputs.token }}'

      - name: get_all_packages
        id: get_all
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'

      - name: get_all_packages_with_keys
        id: get_all_keys
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          key: |
            submodule
            custom
            remote_dir

      - name: get_packages_with_pkgnames
        id: get_pkgs
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            nvidia
            toolchain

      - name: get_packages_with_pkgname_and_keys
        id: get_pkgs_keys
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            nvidia
            toolchain
          key: |
            submodule
            custom
            remote_dir

      - name: add_package_with_multiple_pkgnames_and_multiple_values_and_no_keys
        id: multi_pkg_multi_value_no_keys
        uses: ./aur-json-packages
        with:
          action: 'add'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0
            zzzzz-test1
          value: |
            {"name":"test0","value":false}
            {"name":"test1","value":true}

      - name: add_package_with_one_pkgname_and_multiple_keys_and_multiple_values
        id: one_pkg_multi_keys_multi_values
        uses: ./aur-json-packages
        with:
          action: 'add'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0
          key: |
            submodule
            custom
          value: |
            false
            true

      - name: add_package_with_no_pkgname_and_multiple_values_and_no_keys
        id: no_pkg_multi_value_no_keys
        uses: ./aur-json-packages
        with:
          action: 'add'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          value: |
            {"zzzzz-test0":{"name":"test0","value":false}}
            {"zzzzz-test1":{"name":"test1","value":true}}

      - name: remove_from_one_package_multiple_keys
        id: del_keys
        uses: ./aur-json-packages
        with:
          action: 'remove'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0
          key: |
            submodule
            custom

      - name: verify_key_delete
        id: verify_key_del
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0

      - name: remove_packages_with_multiple_pkgnames
        id: del_multi_pkg
        uses: ./aur-json-packages
        with:
          action: 'remove'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0
            zzzzz-test1

      - name: verify_delete_cleaned_up
        id: verify_del
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          var-name: 'JSON_PACKAGES'
          pkg-name: |
            zzzzz-test0
            zzzzz-test1

      - id: check
        run: |
          echo "Checking outputs..." >> "$GITHUB_STEP_SUMMARY"
          {
            echo '##### Args (get_all):'
            echo '```bash'
            echo "${{ steps.get_all.outputs.debug-args }} ${{ steps.get_all.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_all.outputs.out }}' | jq -c '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_all_keys):'
            echo '```bash'
            echo "${{ steps.get_all_keys.outputs.debug-args }} ${{ steps.get_all_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_all_keys.outputs.out }}' | jq -c '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_pkgs):'
            echo '```bash'
            echo "${{ steps.get_pkgs.outputs.debug-args }} ${{ steps.get_pkgs.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_pkgs.outputs.out }}' | jq -c '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_pkgs_keys):'
            echo '```bash'
            echo "${{ steps.get_pkgs_keys.outputs.debug-args }} ${{ steps.get_pkgs_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_pkgs_keys.outputs.out }}' | jq -c '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          
          {
            echo '##### Args (multi_pkg_multi_value_no_keys):'
            echo '```bash'
            echo "${{ steps.multi_pkg_multi_value_no_keys.outputs.debug-args }} ${{ steps.multi_pkg_multi_value_no_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo "${{ steps.multi_pkg_multi_value_no_keys.outputs.out }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          
          {
            echo '##### Args (one_pkg_multi_keys_multi_values):'
            echo '```bash'
            echo "${{ steps.one_pkg_multi_keys_multi_values.outputs.debug-args }} ${{ steps.one_pkg_multi_keys_multi_values.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo "${{ steps.one_pkg_multi_keys_multi_values.outputs.out }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          
          {
            echo '##### Args (no_pkg_multi_value_no_keys):'
            echo '```bash'
            echo "${{ steps.no_pkg_multi_value_no_keys.outputs.debug-args }} ${{ steps.no_pkg_multi_value_no_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo "${{ steps.no_pkg_multi_value_no_keys.outputs.out }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (del_keys - remove keys from one package):'
            echo '```bash'
            echo "${{ steps.del_keys.outputs.debug-args }} ${{ steps.del_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo "${{ steps.del_keys.outputs.out }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Verify key delete (zzzzz-test0 should have no submodule/custom keys):'
            echo '```json'
            echo '${{ steps.verify_key_del.outputs.out }}' | jq '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (del_multi_pkg):'
            echo '```bash'
            echo "${{ steps.del_multi_pkg.outputs.debug-args }} ${{ steps.del_multi_pkg.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo "${{ steps.del_multi_pkg.outputs.out }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Verify delete (should be null/empty):'
            echo '```json'
            echo '${{ steps.verify_del.outputs.out }}' | jq '.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
