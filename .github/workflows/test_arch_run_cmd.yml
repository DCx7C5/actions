name: "Test Arch Run Command Action"
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "The name of the Docker image to build and run"
        required: false
        default: 'arch-run-cmd'
        type: string
      image_version:
        description: "The version tag of the Docker image to build and run"
        required: false
        default: 'latest'
        type: string
      enable_ccache:
        description: "Enable ccache in the Arch Run Command Action"
        required: false
        default: true
        type: boolean
      run_with_sudo:
        description: "Whether to run the command with sudo inside the container (for testing root permissions)"
        required: false
        default: true
        type: boolean

  push:
    paths:
      - 'arch-run-cmd/**'


jobs:
  test-run-cmd:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ steps.app_token.outputs.token }}'

      - name: Build Arch Run Command Action Image
        uses: ./docker-build-image
        with:
          gh_token: ${{ steps.app_token.outputs.token }}
          dockerfile_path: './arch-run-cmd/Dockerfile'
          image_tag: ${{ inputs.image_tag || 'arch-run-cmd' }}
          image_version: ${{ inputs.image_version || 'latest' }}
          runtime_working_directory: ${{ github.workspace }}
          image_working_directory: ${{ format('{0}/arch-run-cmd', github.workspace) }}

      - name: Test Arch Run Command Action
        uses: ./docker-run-image
        with:
          gh_token: ${{ steps.app_token.outputs.token }}
          ccache_dir: "${{ github.workspace }}/.ccache"
          run_with_sudo: ${{ inputs.run_with_sudo || 'false' }}
          enable_ccache: ${{ inputs.enable_ccache || 'false' }}
          working_directory: ${{ github.workspace }}
          preset_passphrase_cache: 'false'

          command: |
            echo "Hello, World!" && ls -als && pwd
