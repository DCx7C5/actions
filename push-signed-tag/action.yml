name: "Create & Push Signed Tag"
description: "Create & push a signed tag from GitHub Actions"
author: "DCx7C5"


inputs:
  version:
    description: "The new version to use"
    required: true
  fingerprint:
    description: "Fingerprint of the GPG key to use for signing the tag (optional, will use default key if not provided)"
    required: false
  gpg_home:
    description: "Path to GNUPGHOME directory."
    required: false
    default: "${{ github.workspace }}/.gnupg"
  commit_msg:
    description: "Commit Message attached to tag"
    required: false


outputs:
  new_tag:
    description: "Name of the new tag"
    value: ${{ steps.tag.outputs.new_tag }}


runs:
  using: "composite"
  steps:
    - id: ctag
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home }}
      run: |
        set -euo pipefail
        TAG="v${{ inputs.version }}"
        COMMIT_MSG="${{ inputs.commit_msg }}"
        COMMIT_MSG="${COMMIT_MSG:-"Release $TAG"}"
        echo "Creating signed tag $TAG ..."
        
        git tag -a "$TAG" -m "$COMMIT_MSG" -s
        
        echo "Verifying tag $TAG ..."
        if ! git verify-tag "$TAG"; then
          echo "Couldn't verify tag $TAG"
          exit 0
        fi
        
        echo "Pushing tag $TAG ..."
        git push origin "$TAG"
        echo "new_tag=$TAG" >> $GITHUB_OUTPUT
        echo "Pushed signed tag $TAG successfully"
