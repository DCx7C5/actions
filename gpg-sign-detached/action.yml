name: "Create detached file signatures"
description: "Create detached OpenPGP signatures for files (using gpg)"
author: "DCx7C5"


inputs:
  files:
    required: false
    description: "List of files to sign"
    default: "*.tar.gz"
  sig_ext:
    required: false
    description: "File extension to use for detached signatures (default: sig)"
    default: "sig"
  workspace_dir:
    required: false
    description: "Workspace directory (default: ${{ github.workspace }})"
    default: ${{ github.workspace }}
  gpg_keyid:
    required: false
    description: "GPG key ID to use for signing (if not provided, gpg will use the default key)"
    default: ""
  gpg_passphrase:
    required: false
    description: "Passphrase for the GPG key (if the key is passphrase-protected and pass_precached is false)"
    default: ""
  gpg_pass_precached:
    required: false
    description: "Whether the GPG passphrase is already cached in the GPG agent (true/false)"
    default: "false"


outputs:
  signed_files:
    description: "Comma-separated list of created detached signature files"
    value: ${{ steps.sign_files.outputs.signed_files }}


runs:
  using: composite
  steps:
    - name: Create file signatures
      id: sign_files
      shell: bash
      working-directory: ${{ inputs.workspace_dir }}
      env:
        FILES_PATTERN: ${{ inputs.files }}
        SIG_EXT: ${{ inputs.sig_ext }}
        KEY_ID: ${{ inputs.gpg_keyid }}
        PASSPHRASE: ${{ inputs.gpg_passphrase }}
        PASS_PRECACHED: ${{ inputs.gpg_pass_precached }}
      run: |
        set -euo pipefail
        
        if [[ "$FILES_PATTERN" == *" "* ]]; then
          mapfile -t files < <(echo "$FILES_PATTERN" | tr ' ' '\n' | xargs -n1)
        else
          mapfile -t files < <(find . -maxdepth 1 -type f -name "$FILES_PATTERN" | sort)
        fi

        if [ ${#files[@]} -eq 0 ]; then
          echo "::warning::No files matched pattern '$FILES_PATTERN'"
          echo "signed_files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        echo "Found ${#files[@]} files to sign: ${files[*]}"
        signed_list=()
        
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "::warning::File not found: $file"
            continue
          fi
        
          sigfile="${file}.${SIG_EXT}"
          gpg_cmd=(gpg --batch --yes --armor --detach-sign --output "$sigfile")

          if [ -n "$KEY_ID" ]; then
            gpg_cmd+=(--default-key "$KEY_ID")
          fi

          if [[ -n "$PASSPHRASE" && "$PASS_PRECACHED" == 'false' ]]; then
            gpg_cmd+=(--passphrase-fd 0 --pinentry-mode=loopback)
            printf '%s' "$PASSPHRASE" | "${gpg_cmd[@]}" "$file"
          else
            "${gpg_cmd[@]}" "$file"
          fi

          if [ -f "$sigfile" ]; then
            echo "::notice::Created detached signature: $sigfile"
            signed_list+=("$sigfile")
          else
            echo "::error::Failed to create signature for $file"
            exit 1
          fi
        done
        
        {
          echo "signed_files<<EOF"
          echo "${signed_list[*]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        
    - name: Create step summary
      if: always() && steps.sign_files.outputs.signed_files != ''
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "signed_files<<EOF"
          echo "${{ steps.sign_files.outputs.signed_files }}"
          echo "EOF"
        } >> "$GITHUB_STEP_SUMMARY"
