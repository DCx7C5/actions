name: "Import GPG Key (Secure)"
description: "Import GPG Keys from GitHub Actions with security hardening"
author: "DCx7C5"


inputs:
  gpg_priv:
    required: false
    default: ''
    description: "GPG private key (will be masked in logs)"
  gpg_pass:
    required: false
    default: ''
    description: "GPG key passphrase (will be masked in logs)"
  gpg_pub:
    required: false
    default: ''
    description: "GPG public key"
  from_file:
    required: false
    default: 'false'
    description: "To import from file"
  from_secrets:
    required: false
    default: 'false'
    description: "To import from secrets"

outputs:
  fingerprint:
    description: "Fingerprint of the imported GPG key"
    value: ${{ steps.import_key.outputs.fingerprint }}

runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      run: |
        if [ -n "${{ inputs.gpg_priv }}" ]; then
          echo "::add-mask::${{ inputs.gpg_priv }}"
        fi
        if [ -n "${{ inputs.gpg_pass }}" ]; then
          echo "::add-mask::${{ inputs.gpg_pass }}"
        fi
        if [ -n "${{ inputs.gpg_pub }}" ]; then
          echo "::add-mask::${{ inputs.gpg_pub }}"
        fi

    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail
        
        if [[ ! -d "${GNUPGHOME:-}" ]]; then
          echo "::error::GNUPGHOME directory does not exist: ${GNUPGHOME:-}" >&2
          exit 1
        fi

        if [[ -z "${{ inputs.gpg_priv }} && -z "${{ inputs.gpg_pub }}" ]]; then
          echo "::error::gpg_priv or gpg_pub required" >&2
          exit 1
        fi
        
        if [[ "${{ inputs.from_secrets }}" != "true" && "${{ inputs.from_file }}" != "true" ]]; then
          echo "::error::Either from_secrets or from_file must be true" >&2
          exit 1
        fi
        
        if [[ -n "${{ inputs.gpg_priv }}" && -z "${{ inputs.gpg_pass }}" ]]; then
          echo "::error::Passphrase required for private key import" >&2
          exit 1
        fi

    - name: Import GPG Key from secret
      if: inputs.from_secrets == 'true'
      shell: bash
      run: |
        set -euo pipefail

        trap 'unset GPG_PASSPHRASE' EXIT

        # Import private key if provided
        if [ -n "${{ inputs.gpg_priv }}" ]; then
          if [ -z "${{ inputs.gpg_pass }}" ]; then
            echo "::error::Passphrase required for private key import" >&2
            exit 1
          fi
        
          exec 3<<< "${{ inputs.gpg_pass }}"
          
          if ! gpg --no-tty \
                 --batch \
                 --pinentry-mode loopback \
                 --passphrase-fd 3 \
                 --import <(echo "${{ inputs.gpg_priv }}") 2>/dev/null; then
            echo "::error::Failed to import private key" >&2
            exec 3>&-
            exit 1
          fi

          exec 3>&-
          echo "::notice::Private key imported successfully"
        fi

        if [ -n "${{ inputs.gpg_pub }}" ]; then
          if ! gpg --no-tty --batch --import <(echo "${{ inputs.gpg_pub }}") 2>/dev/null; then
            echo "::error::Failed to import public key" >&2
            exit 1
          fi

          echo "::notice::Public key imported successfully"
        fi

        KEY_COUNT_PUB=$(gpg --list-keys --with-colons 2>/dev/null | grep -c "^pub:" || true)
        KEY_COUNT_SEC=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec:" || true)
        KEY_COUNT=$((KEY_COUNT_PUB + KEY_COUNT_SEC))
        echo "::notice::Total GPG keys available: $KEY_COUNT"

    - name: Import GPG Key from file
      if: inputs.from_file == 'true'
      shell: bash
      run: |
        set -euo pipefail

        trap 'unset GPG_PASSPHRASE' EXIT

        if [ ! -f "${{ inputs.gpg_priv }}" ] && [ ! -f "${{ inputs.gpg_pub }}" ]; then
          echo "::error::No key files found" >&2
          exit 1
        fi

        if [ -f "${{ inputs.gpg_priv }}" ]; then
          if [ -z "${{ inputs.gpg_pass }}" ]; then
            echo "::error::Passphrase required for private key import from file" >&2
            exit 1
          fi

          if ! exec 3<<< "${{ inputs.gpg_pass }}" && \
             gpg --no-tty --batch --pinentry-mode loopback \
                 --passphrase-fd 3 \
                 --import "${{ inputs.gpg_priv }}" 2>/dev/null; then
            echo "::error::Failed to import private key from file" >&2
            exec 3>&-
            exit 1
          fi

          exec 3>&-

          shred -vfz -n 3 "${{ inputs.gpg_priv }}" || rm -f "${{ inputs.gpg_priv }}"
          echo "::notice::Private key imported and secure file removed"
        fi

        if [ -f "${{ inputs.gpg_pub }}" ]; then
          if ! gpg --no-tty --batch --import "${{ inputs.gpg_pub }}" 2>/dev/null; then
            echo "::error::Failed to import public key from file" >&2
            exit 1
          fi

          echo "::notice::Public key imported successfully"
        fi

        gpg --list-keys | head -5
        
        KEY_COUNT_PUB=$(gpg --list-keys --with-colons 2>/dev/null | grep -c "^pub:" || true)
        KEY_COUNT_SEC=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec:" || true)
        KEY_COUNT=$((KEY_COUNT_PUB + KEY_COUNT_SEC))
        echo "::notice::Total GPG keys available: $KEY_COUNT"
