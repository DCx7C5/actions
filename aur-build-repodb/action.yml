name: "Build Repository Database"
description: "GitHub Action to build a repository database using repo-add. It can optionally sign the database with GPG if a key ID and passphrase are provided."
author: "DCx7C5"

branding:
  icon: "archive"
  color: "blue"

inputs:
  database_name:
    required: true
    description: "Repository name (e.g: dystopian)"
  gpg_sign:
    required: false
    description: "Whether to sign the repository database with GPG (defaults to false)"
    default: 'false'
  gpg_key_id:
    required: false
    description: "GPG key ID to sign the repository database with"
    default: ''
  gpg_passphrase:
    required: false
    description: "Passphrase for GPG key"
    default: ''
  gh-token:
    required: false
    default: ''
    description: "GitHub token for API access (defaults to github.token)"
  working_directory:
    required: false
    default: ${{ github.workspace }}
    description: "Working directory to run the command in (defaults to github.workspace)"


runs:
  using: composite
  steps:
    - name: Mask GPG passphrase and validate inputs
      id: mask_and_validate
      shell: bash
      run: |
        set -euo pipefail

        gpg_key_id="${{ inputs.gpg_key_id }}"
        
        if [[ '${{ inputs.gpg_passphrase }}' != '' ]]; then
          echo '::add-mask::${{ inputs.gpg_passphrase }}'
        fi
        
        if [[ -n "$gpg_key_id" ]]; then
          echo "::notice::GPG signing is enabled with key ID '$gpg_key_id'"
          if [[ -n "${{ inputs.gpg_passphrase }}" ]]; then
            echo "::notice::GPG passphrase is provided (will be used for signing)"
          else
            echo "::notice::No GPG passphrase provided (will attempt to sign without passphrase)"
          fi
        else
          echo "::notice::GPG signing is disabled (no key ID provided)"
        fi

    - name: Validate signing requirements
      if: inputs.gpg_sign == 'true' && inputs.gpg_key_id == ''
      shell: bash
      run: |
        echo "::error::gpg_key_id is required when gpg_sign is set to 'true'." >&2
        exit 1

    - name: Build unsigned repository database
      id: aur_build_repo
      if: inputs.gpg_sign != 'true'
      uses: DCx7C5/actions/arch-run-cmd@v1
      working-directory: "${{ inputs.working_directory }}"
      with:
        run-with-sudo: 'false'
        enable-ccache: 'false'
        preset-passphrase-cache: 'false'
        gh-token: ${{ inputs.gh-token || env.GH_TOKEN || github.token }}
        command: |
          set -euo pipefail

          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} == 0 )); then
            echo "::error::No package files matching '*.pkg.tar.zst' found in working directory." >&2
            exit 1
          fi

          repo-add --new --remove "${{ inputs.database_name }}.db.tar.gz" "${pkgs[@]}" || {
            echo "::error::Failed to build repository database (GPG signing is disabled)" >&2
            exit 1
          }
          
          echo "::notice::Repository database '${{ inputs.database_name }}.db.tar.gz' built successfully"

    - name: Build signed repository database
      if: inputs.gpg_sign == 'true' && inputs.gpg_key_id != ''
      id: aur_build_repo_signed
      uses: DCx7C5/actions/arch-run-cmd@v1
      working-directory: "${{ inputs.working_directory }}"
      with:
        run-with-sudo: 'false'
        enable-ccache: 'false'
        preset-passphrase-cache: 'true'
        gh-token: ${{ inputs.gh-token || env.GH_TOKEN || github.token }}
        gpg-key-id: ${{ inputs.gpg_key_id }}
        gpg-passphrase: ${{ inputs.gpg_passphrase }}
        command: |
          set -euo pipefail

          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} == 0 )); then
            echo "::error::No package files matching '*.pkg.tar.zst' found in working directory." >&2
            exit 1
          fi

          repo-add --sign --new --remove "${{ inputs.database_name }}.db.tar.gz" "${pkgs[@]}" || {
            echo "::error::Failed to build and sign repository database with GPG key ID '${{ inputs.gpg_key_id }}'" >&2
            exit 1
          }
          
          echo "::notice::Signed repository database '${{ inputs.database_name }}.db.tar.gz' built successfully"