name: "Import GPG Keys from Secrets"
description: "Import GPG keys from GitHub Actions secrets or environment variables"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"


inputs:
  gpg_key:
    required: false
    default: ''
    description: "GPG key (inline) - will be masked in logs"
  pass:
    required: false
    default: ''
    description: "Passphrase for the private key - will be masked in logs"
  type:
    required: false
    default: 'auto'
    description: "GPG Key Type "
  gpg_home:
    required: false
    default: ''
    description: "Path to GPG Home Directory"


outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key"
    value: ${{ steps.import_protected.outputs.fingerprint || steps.import_unprotected.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.import_protected.outputs.keys_total || steps.import_unprotected.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.import_protected.outputs.keys_public || steps.import_unprotected.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.import_protected.outputs.keys_secret || steps.import_unprotected.outputs.keys_secret }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      id: mask_and_validate
      shell: bash
      run: |
        if [[ -n '${{ inputs.pass }}' && -n '${{ inputs.gpg_key }}' ]]; then
          echo "::add-mask::${{ inputs.gpg_key }}"
          echo "::add-mask::${{ inputs.pass }}"
        elif [[ -z '${{ inputs.gpg_key }}' ]]; then
          echo "::error:: inputs.gpg_key is missing!"  >&2
          exit1
        fi
        
        if [ -z "${GNUPGHOME:-}" ] || [ ! -d "${GNUPGHOME}" ]; then
          echo "::error::GNUPGHOME not set or does not exist: ${GNUPGHOME:-'(empty)'}" >&2
          exit 1
        fi

    - name: Get Key Type
      id: keytype
      if: inputs.type == 'auto'
      shell: bash
      env:
        GPG_KEY: '${{ inputs.gpg_key }}'
      run: |
        set -euo pipefail
        header=(echo "$GPG_KEY" | head -n 1)
        if [[ "$header" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
          echo "seckey=$GPG_KEY" >> "$GITHUB_OUTPUT"
        elif [[ "$header" == *"BEGIN PGP PUBLIC KEY BLOCK"* ]]; then
          echo "pubkey=$GPG_KEY" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Invalid GPG key format: missing PGP block header" >&2
          exit 1
        fi

    - name: Import Protected Key
      id: import_protected
      if: steps.mask_and_validate.outputs.seckey != ''
      uses: ./gpg-import/gpg-import-protected
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      with:
        gpg_key: '${{ inputs.gpg_key }}'
        pass: '${{ inputs.pass }}'
        type: 'inline'

    - name: Import Unprotected Key
      id: import_unprotected
      if: steps.mask_and_validate.outputs.pubkey != ''
      uses: ./gpg-import/gpg-import-no-protection
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      with:
        gpg_key: '${{ inputs.gpg_key }}'
