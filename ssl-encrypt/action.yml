name: "SSL Encrypt file or inline value"
description: "Encrypts file or inline value using SSL/OpenSSL with provided password, with detection and security hardening for secrets"
author: "DCx7C5"

inputs:
  input:
    required: true
    description: "File path or inline variable to encrypt"
  passphrase:
    required: true
    description: "Password for SSL/OpenSSL encryption"
  salt:
    required: false
    default: ''
    description: "Optional salt value for encryption"
  input_type:
    required: false
    default: 'auto'
    description: "Input type: 'auto' (detect based on input), 'file' (treat input as file path), or 'inline' (treat input as inline variable)"
  input_encoding:
    required: false
    default: 'auto'
    description: "Input encoding: 'auto' (detect based on input), 'binary' (raw bytes), 'base64' (base64-codiert), 'text' (UTF-8-String), oder 'raw' (UTF-8-String, synonym zu text)"
  output_encoding:
    required: false
    default: 'base64'
    description: "Output encoding: 'base64' (base64-encoded) or 'raw' (always UTF-8-String)."
  cleanup:
    required: false
    default: 'false'
    description: "Whether to securely delete the input file after encryption (only applies if input_type is 'file')"

outputs:
  type:
    description: "Detected input type: 'file' or 'inline'"
    value: ${{ steps.parse_type.outputs.type || inputs.input_type }}
  encoding:
    description: "Detected output format: 'binary', 'base64', or 'text'"
    value: ${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}
  encrypted_content:
    description: "The encrypted content (base64 string, raw string, or file path depending on inputs and detection)"
    value: ${{ steps.encrypt_ssl_file.outputs.encrypted_content || steps.encrypt_ssl_value.outputs.encrypted_content }}


runs:
  using: composite
  steps:
    - name: Mask password input
      id: mask_input
      shell: bash
      run: |
        if [ -n '${{ inputs.input }}' ]; then
          echo "::add-mask::${{ inputs.input }}"
        fi
        if [ -n '${{ inputs.passphrase }}' ]; then
          echo "::add-mask::${{ inputs.passphrase }}"
        fi
        if [ -n '${{ inputs.salt }}' ]; then
          echo "::add-mask::${{ inputs.salt }}"
        fi

        if [[ -z '${{ inputs.input }}' || -z '${{ inputs.passphrase }}' ]]; then
          echo "::error::'input' cannot be empty." >&2
          exit 1
        fi
        if [[ "${{ inputs.input_type }}" != "auto" && "${{ inputs.input_type }}" != "file" && "${{ inputs.input_type }}" != "inline" ]]; then
          echo "::error::Invalid 'input_type' input: '${{ inputs.input_type }}'. Must be 'auto', 'file', or 'inline'." >&2
          exit 1
        elif [[ "${{ inputs.input_encoding }}" != "auto" && "${{ inputs.input_encoding }}" != "binary" && "${{ inputs.input_encoding }}" != "text" && "${{ inputs.input_encoding }}" != "base64" && "${{ inputs.input_encoding }}" != "raw" ]]; then
          echo "::error::Invalid 'input_encoding' input: '${{ inputs.input_encoding }}'. Must be 'auto', 'binary', 'text', 'base64', or 'raw'." >&2
          exit 1
        fi
        if [[ "${{ inputs.output_encoding }}" != "base64" && "${{ inputs.output_encoding }}" != "raw" ]]; then
          echo "::error::Invalid 'output_encoding' input: '${{ inputs.output_encoding }}'. Must be 'base64' or 'raw'." >&2
          exit 1
        fi
        if [[ "${{ inputs.input_type }}" == "auto" && -z "${{ inputs.input }}" ]]; then
          echo "::error::'input' cannot be empty when 'input_type' is set to 'auto'." >&2
          exit 1
        fi

    - name: Parse Type
      id: parse_type
      if: inputs.input_type == 'auto'
      shell: bash
      run: |
        if [[ -n "${{ inputs.input }}" && -f "${{ inputs.input }}" ]]; then
          echo "type=file" >> "$GITHUB_OUTPUT"
        elif [[ -n "${{ inputs.input }}" ]]; then
          echo "type=inline" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Unable to determine input type from 'input'. Please specify 'input_type' explicitly." >&2
          exit 1
        fi

    - name: Parse Encoding
      id: parse_encoding
      if: inputs.input_encoding == 'auto'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
      run: |
        if [[ "$INPUT_TYPE" == "file" && -f "${{ inputs.input }}" ]]; then
          if grep -qP "[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]" "${{ inputs.input }}"; then
            echo "encoding=binary" >> "$GITHUB_OUTPUT"
          elif grep -qP "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$" "${{ inputs.input }}"; then
            echo "encoding=base64" >> "$GITHUB_OUTPUT"
          else
            echo "encoding=text" >> "$GITHUB_OUTPUT"
          fi
        elif [[ "$INPUT_TYPE" == "inline" ]]; then
          if grep -qP "[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]" <<< "${{ inputs.input }}"; then
            echo "encoding=binary" >> "$GITHUB_OUTPUT"
          elif grep -qP "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$" <<< "${{ inputs.input }}"; then
            echo "encoding=base64" >> "$GITHUB_OUTPUT"
          else
            echo "encoding=text" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "::error::Unable to determine encoding for input. Please specify 'input_encoding' explicitly." >&2
          exit 1
        fi

    - name: Encrypt SSL value
      id: encrypt_ssl_value
      if: steps.parse_type.outputs.type != 'file'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
        INPUT_ENCODING: "${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}"
        OUTPUT_ENCODING: "${{ inputs.output_encoding }}"
        SALT: "${{ inputs.salt }}"
        PASSPHRASE: "${{ inputs.passphrase }}"
      run: |
        set -euo pipefail
        openssl_args=()
        if [ -n "$SALT" ]; then
          openssl_args+=("-salt" "-S" "$SALT")
        fi
        if [[ "$OUTPUT_ENCODING" == "base64" ]]; then
          encrypted_content="$(
            echo -n "${{ inputs.input }}" \
              | openssl enc -aes-256-cbc -pbkdf2 "${openssl_args[@]}" -pass pass:"$PASSPHRASE" \
              | base64 -w0
          )"
        else
          encrypted_content="$(
            echo -n "${{ inputs.input }}" \
              | openssl enc -aes-256-cbc -pbkdf2 "${openssl_args[@]}" -pass pass:"$PASSPHRASE"
          )"
        fi
        delim="__GHA_DELIM_$(date +%s%N)__"
        {
          echo "encrypted_content<<$delim"
          printf '%s\n' "$encrypted_content"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Encryption successful for inline input"

    - name: Encrypt SSL file
      id: encrypt_ssl_file
      if: steps.parse_type.outputs.type == 'file'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
        INPUT_ENCODING: "${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}"
        OUTPUT_ENCODING: "${{ inputs.output_encoding }}"
        SALT: "${{ inputs.salt }}"
        PASSPHRASE: "${{ inputs.passphrase }}"
      run: |
        set -euo pipefail
        openssl_args=()
        if [ -n "$SALT" ]; then
          openssl_args+=("-salt" "-S" "$SALT")
        fi
        if [[ "$OUTPUT_ENCODING" == "base64" ]]; then
          encrypted_content="$(
            openssl enc -aes-256-cbc -pbkdf2 "${openssl_args[@]}" -in "${{ inputs.input }}" -pass pass:"$PASSPHRASE" \
              | base64 -w0
          )"
        else
          encrypted_content="$(
            openssl enc -aes-256-cbc -pbkdf2 "${openssl_args[@]}" -in "${{ inputs.input }}" -pass pass:"$PASSPHRASE"
          )"
        fi
        delim="__GHA_DELIM_$(date +%s%N)__"
        {
          echo "encrypted_content<<$delim"
          printf '%s\n' "$encrypted_content"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Encryption successful for file input: ${{ inputs.input }}"

    - name: Cleanup
      if: always() && steps.parse_type.outputs.type == 'file' && inputs.cleanup == 'true'
      shell: bash
      run: |
        set +e
        input_file="${{ inputs.input }}"
        if [[ -f "$input_file" ]]; then
          if command -v shred &> /dev/null; then
            if shred -vfz -n 10 "$input_file" 2>/dev/null; then
              echo "::notice::Securely deleted input file: $input_file"
            else
              echo "::warning::shred failed, attempting standard removal of: $input_file"
              rm -f "$input_file" 2>/dev/null || {
                echo "::warning::Failed to delete input file: $input_file"
                exit 1
              }
            fi
          else
            if rm -f "$input_file" 2>/dev/null; then
              echo "::notice::Deleted input file: $input_file"
            else
              echo "::warning::Failed to delete input file: $input_file"
              exit 1
            fi
          fi
        else
          echo "::notice::Input file not found or already removed: $input_file"
        fi
        unset PASSPHRASE 2>/dev/null || true
        unset SALT 2>/dev/null || true
        echo "::notice::Cleanup completed"
