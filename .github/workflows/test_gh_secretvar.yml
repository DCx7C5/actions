#file: noinspection GithubFunctionSignatureValidation
name: "Test gh-variables & gh-secrets Actions"
on:
  workflow_dispatch:
    inputs:
      test_body:
        description: "Body content for set actions (optional, can be overridden by test cases)"
        required: false
        default: "testvalue"
        type: string
      test_name:
        description: "Name for the variable/secret to set (optional, can be overridden by test cases)"
        required: false
        default: "TEST_VAR"
        type: string
  push:
    paths:
      - gh-variables/action.yml
      - gh-secrets/action.yml
      - .github/workflows/test_gh_secretvar.yml


jobs:
  create-testcases:
    runs-on: ubuntu-latest
    outputs:
      matrix_variables_set: ${{ steps.set_variables.outputs.matrix_variables_set }}
      matrix_variables_get: ${{ steps.set_variables.outputs.matrix_variables_get }}
      matrix_variables_delete: ${{ steps.set_variables.outputs.matrix_variables_delete }}
      matrix_secrets_set: ${{ steps.set_variables.outputs.matrix_secrets_set }}
      matrix_secrets_delete: ${{ steps.set_variables.outputs.matrix_secrets_delete }}
    steps:
      - name: Prepare Test Cases
        id: set_variables
        shell: bash
        run: |
          INPUT_VARNAME="${{ inputs.test_name || 'TEST_VAR_ORG' }}"
          INPUT_SECRETNAME="${{ inputs.test_name || 'TEST_SECRET_ORG' }}"
          INPUT_BODY="${{ inputs.test_body || 'varvalue' }}"
          
          cat > matrix_variables.json <<EOF
          [
            {"action": "set", "variable-name1": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions"},
            {"action": "set", "variable-name2": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST"},
            {"action": "set", "variable-name3": "$INPUT_VARNAME", "body": "$INPUT_BODY", "org": "DystopianOS", "repos": "DystopianOS/Dystopian-PKGBUILDS"},
            {"action": "get", "variable-name1": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions", "json": "value"},
            {"action": "get", "variable-name2": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST", "json": "value"},
            {"action": "get", "variable-name3": "$INPUT_VARNAME", "body": "$INPUT_BODY", "org": "DystopianOS", "repos": "DystopianOS/Dystopian-PKGBUILDS"},
            {"action": "delete", "variable-name1": "TEST_VAR_REPO", "body": "varvalue", "repo": "DCx7C5/actions"},
            {"action": "delete", "variable-name2": "TEST_VAR_ENV", "body": "varvalue", "env": "TEST"},
            {"action": "delete", "variable-name2": "$INPUT_VARNAME", "body": "$INPUT_BODY", "org": "DystopianOS", "repos": "DystopianOS/Dystopian-PKGBUILDS"}
          ]
          EOF

          jq 'map(if has("body") then . else . + {"body": ""} end)' matrix_variables.json > tmp && mv tmp matrix_variables.json

          matrix_variables_set=$(jq -cr 'map(select(.action == "set"))' matrix_variables.json)
          echo "matrix_variables_set=${matrix_variables_set:-[]}" >> "$GITHUB_OUTPUT"
          matrix_variables_get=$(jq -cr 'map(select(.action == "get"))' matrix_variables.json)
          echo "matrix_variables_get=${matrix_variables_get:-[]}" >> "$GITHUB_OUTPUT"
          matrix_variables_delete=$(jq -cr 'map(select(.action == "delete"))' matrix_variables.json)
          echo "matrix_variables_delete=${matrix_variables_delete:-[]}" >> "$GITHUB_OUTPUT"
          
          cat > matrix_secrets.json <<EOF
          [
            {"action": "set", "secret-name1": "TEST_SECRET_REPO", "body": "secretvalue", "repo": "DCx7C5/actions"},
            {"action": "set", "secret-name2": "TEST_SECRET_ENV", "body": "secretvalue", "env": "TEST"},
            {"action": "set", "secret-name3": "$INPUT_SECRETNAME", "body": "$INPUT_BODY", "org": "DystopianOS", "repos": "DystopianOS/Dystopian-PKGBUILDS"},
            {"action": "delete", "secret-name1": "TEST_SECRET_REPO", "body": "secretvalue", "repo": "DCx7C5/actions"},
            {"action": "delete", "secret-name2": "TEST_SECRET_ENV", "body": "secretvalue", "env": "TEST"},
            {"action": "delete", "secret-name3": "$INPUT_SECRETNAME", "body": "$INPUT_BODY", "org": "DystopianOS", "repos": "DystopianOS/Dystopian-PKGBUILDS"}

          ]
          EOF

          jq 'map(if has("body") then . else . + {"body": ""} end)' matrix_secrets.json > tmp && mv tmp matrix_secrets.json
          matrix_secrets_set=$(jq -cr 'map(select(.action == "set"))' matrix_secrets.json)
          echo "matrix_secrets_set=${matrix_secrets_set:-[]}" >> "$GITHUB_OUTPUT"
          matrix_secrets_delete=$(jq -cr 'map(select(.action == "delete"))' matrix_secrets.json)
          echo "matrix_secrets_delete=${matrix_secrets_delete:-[]}" >> "$GITHUB_OUTPUT"
        
  test-set-variables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - create-testcases
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json_encode: ${{ matrix.json_encode || false }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}

  test-set-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    needs:
      - create-testcases
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_secrets_set) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Secret Action
        id: test_secret
        uses: ./gh-secrets
        with:
          secret-name: ${{ matrix.secret-name }}
          body: ${{ matrix.body }}
          action: ${{ matrix.action }}
          print: ${{ matrix.print }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env }}
          org: ${{ matrix.org }}
          repo: ${{ matrix.repo }}
          repos: ${{ matrix.repos }}
          visibility: ${{ matrix.visibility }}
          no-repos-select: ${{ matrix.no-repos-select }}

  summary-set:
    runs-on: ubuntu-latest
    needs:
      - test-set-variables
      - test-set-secrets
    steps:
      - name: Step Summary
        if: always()
        shell: bash
        run: |
          echo "## Test Summary: Set" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.test-set-variables.result }}" == "success" ]]; then
            echo "- :white_check_mark: test-set-variables: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: test-set-variables: failure" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ needs.test-set-secrets.result }}" == "success" ]]; then
            echo "- :white_check_mark: test-set-secrets: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: test-set-secrets: failure" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "---" >> "$GITHUB_STEP_SUMMARY"

  test-get-variables:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs:
      - create-testcases
      - test-set-variables
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_get) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          json: ${{ matrix.json || '' }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}

  summary-get:
    runs-on: ubuntu-latest
    needs:
      - test-get-variables
    steps:
      - name: Step Summary
        if: always()
        shell: bash
        run: |
          echo "## Test Summary: Get" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.test-get-variables.result }}" == "success" ]]; then
            echo "- :white_check_mark: test-get-variables: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: test-get-variables: failure" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          
  test-delete-variables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - create-testcases
      - test-get-variables
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_variables_delete) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Variable Action
        id: test_variable
        uses: ./gh-variables
        with:
          variable-name: ${{ matrix.variable-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}

  test-delete-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - create-testcases
      - test-set-secrets
    strategy:
      matrix:
        include: ${{ fromJson(needs.create-testcases.outputs.matrix_secrets_delete) }}
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Test Secret Action
        id: test_secret
        uses: ./gh-secrets
        with:
          secret-name: ${{ matrix.secret-name }}
          body: ${{ matrix.body || '' }}
          action: ${{ matrix.action }}
          gh-token: ${{ steps.app_token.outputs.token }}
          env: ${{ matrix.env || '' }}
          org: ${{ matrix.org || '' }}
          repo: ${{ matrix.repo || '' }}
          repos: ${{ matrix.repos || '' }}
          visibility: ${{ matrix.visibility || '' }}
          no-repos-select: ${{ matrix.no-repos-select || '' }}

  summary-delete:
    runs-on: ubuntu-latest
    needs:
      - test-delete-variables
      - test-delete-secrets
    steps:
      - name: Step Summary
        if: always()
        shell: bash
        run: |
          echo "## Test Summary: Delete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.test-delete-variables.result }}" == "success" ]]; then
            echo "- :white_check_mark: test-delete-variables: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: test-delete-variables: failure" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ needs.test-delete-secrets.result }}" == "success" ]]; then
            echo "- :white_check_mark: test-delete-secrets: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: test-delete-secrets: failure" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "---" >> "$GITHUB_STEP_SUMMARY"

