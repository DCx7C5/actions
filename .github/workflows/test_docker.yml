name: "Test Docker Build/Push"
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "The name of the Docker image to build and push"
        required: false
        default: 'test-build'
        type: string
      image-version:
        description: "The version tag of the Docker image to build and push"
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - main
    paths:
      - docker-build-image/action.yml
      - docker-push-image/action.yml
      - .github/workflows/test_docker.yml

concurrency:
  group: 'test-docker-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test-docker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      packages: write
      contents: read
      actions: write
    steps:
      - name: GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        id: build_image
        uses: ./docker-build-image
        with:
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          ccache-dir: ${{ format('{0}/.ccache', github.workspace) }}
          user: runner
          group: runner
          uid: '1001'
          gid: '127'
          gh-token: ${{ steps.app_token.outputs.token }}
          image-tag: ${{ inputs.image-tag || 'test-build' }}
          image-version: ${{ inputs.image-version || 'latest' }}
          dockerfile-path: Dockerfile

      - name: Push Docker image to GitHub Container Registry
        id: push_image
        if: success()
        uses: ./docker-push-image
        with:
          registry: 'ghcr.io'
          user: ${{ github.actor }}
          image-tag: ${{ inputs.image-tag || 'test-build' }}
          image-version: ${{ inputs.image-version || 'latest' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pushed image
        id: verify
        if: success()
        env:
          FULL_IMAGE: ${{ steps.push_image.outputs.full_image }}
        run: |
          set -euo pipefail

          echo "verify_ok=false" >> "$GITHUB_OUTPUT"

          # Remove local images so pull is a true remote fetch
          docker rmi "$FULL_IMAGE" 2>/dev/null || true
          docker rmi "${{ inputs.image-tag || 'test-build' }}:${{ inputs.image-version || 'latest' }}" 2>/dev/null || true

          echo "::notice::Pulling $FULL_IMAGE to verify..."
          docker pull "$FULL_IMAGE"

          # Basic sanity: image must exist locally after pull
          if ! docker image inspect "$FULL_IMAGE" >/dev/null 2>&1; then
            echo "::error::Pulled image $FULL_IMAGE not found locally"
            exit 1
          fi

          echo "verify_ok=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Image verified successfully"

      - name: Cleanup — remove local images
        if: always()
        env:
          FULL_IMAGE: ${{ steps.push_image.outputs.full_image }}
          LOCAL_IMAGE: "${{ inputs.image-tag || 'test-build' }}:${{ inputs.image-version || 'latest' }}"
        run: |
          docker rmi "$FULL_IMAGE" 2>/dev/null || true
          docker rmi "$LOCAL_IMAGE" 2>/dev/null || true
          echo "::notice::Local images cleaned up"

      - name: Cleanup — delete remote package
        if: always() && steps.push_image.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          IMAGE_TAG: ${{ inputs.image-tag || 'test-build' }}
          IMAGE_VERSION: ${{ inputs.image-version || 'latest' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          pkg_name="${IMAGE_TAG,,}"
          deleted=false

          # Try org endpoint first, then user
          for scope in orgs users; do
            base="/${scope}/${OWNER}/packages/container/${pkg_name}"

            # 1) Try to find and delete the specific version
            version_id=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "${base}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${IMAGE_VERSION}\") | .id" \
            2>/dev/null || true)

            if [[ -n "$version_id" ]]; then
              echo "::notice::Deleting version $version_id via ${scope} endpoint..."
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "${base}/versions/${version_id}" 2>/dev/null && deleted=true || true
            fi

            # 2) Check remaining versions — if none left, delete whole package
            remaining=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "${base}/versions" --jq 'length' \
            2>/dev/null || echo "0")

            if [[ "$remaining" == "0" ]]; then
              echo "::notice::No versions left, deleting package ${pkg_name} via ${scope}..."
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "${base}" 2>/dev/null && deleted=true || true
            fi

            [[ "$deleted" == "true" ]] && break
          done

          if [[ "$deleted" == "true" ]]; then
            echo "::notice::Remote package cleaned up successfully"
          else
            echo "::warning::Could not delete remote package — may need manual cleanup or different token permissions"
          fi

      - name: Job Summary
        if: always()
        env:
          BUILD_IMAGE: ${{ steps.build_image.outputs.image }}
          FULL_IMAGE: ${{ steps.push_image.outputs.full_image }}
          BUILD_OUTCOME: ${{ steps.build_image.outcome }}
          PUSH_OUTCOME: ${{ steps.push_image.outcome }}
        run: |
          s() { [[ "$1" == "success" ]] && printf '\u2714' || printf '\u2718'; }

          {
            echo "### Docker Build \u0026 Push"
            echo ""
            echo "| Step | Status | Image |"
            echo "|:-----|:------:|:------|"
            echo "| Build | $(s "$BUILD_OUTCOME") \`${BUILD_OUTCOME}\` | \`${BUILD_IMAGE:-n/a}\` |"
            echo "| Push  | $(s "$PUSH_OUTCOME") \`${PUSH_OUTCOME}\` | \`${FULL_IMAGE:-n/a}\` |"
            echo ""
            if [[ "$BUILD_OUTCOME" == "success" && "$PUSH_OUTCOME" == "success" ]]; then
              echo '```sh'
              echo "docker pull ${FULL_IMAGE}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
