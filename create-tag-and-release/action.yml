name: "Create & Push Signed Release"
description: "Create & push a signed git tag + GitHub Release with optional file signing"
author: "DCx7C5"


inputs:
  version:
    description: "The new version to use (e.g. v1.2.3 or 1.2.3)"
    required: true
  files:
    description: "Space-separated list of files/globs to attach to the release"
    required: false
    default: ""
  pre_release:
    description: "Mark this as a pre-release"
    required: false
    default: 'false'
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: "${{ github.workspace }}/.gnupg"
  fingerprint:
    description: "GPG key fingerprint or email to use for signing the tag (optional)"
    required: false
    default: ""
  gpg_pass:
    description: "Passphrase for the GPG key (if needed, optional)"
    required: false
    default: ""
  commit_msg:
    description: "Commit message for the annotated tag"
    required: false
    default: "Release ${{ inputs.version }}"
  release_notes:
    description: "Release body/notes (markdown supported)"
    required: false
    default: "Release ${{ inputs.version }}"


outputs:
  new_rel:
    description: "Name of the new release (tag name)"
    value: ${{ steps.create_release.outputs.tag_name }}
  release_url:
    description: "URL of the created GitHub Release"
    value: ${{ steps.create_release.outputs.url }}


runs:
  using: composite
  steps:
    - name: Mask sensitive values
      shell: bash
      if: inputs.fingerprint != ''
      run: |
        echo "::add-mask::${{ inputs.fingerprint }}"
        echo "::add-mask::${{ inputs.gpg_pass }}"
        echo "::add-mask::$FINGERPRINT"
        echo "::add-mask::$INPUT_FINGERPRINT"

    - name: Create & sign annotated tag
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home }}
        TAG: ${{ inputs.version }}
        FINGERPRINT: ${{ inputs.fingerprint }}
      run: |
        set -euo pipefail
        echo "Attempting to create signed tag: $TAG"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists."
          exit 1
        fi
        
        SIGN_ARGS=()
        if [ -n "$FINGERPRINT" ]; then
          echo "Fingerprint provided → verifying key exists..."

          # Check if this key is usable (secret key present)
          if ! gpg --with-colons --list-secret-keys "$FINGERPRINT" >/dev/null 2>&1; then
            gpg --list-secret-keys --keyid-format LONG || true
            echo "::error::Provided fingerprint $FINGERPRINT not found or no secret key available."
            exit 1
          fi

          echo "Key found → using --local-user $FINGERPRINT"
          SIGN_ARGS=(--local-user "$FINGERPRINT")

          # Try to extract name/email from the key's uid
          UID_LINE=$(gpg --with-colons --list-keys "$FINGERPRINT" | awk -F: '/^uid:/ {print $10; exit}')
          if [ -n "$UID_LINE" ]; then
            UID_DECODED=$(echo "$UID_LINE" | sed 's/%20/ /g; s/%3C/</g; s/%3E/>/g; s/%40/@/g')
            if [[ "$UID_DECODED" =~ ^([^<]+)[[:space:]]+\<(.*)\>$ ]]; then
              REAL_NAME="${BASH_REMATCH[1]//^[[:space:]]+|[[:space:]]+$/}"
              REAL_EMAIL="${BASH_REMATCH[2]}"
              echo "Using real identity from key: $REAL_NAME <$REAL_EMAIL>"
              git config user.name "$REAL_NAME"
              git config user.email "$REAL_EMAIL"
            else
              echo "::warning::Could not parse name/email from key uid: $UID_DECODED"
            fi
          else
            echo "::warning::No uid found for key $FINGERPRINT → keeping default identity"
          fi
        else
          echo "No fingerprint provided → looking for default secret key..."

          DEFAULT_FP=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -n "$DEFAULT_FP" ]; then
            echo "Found default key: $DEFAULT_FP → using it"
            FINGERPRINT="$DEFAULT_FP"
            SIGN_ARGS=(--local-user "$FINGERPRINT")

            # Try extract identity from default key
            UID_LINE=$(gpg --with-colons --list-keys "$FINGERPRINT" | awk -F: '/^uid:/ {print $10; exit}')
            if [ -n "$UID_LINE" ]; then
              UID_DECODED=$(echo "$UID_LINE" | sed 's/%20/ /g; s/%3C/</g; s/%3E/>/g; s/%40/@/g')
              if [[ "$UID_DECODED" =~ ^([^<]+)[[:space:]]+\<(.*)\>$ ]]; then
                REAL_NAME="${BASH_REMATCH[1]//^[[:space:]]+|[[:space:]]+$/}"
                REAL_EMAIL="${BASH_REMATCH[2]}"
                git config user.name "$REAL_NAME"
                git config user.email "$REAL_EMAIL"
                echo "Using identity from default key: $REAL_NAME <$REAL_EMAIL>"
              fi
            fi
          else
            echo "::notice::No secret keys found → creating unsigned tag or failing depending on policy"
            # If you want to require signing, exit 1 here
            # exit 1
          fi
        fi
        
        echo "Creating signed tag: $TAG"

        if [ -n '${{ inputs.gpg_pass }}' ]; then
          # Passphrase-protected key → use fd for passphrase
          if ! git tag -a "$TAG" -m "${{ inputs.commit_msg }}" \
               "${SIGN_ARGS[@]}" --sign \
               --passphrase-fd 3 --pinentry-mode loopback \
               3<<< '${{ inputs.gpg_pass }}'; then
            echo "::error::git tag signing failed (check passphrase, key trust, or pinentry config)"
            gpg --list-secret-keys --keyid-format LONG || true
            exit 1
          fi
        else
          # No passphrase → normal signing
          if ! git tag -a "$TAG" -m "${{ inputs.commit_msg }}" \
               "${SIGN_ARGS[@]}" --sign; then
            echo "::error::git tag signing failed"
            gpg --list-secret-keys --keyid-format LONG || true
            exit 1
          fi
        fi

        echo "Successfully created signed tag: $TAG"
        git show --pretty=fuller "$TAG" || true
        
    - name: Push signed tag
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git push origin "${{ inputs.version }}"

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: ${{ inputs.version }}
        body: ${{ inputs.release_notes }}
        draft: false
        prerelease: ${{ inputs.pre_release == 'true' }}
        generate_release_notes: ${{ inputs.release_notes == '' }}
        fail_on_unmatched_files: true
        files: ${{ inputs.files }}

    - name: Output release info
      shell: bash
      run: |
        echo "new_release_url=${{ steps.create_release.outputs.url }}" >> $GITHUB_OUTPUT
        echo "new_release_tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
