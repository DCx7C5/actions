name: "Add remote to Git repository"
description: "Add a remote to the Git repository in the current workspace"
author: "DCx7C5"


inputs:
  remote_url:
    required: true
    description: "URL of the repository to add as a remote"
  remote_name:
    required: false
    default: 'upstream'
    description: "Name of the remote to add (default: 'upstream')"


runs:
  using: composite
  steps:
    - id: add_remote
      shell: bash
      run: |
        set -euo pipefail
        
        remote_name="${{ inputs.remote_name }}"
        remote_url="${{ inputs.remote_url }}"
            
        # Check if the remote already exists
        if git remote | grep -q "^${remote_name}$"; then
          echo "::warning::Remote '${remote_name}' already exists. Skipping addition."
          exit 0
        fi
        
        # Add the new remote
        git remote add "${remote_name}" "${remote_url}"
        
        echo "::notice::Remote '${remote_name}' added with URL: ${remote_url}"
