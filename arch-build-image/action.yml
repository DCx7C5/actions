name: "Build Arch Linux Docker Image"
description: "Build the Arch Linux Docker image used for AUR builds"
author: "DCx7C5"

inputs:
  image_tag:
    description: "Docker image tag to build (defaults to 'arch-aur-builder:latest')"
    required: false
    default: 'arch-aur-builder'
  image_version:
    description: "Docker image version tag (defaults to 'latest')"
    required: false
    default: 'latest'
  working_directory:
    description: "Working directory inside container"
    required: false
    default: ${{ github.workspace }}
  gpg_home:
    description: "GPG home directory (usually in workspace)"
    required: false
    default: '${{ github.workspace }}/.gnupg'
  ccache_dir:
    description: "ccache directory for build caching"
    required: false
    default: "${{ github.workspace }}/.ccache"
  github_token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ''

outputs:
  image:
    description: "The Docker image tag that was built"
    value: ${{ steps.build_image.outputs.image || inputs.image }}
  image_tag:
    description: "The Docker image tag (without version) that was built"
    value: ${{ steps.build_image.outputs.image_tag || inputs.image_tag }}
  image_version:
    description: "The Docker image version tag that was built"
    value: ${{ steps.build_image.outputs.image_version || inputs.image_version }}

runs:
  using: composite
  steps:
    - id: build_image
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working_directory || github.workspace }}
        GH_TOKEN: "${{ inputs.github_token || env.GH_TOKEN || github.token }}"
        GNUPGHOME: "${{ inputs.gpg_home }}"
        CCACHE_DIR: "${{ inputs.ccache_dir }}"
      working-directory: ${{ inputs.working_directory || github.workspace }}
      run: |
        set -euo pipefail
        
        IMAGE="${{ inputs.image_tag }}:${{ inputs.image_version }}"
        
        echo "::notice::Building Arch Linux Docker image for AUR builds..."
        docker build \
          --build-arg WORKING_DIR=$WORKING_DIR \
          --build-arg GNUPGHOME=$GNUPGHOME \
          --build-arg CCACHE_DIR=$CCACHE_DIR \
          --build-arg USER=$USER \
          --build-arg UID=$(id -u) \
          --build-arg GID=$(id -g) \
          -f ./arch-run-cmd/Dockerfile \
          -t $IMAGE .
        
        echo "image_tag=${IMAGE_TAG%%:*}" >> $GITHUB_OUTPUT
        echo "image_version=${IMAGE_TAG##*:}" >> $GITHUB_OUTPUT
        echo "image=${IMAGE}" >> $GITHUB_OUTPUT
        echo "::notice::Docker image built successfully: $IMAGE_TAG"
