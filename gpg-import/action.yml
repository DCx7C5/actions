name: "Import GPG Keys"
description: "Smart dispatcher for importing GPG keys from various sources (secrets, files, or keyserver)"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"


inputs:
  gpg_key:
    required: true
    description: "GPG key (inline for 'secret', or file path for 'file', or fingerprint/identifier for 'keyserver')"
  gpg_pass:
    required: false
    default: ''
    description: "Passphrase/password for decryption (GPG or SSL)"
  ssl_pass:
    required: false
    default: ''
    description: "Passphrase for SSL decryption (if gpg_pass is not used for SSL-encrypted input)"
  keyserver_url:
    required: false
    default: 'hkps://keys.openpgp.org'
    description: "Keyserver URL to use for 'keyserver' method"
  delete_after_import:
    required: false
    default: 'true'
    description: "For 'file' method: securely delete private key file after import"
  method:
    required: false
    default: 'auto'
    description: "Import method to use (secret, file, keyserver)"
  gpg_home:
    required: false
    default: ''
    description: "Path to GPG Home Directory (optional, can also be set via GNUPGHOME env variable)"
  gpg_type:
    required: false
    default: 'auto'
    description: "Type of GPG key to import (auto, private, public) - auto-detects based on content or input method"
  configure_git:
    required: false
    default: 'true'
    description: "Whether to configure Git client to use imported GPG key for signing (only applies if a private key is imported)"
  setup_home:
    required: false
    default: 'true'
    description: "Whether to set up a temporary GPG home directory for the import process (recommended for better security and isolation)"
  preset_pass:
    required: false
    default: 'true'
    description: "Uses passphrase caching with gpg-agent for the import if set (provide a non-empty value to enable, e.g., 'true')"
  github_token:
    required: false
    default: ''
    description: "GitHub token for configuring Git client with GPG signing (optional, only needed if configure_git is true and authentication is required)"


outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key or keyserver import"
    value: ${{ steps.dispatch.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.dispatch.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.dispatch.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.dispatch.outputs.keys_secret }}
  gpg_home:
    description: "Path to the GPG home directory used for the import (if setup_home is true)"
    value: ${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}
  key_grips:
    description: "Keygrips of the imported GPG keys (if available)"
    value: ${{ steps.dispatch.outputs.key_grips || '' }}

runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      run: |
        if [ -n "${{ inputs.gpg_key }}" ]; then
          echo "::add-mask::${{ inputs.gpg_key }}"
        fi
        if [ -n '${{ inputs.gpg_pass }}' ]; then
          echo '::add-mask::${{ inputs.gpg_pass }}'
        fi
        if [ -n '${{ inputs.ssl_pass }}' ]; then
          echo '::add-mask::${{ inputs.ssl_pass }}'
        fi

    - name: Setup GPG Environment
      if: inputs.setup_home == 'true'
      id: gpg_setup
      uses: ./gpg-setup-home
      with:
        gpg_home: ${{ inputs.gpg_home }}

    - name: Validate GPG Key input
      id: validate
      uses: ./gpg-import/gpg-validate-import
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        gpg_key: ${{ inputs.gpg_key }}

    - name: Decrypt SSL-encrypted key (if applicable)
      id: decrypt_ssl
      if: steps.validate.outputs.is_ssl_enc_and_armored_key == 'true' || steps.validate.outputs.is_ssl_enc_binary_key == 'true'
      uses: ./ssl-decrypt
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        passphrase: ${{ inputs.ssl_pass || inputs.gpg_pass }}
        input_type: ${{ steps.validate.outputs.is_file == 'true' && 'file' || 'inline' }}
        input_encoding: ${{ steps.validate.outputs.is_ssl_enc_binary_key == 'true' && 'binary' || 'text' }}
        cleanup: 'true'
        in: ${{ steps.validate.outputs.gpg_key }}

    - name: Import from secret/variable/inline value
      id: inline_import
      if: steps.validate.outputs.is_secret == 'true'
      uses: ./gpg-import/gpg-import-inline
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        gpg_key: ${{ steps.decrypt_ssl.outputs.out || steps.validate.outputs.gpg_key }}
        pass: ${{ inputs.gpg_pass }}
        type: 'auto'

    - name: Import from file
      id: file_import
      if: steps.validate.outputs.is_file == 'true'
      uses: ./gpg-import/gpg-import-file
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        gpg_key: ${{ steps.decrypt_ssl.outputs.out || steps.validate.outputs.gpg_key }}
        pass: ${{ inputs.gpg_pass }}
        delete_after_import: ${{ inputs.delete_after_import }}

    - name: Import from keyserver
      id: keyserver_import
      if: steps.validate.outputs.is_fingerprint == 'true'
      uses: ./gpg-import/gpg-import-keyserver
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        key_id: ${{ steps.validate.outputs.gpg_key }}
        keyserver_url: ${{ inputs.keyserver_url }}

    - name: Aggregate outputs
      id: dispatch
      shell: bash
      run: |
        # Determine which import method was used and propagate its outputs
        # Try to get outputs from each import step (in order of priority)
        FP='${{ steps.inline_import.outputs.fingerprint || steps.file_import.outputs.fingerprint || steps.keyserver_import.outputs.fingerprint }}'
        PUB='${{ steps.inline_import.outputs.keys_public || steps.file_import.outputs.keys_public || steps.keyserver_import.outputs.keys_public }}'
        SEC='${{ steps.inline_import.outputs.keys_secret || steps.file_import.outputs.keys_secret || steps.keyserver_import.outputs.keys_secret }}'
        TOT='${{ steps.inline_import.outputs.keys_total || steps.file_import.outputs.keys_total || steps.keyserver_import.outputs.keys_total }}'
        GRPS='${{ steps.inline_import.outputs.key_grips || steps.file_import.outputs.key_grips || steps.keyserver_import.outputs.key_grips }}'
        echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
        echo "keys_public=$PUB" >> "$GITHUB_OUTPUT"
        echo "keys_secret=$SEC" >> "$GITHUB_OUTPUT"
        echo "keys_total=$TOT" >> "$GITHUB_OUTPUT"
        
        echo "key_grips<<<EOF"
        echo "$GRPS"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Set Owner Trust (if private key imported)
      if: (inputs.method != 'keyserver' && steps.validate.outputs.is_secretkey == 'true') && steps.validate.outputs.is_publickey == 'true'
      uses: ./gpg-set-ownertrust
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        fingerprint: ${{ steps.dispatch.outputs.fingerprint }}

    - name: Configure Git client to sign with GPG
      id: git_config
      if: inputs.configure_git == 'true'
      uses: ./git-configure-gnupg
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
        GH_TOKEN: ${{ inputs.github_token || env.GH_TOKEN }}

    - name: Preset passphrase with gpg-agent
      if: inputs.preset_pass == 'true' && (steps.validate.outputs.is_secretkey == 'true' || steps.validate.outputs.is_ssl_enc_key == 'true')
      uses: ./gpg-preset-pass
      env:
        GNUPGHOME: "${{ steps.gpg_setup.outputs.gpg_home || env.GNUPGHOME }}"
      with:
        pass: ${{ inputs.gpg_pass }}
        forget: 'false'