name: "Create & Push Signed Tag"
description: "Create a new annotated tag with GPG signature and push it to the repository"
author: "DCx7C5"

branding:
  icon: "git-commit"
  color: "orange"


inputs:
  version:
    description: "The new version to use (e.g. v1.2.3 or 1.2.3)"
    required: true
  commit_msg:
    description: "Commit message for the annotated tag"
    required: false
    default: "Release ${{ inputs.version }}"
  fingerprint:
    description: "GPG key fingerprint or email to use for signing the tag (optional)"
    required: false
    default: ""
  pass:
    description: "Passphrase for the GPG key (if needed, optional) - will be masked in logs"
    required: false
    default: ""
  sign:
    description: "Whether to sign the tag with GPG (default: true)"
    required: false
    default: 'true'
  gpg_home:
    description: "Path to GNUPGHOME directory (where keys are stored)"
    required: false
    default: ''

outputs:
  tag:
    description: "The created tag name"
    value: ${{ steps.tag_create_signed.outputs.tag || steps.tag_create_signed_pass.outputs.tag || steps.tag_create_unsigned.outputs.tag }}


runs:
  using: composite
  steps:
    - name: Mask & Validate inputs
      id: mask_and_validate
      shell: bash
      run: |
        set -euo pipefail
        if [ -n '${{ inputs.pass }}' ]; then
          echo '::add-mask::${{ inputs.pass }}'
        fi
        
        VERSION='${{ inputs.version }}'
        if [ -z "$VERSION" ]; then
          echo "::error::version input is required" >&2
          exit 1
        fi
        
        echo "::notice::Target tag: $VERSION"

    - name: Create unsigned tag
      id: tag_create_unsigned
      if: inputs.sign == 'false'
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        TAG: '${{ inputs.version }}'
        COMMIT_MSG: '${{ inputs.commit_msg }}'
      run: |
        set -euo pipefail
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi
        
        echo "::notice::Creating unsigned tag: $TAG"
        
        TAG_ARGS=(-l "$TAG")
        
        if [ -n "$COMMIT_MSG" ]; then
          TAG_ARGS+=(-m "$COMMIT_MSG")
        fi
        
        if GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" --no-edit 2>&1; then
          echo "::notice::Unsigned tag created successfully: $TAG"
        else
          echo "::error::Failed to create unsigned tag" >&2
          exit 1
        fi
        
        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true
        
        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    
    - name: Create signed tag (no passphrase)
      id: tag_create_signed
      if: inputs.sign == 'true' && inputs.pass == ''
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        TAG: '${{ inputs.version }}'
        FINGERPRINT: '${{ inputs.fingerprint }}'
        COMMIT_MSG: '${{ inputs.commit_msg }}'
      run: |
        set -euo pipefail
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi
        
        echo "::notice::Creating signed tag: $TAG"
        
        # Build git tag command
        TAG_ARGS=(-a "$TAG")
        
        if [ -n "$COMMIT_MSG" ]; then
          TAG_ARGS+=(-m "$COMMIT_MSG")
        fi
        
        if [ -n "$FINGERPRINT" ]; then
          TAG_ARGS+=(-u "$FINGERPRINT")
          echo "::notice::Using explicit key: $FINGERPRINT"
        else
          echo "::notice::Using default GPG key"
        fi
        
        # Create signed tag
        if GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" -s --no-edit 2>&1; then
          echo "::notice::Signed tag created successfully: $TAG"
        else
          echo "::error::Failed to create signed tag" >&2
          exit 1
        fi
        
        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true
        
        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Create signed tag (with passphrase)
      id: tag_create_signed_pass
      if: inputs.sign == 'true' && inputs.pass != ''
      shell: bash
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
        TAG: '${{ inputs.version }}'
        FINGERPRINT: '${{ inputs.fingerprint }}'
        COMMIT_MSG: '${{ inputs.commit_msg }}'
        PASS: '${{ inputs.pass }}'
      run: |
        set -euo pipefail

        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists" >&2
          exit 1
        fi

        echo "::notice::Creating signed tag with passphrase: $TAG"

        if [ -z "$PASS" ]; then
          echo "::error::Missing passphrase for protected key" >&2
          exit 1
        fi

        # Build git tag command
        TAG_ARGS=(-a "$TAG")

        if [ -n "${{ inputs.commit_msg }}" ]; then
          TAG_ARGS+=(-m "${{ inputs.commit_msg }}")
        fi

        if [ -n "$FINGERPRINT" ]; then
          TAG_ARGS+=(-u "$FINGERPRINT")
          echo "::notice::Using explicit key: $FINGERPRINT"
        else
          echo "::notice::Using default GPG key"
        fi

        unset GPG_TTY || true

        # Create signed tag - passphrase via stdin to gpg wrapper (--passphrase-fd 0)
        if printf '%s' "$PASS" | GIT_COMMITTER_DATE="$(git log -n1 --pretty=%aD)" git tag "${TAG_ARGS[@]}" -s --no-edit 2>&1; then
          echo "::notice::Signed tag created successfully: $TAG"
        else
          echo "::error::Failed to create signed tag" >&2
          exit 1
        fi

        # Show tag details
        git show --pretty=fuller "$TAG" 2>/dev/null || true

        # Output
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"


    - name: Push tag to repository
      shell: bash
      env:
        TAG: '${{ steps.tag_create_signed.outputs.tag || steps.tag_create_signed_pass.outputs.tag || steps.tag_create_unsigned.outputs.tag }}'
      run: |
        set -euo pipefail
        
        if ! git push origin "$TAG"; then
          echo "::error::Failed to push tag to repository" >&2
          exit 1
        fi
        echo "::notice::Successfully pushed tag '$TAG' to repository"

