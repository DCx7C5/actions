name: "Get remote package changes from AUR"
description: "Get the list of changed package files between the current branch and the AUR repository, and optionally output a matrix of changes for GitHub Actions"
author: "DCx7C5"

branding:
  icon: git-branch
  color: blue

inputs:
  remote-name:
    required: false
    description: "Name of the remote to add for the AUR repository (default: upstream)"
    default: "upstream"
  remote-ref:
    required: false
    description: "Git reference to compare against (default: main)"
    default: "main"
  include-only:
    required: false
    description: "New-line separated list of paths to include in comparison (default: all)"
    default: "false"
  exclude-paths:
    required: false
    description: "New-line separated list of paths to exclude from all comparisons (default: none)"
    default: ""
  exclude-paths-delete:
    required: false
    description: "New-line separated list of paths to exclude from comparison (default: none)"
    default: ""
  exclude-path-new:
    required: false
    description: "New-line separated list of paths to exclude from new/changed comparison (default: none)"
    default: ""
  exclude-paths-changed:
    required: false
    description: "New-line separated list of paths to exclude from changed comparison (default: none)"
    default: ""


outputs:
  has_updates:
    description: "Whether any new or changed package directories were detected"
    value: ${{ steps.get_new.outputs.new_dirs != '' || steps.get_changes.outputs.changed_dirs != '' }}
  has_new:
    description: "Whether any new package directories were detected"
    value: ${{ steps.get_new.outputs.new_dirs != '' }}
  has_changed:
    description: "Whether any changed package directories were detected"
    value: ${{ steps.get_changes.outputs.changed_dirs != '' }}
  has_removed:
    description: "Whether any removed package directories were detected"
    value: ${{ steps.get_removed.outputs.removed_dirs != '' }}
  new_dirs:
    description: "New package directories (exist in compare but not in base)"
    value: ${{ steps.get_new.outputs.new_dirs }}
  new_dirs_matrix:
    description: "JSON matrix for new package directories in GitHub Actions include format"
    value: ${{ steps.get_new.outputs.new_dirs_matrix }}
  changed_dirs:
    description: "Changed package directories (PKGBUILD differs between branches)"
    value: ${{ steps.get_changes.outputs.changed_dirs }}
  changed_dirs_matrix:
    description: "JSON matrix for changed package directories in GitHub Actions include format"
    value: ${{ steps.get_changes.outputs.changed_dirs_matrix }}
  removed_dirs:
    description: "Removed package directories (exist in base but not in compare)"
    value: ${{ steps.get_removed.outputs.removed_dirs }}
  removed_dirs_matrix:
    description: "JSON matrix for removed package directories in GitHub Actions include format"
    value: ${{ steps.get_removed.outputs.removed_dirs_matrix }}
  combined_matrix:
    description: "JSON matrix for new and changed package directories combined in GitHub Actions include format"
    value: ${{ steps.get_changes.outputs.combined_matrix }}
  count_combined:
    description: "Count of new and changed package directories combined"
    value: ${{ steps.get_changes.outputs.count_combined }}
  count_removed:
    description: "Count of removed package directories"
    value: ${{ steps.get_removed.outputs.count_removed }}

runs:
  using: composite
  steps:
    - name: Get removed package directories
      id: get_removed
      shell: bash
      run: |
        set -euo pipefail
        
        exclude_args=()
        # Globale Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths }}"
        # Schritt-spezifische Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths-delete }}"

        include_args=()
        if [[ "${{ inputs.include-only }}" != "false" && -n "${{ inputs.include-only }}" ]]; then
          while IFS= read -r p || [[ -n "$p" ]]; do
            p="${p#"${p%%[![:space:]]*}"}"
            p="${p%"${p##*[![:space:]]}"}"
            [[ -z "$p" ]] && continue
            include_args+=("$p")
          done <<< "${{ inputs.include-only }}"
        else
          include_args=(.)
        fi
        
        removed_files=$(git diff --no-renames --name-only --diff-filter=D HEAD "${{ inputs.remote-name }}/${{ inputs.remote-ref }}" -- "${include_args[@]}" "${exclude_args[@]}")
        removed_dirs=$(printf '%s\n' "$removed_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)
        
        {
          echo "removed_dirs<<EOF"
          echo "$removed_dirs"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        removed_dirs_matrix=$(jq -Rn --arg dirs "$removed_dirs" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "removed_dirs_matrix=$removed_dirs_matrix" >> "$GITHUB_OUTPUT"
        count_removed=$(printf '%s\n' "$removed_dirs" | awk 'NF > 0' | wc -l)
        echo "count_removed=$count_removed" >> "$GITHUB_OUTPUT"

    - name: Get new package directories
      id: get_new
      shell: bash
      run: |
        set -euo pipefail
        
        exclude_args=()
        # Globale Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths }}"
        # Schritt-spezifische Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths-new }}"

        include_args=()
        if [[ "${{ inputs.include-only }}" != "false" && -n "${{ inputs.include-only }}" ]]; then
          while IFS= read -r p || [[ -n "$p" ]]; do
            p="${p#"${p%%[![:space:]]*}"}"
            p="${p%"${p##*[![:space:]]}"}"
            [[ -z "$p" ]] && continue
            include_args+=("$p")
          done <<< "${{ inputs.include-only }}"
        else
          include_args=(.)
        fi
        
        new_files=$(git diff --no-renames --name-only --diff-filter=A HEAD "${{ inputs.remote-name }}/${{ inputs.remote-ref }}" -- "${include_args[@]}" "${exclude_args[@]}")
        new_dirs=$(printf '%s\n' "$new_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)
        
        # Save new directories to output variable
        {
          echo "new_dirs<<EOF"
          echo "$new_dirs"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        new_dirs_matrix=$(jq -Rn --arg dirs "$new_dirs" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "new_dirs_matrix=$new_dirs_matrix" >> "$GITHUB_OUTPUT"

    - name: Get changed package directories
      id: get_changes
      shell: bash
      run: |
        set -euo pipefail

        exclude_args=()
        # Globale Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths }}"
        # Schritt-spezifische Excludes
        while IFS= read -r p || [[ -n "$p" ]]; do
          p="${p#"${p%%[![:space:]]*}"}"
          p="${p%"${p##*[![:space:]]}"}"
          [[ -z "$p" ]] && continue
          exclude_args+=(":(exclude)$p")
        done <<< "${{ inputs.exclude-paths-changed }}"

        include_args=()
        if [[ "${{ inputs.include-only }}" != "false" && -n "${{ inputs.include-only }}" ]]; then
          while IFS= read -r p || [[ -n "$p" ]]; do
            p="${p#"${p%%[![:space:]]*}"}"
            p="${p%"${p##*[![:space:]]}"}"
            [[ -z "$p" ]] && continue
            include_args+=("$p")
          done <<< "${{ inputs.include-only }}"
        else
          include_args=(.)
        fi

        changed_pkgbuild_files=$(git diff --no-renames --name-only --diff-filter=M HEAD "${{ inputs.remote-name }}/${{ inputs.remote-ref }}" -- "${include_args[@]}" "${exclude_args[@]}")
        changed_dirs=$(printf '%s\n' "$changed_pkgbuild_files" | awk '/PKGBUILD$/ { sub(/\/PKGBUILD$/, "", $0); print }' | sort -u)

        if [[ -f "$GITHUB_OUTPUT" ]]; then
          new_dirs=$(awk '/^new_dirs<<EOF$/{flag=1;next}/^EOF$/{flag=0}flag' "$GITHUB_OUTPUT" | sort -u)
        else
          new_dirs=""
        fi

        changed_dirs_filtered=$(comm -23 <(printf '%s\n' "$changed_dirs" | sort -u) <(printf '%s\n' "$new_dirs" | sort -u))

        {
          echo "changed_dirs<<EOF"
          echo "$changed_dirs_filtered"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        changed_dirs_matrix=$(jq -Rn --arg dirs "$changed_dirs_filtered" '{include: ($dirs | split("\n") | map(select(length > 0)) | map({dir: .}))}')
        echo "changed_dirs_matrix=$changed_dirs_matrix" >> "$GITHUB_OUTPUT"
        
        # Kombiniere new_dirs (add) und changed_dirs_filtered (update) für eine kombinierte Matrix
        combined_matrix=$(jq -n --arg new_dirs "$new_dirs" --arg changed_dirs "$changed_dirs_filtered" '
          {include: (
            ($new_dirs | split("\n") | map(select(length > 0)) | map({dir: ., sync_type: "add"})) +
            ($changed_dirs | split("\n") | map(select(length > 0)) | map({dir: ., sync_type: "update"}))
          )}
        ')
        echo "combined_matrix=$combined_matrix" >> "$GITHUB_OUTPUT"
        
        count_combined_matrix=$(jq -r '.include | length' <<< "$combined_matrix")
        echo "count_combined=$count_combined" >> "$GITHUB_OUTPUT"
