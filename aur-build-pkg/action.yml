name: "Build AUR Package"
description: "Build an AUR package using a secure Arch Linux container with GPG and ccache support"
author: "DCx7C5"


inputs:
  pkg-name:
    required: true
    description: "Name of the package to build (should match the directory name containing the PKGBUILD)"
  gpg-sign:
    required: false
    default: 'false'
    description: "Whether to sign the package with GPG (default: false)"
  gpg-key-id:
    required: false
    default: ''
    description: "GPG key ID or fingerprint to use for signing (if needed)"
  gpg-pass:
    required: false
    default: ''
    description: "Passphrase for GPG key (if needed)"
  gpg-home:
    required: false
    default: ''
    description: "Path to GPG home directory (optional, defaults to GNUPGHOME environment variable)"
  gh-token:
    required: false
    default: ''
    description: "GitHub token for API access (defaults to github.token)"


runs:
  using: composite
  steps:
    - id: build_pkg
      uses: DCx7C5/actions/arch-run-cmd@v1
      with:
        gpg-passphrase: ${{ inputs.gpg-pass }}
        run-with-sudo: 'true'
        enable-ccache: 'true'
        gpg-home: ${{ inputs.gpg-home || env.GNUPGHOME }}
        gh-token: ${{ inputs.gh-token || env.GH_TOKEN || github.token }}
        gpg-key-id: ${{ inputs.gpg-key-id }}
        command: |
          set -euo pipefail

          PKG_NAME="${{ inputs.pkg-name }}"
          GPG_SIGN="${{ inputs.gpg-sign }}"
          GPG_KEY_ID="${{ inputs.gpg-key-id }}"
          GPG_PASSPHRASE="${{ inputs.gpg-pass }}"

          if [[ ! -d "$PKG_NAME" ]]; then
            echo "::error::Package directory '$PKG_NAME' not found." >&2
            exit 1
          fi

          cd "$PKG_NAME"

          if [[ "$GPG_SIGN" =~ ^true$ && -n "$GPG_KEY_ID" ]]; then
            if [[ -n "$GPG_PASSPHRASE" ]]; then
              echo "::notice::GPG signing is enabled with key ID and passphrase"
            else
              echo "::notice::GPG signing is enabled with key ID (no passphrase provided)"
            fi
            makepkg -sr --sign -C -c --noconfirm --noprogressbar
          else
            echo "::notice::GPG signing is disabled (requires gpg_sign=true and non-empty gpg_key_id)"
            makepkg -sr -C -c --noconfirm --noprogressbar
          fi
          
          echo "::notice::Package build completed successfully"

