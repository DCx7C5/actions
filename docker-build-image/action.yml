name: "Build Arch Linux Docker Image"
description: "Build the Arch Linux Docker image used for AUR builds"
author: "DCx7C5"

inputs:
  image-tag:
    description: "Docker image tag to build"
    required: true
    default: ''
  image-version:
    description: "Docker image version tag (defaults to 'latest')"
    required: true
    default: ''
  dockerfile-path:
    description: "Path to the Dockerfile to use for building the image"
    required: true
    default: '.'
  image-working-directory:
    description: "Working directory inside container"
    required: false
    default: ''
  runtime-working-directory:
    description: "Working directory for the build context (defaults to github.workspace)"
    required: false
    default: ''
  gpg-home:
    description: "GPG home directory (usually in workspace)"
    required: false
    default: ''
  ccache-dir:
    description: "ccache directory for build caching"
    required: false
    default: ''
  user:
    description: "User name to create inside the container (defaults to runner.user)"
    required: false
    default: ''
  group:
    description: "Group name to create inside the container (defaults to runner.group)"
    required: false
    default: ''
  uid:
    description: "User ID to use inside the container (defaults to current user ID)"
    required: false
    default: ''
  gid:
    description: "Group ID to use inside the container (defaults to current group ID)"
    required: false
    default: ''
  gpg-key:
    description: "GPG private key to import into the container (if needed, should be provided as a secret and passed via environment variable)"
    required: false
    default: ''
  gh-token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
    default: ''
  build-args:
    description: "New-line separated list of additional build arguments to pass to 'docker build' (optional)"
    required: false
    default: ''

outputs:
  image:
    description: "The Docker image tag that was built"
    value: "${{ steps.build_image.outputs.image }}"
  image-tag:
    description: "The Docker image tag (without version) that was built"
    value: ${{ inputs.image-tag }}
  image-version:
    description: "The Docker image version tag that was built"
    value: ${{ inputs.image-version }}

runs:
  using: composite
  steps:
    - id: build_image
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.gh-token || env.GH_TOKEN || github.token }}"
        USER: "${{ inputs.user || env.USER || runner.user }}"
        GROUP: "${{ inputs.group || env.GROUP || runner.group }}"
        UID: "${{ inputs.uid || env.UID || '1000' }}"
        GID: "${{ inputs.gid || env.GID || '1000' }}"
        GNUPGHOME: "${{ inputs.gpg-home || env.GNUPGHOME || format('{0}/.gnupg', github.workspace) }}"
        IMAGE_WORKING_DIR: "${{ inputs.image-working-directory || env.IMAGE_WORKING_DIR || format('{0}/arch-run-cmd', github.workspace) }}"
        WORKING_DIR: "${{ inputs.runtime-working-directory || env.RUNTIME_WORKING_DIR || github.workspace || '.' }}"
        RUNTIME_WORKING_DIR: "${{ inputs.runtime-working-directory || env.RUNTIME_WORKING_DIR || github.workspace || '.' }}"
        DOCKERFILE: "${{ inputs.dockerfile-path || format('{0}/Dockerfile', inputs.image-working-directory || env.IMAGE_WORKING_DIR) }}"
        CCACHE_DIR: "${{ inputs.ccache-dir || env.CCACHE_DIR || format('{0}/.ccache', github.workspace) }}"
      working-directory: "${{ inputs.image-working-directory || env.IMAGE_WORKING_DIR }}"
      run: |
        set -euo pipefail
        
        [[ "$(pwd)" != "$IMAGE_WORKING_DIR" ]] && cd "$IMAGE_WORKING_DIR"
        
        DOCKER_BUILD_ARGS=()
        [[ -n $RUNTIME_WORKING_DIR ]] && DOCKER_BUILD_ARGS+=(--build-arg "WORKING_DIR=$RUNTIME_WORKING_DIR")
        [[ -n $GNUPGHOME ]] && DOCKER_BUILD_ARGS+=(--build-arg "GNUPGHOME=$GNUPGHOME")
        [[ -n $CCACHE_DIR ]] && DOCKER_BUILD_ARGS+=(--build-arg "CCACHE_DIR=$CCACHE_DIR")
        [[ -n "${{ inputs.user }}" ]] && DOCKER_BUILD_ARGS+=(--build-arg "USER=${{ inputs.user }}")
        [[ -n "${{ inputs.group }}" ]] && DOCKER_BUILD_ARGS+=(--build-arg "GROUP=${{ inputs.group }}")
        [[ -n "${{ inputs.uid }}" ]] && DOCKER_BUILD_ARGS+=(--build-arg "UID=${{ inputs.uid }}")
        [[ -n "${{ inputs.gid }}" ]] && DOCKER_BUILD_ARGS+=(--build-arg "GID=${{ inputs.gid }}")
        [[ -n "${{ inputs.gpg-key }}" ]] && DOCKER_BUILD_ARGS+=(--build-arg "GPG_KEY=${{ inputs.gpg-key }}")
        
        if [[ -n "${{ inputs.build-args }}" ]]; then
          while IFS= read -r arg; do
            if [[ -n "$arg" && "$arg" =~ ^[A-Za-z_][A-Za-z0-9_]*=.+$ ]]; then
              DOCKER_BUILD_ARGS+=(--build-arg "$arg")
            fi
          done <<< "${{ inputs.build-args }}"
        fi
        IMAGE_NAME="${{ inputs.image-tag }}:${{ inputs.image-version }}"
        echo "::notice::Building Arch Linux Docker image for AUR builds..."
        docker build "${DOCKER_BUILD_ARGS[@]}" \
          -f "$DOCKERFILE" \
          -t "$IMAGE_NAME" .
        
        cd "${{ github.workspace }}" || true
        echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
        echo "::notice::Docker image built successfully: $IMAGE_NAME"
