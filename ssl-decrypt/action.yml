name: "SSL Decrypt file or inline value"
description: "Decrypts SSL/OpenSSL encrypted file or value using provided password, with detection and security hardening for secrets"
author: "DCx7C5"


inputs:
  enc_input:
    required: true
    description: "SSL/OpenSSL encrypted file path or inline variable to decrypt"
  passphrase:
    required: true
    description: "Password for SSL/OpenSSL decryption"
  salt:
    required: false
    default: ''
    description: "Optional salt value for decryption (if not provided, will attempt decryption without salt)"
  input_type:
    required: false
    default: 'auto'
    description: "Input type: 'auto' (detect based on input), 'file' (treat enc_input as file path), or 'inline' (treat enc_input as inline variable)"
  input_encoding:
    required: false
    default: 'auto'
    description: "Input encoding: 'auto' (detect based on input), 'binary' (raw bytes), 'base64' (base64-codiert), 'text' (UTF-8-String), oder 'raw' (UTF-8-String, synonym zu text)"
  output_encoding:
    required: false
    default: 'base64'
    description: "Output encoding: 'base64' (base64-encoded) or 'raw' (always UTF-8-String)."
  cleanup:
    required: false
    default: 'true'
    description: "Whether to securely delete the input file after decryption (only applies if type is 'file')"


outputs:
  type:
    description: "Detected input type: 'file' or 'inline'"
    value: ${{ steps.parse_type.outputs.type || inputs.input_type }}
  encoding:
    description: "Detected output format: 'binary' or 'text'"
    value: ${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}
  decrypted_content:
    description: "The decrypted content (binary, base64 string, raw string, or file path depending on inputs and detection)"
    value: ${{ steps.decrypt_ssl_file.outputs.decrypted_content || steps.decrypt_ssl_value.outputs.decrypted_content }}


runs:
  using: composite
  steps:
    - name: Mask password input
      id: mask_input
      shell: bash
      run: |
        if [ -n '${{ inputs.enc_input }}' ]; then
          echo "::add-mask::${{ inputs.enc_input }}"
        fi
        if [ -n '${{ inputs.passphrase }}' ]; then
          echo "::add-mask::${{ inputs.passphrase }}"
        fi
        if [ -n '${{ inputs.salt }}' ]; then
          echo "::add-mask::${{ inputs.salt }}"
        fi

        if [[ -z '${{ inputs.enc_input }}' || -z '${{ inputs.passphrase }}' ]]; then
          echo "::error::'enc_input' cannot be empty." >&2
          exit 1
        fi
        if [[ "${{ inputs.input_type }}" != "auto" && "${{ inputs.input_type }}" != "file" && "${{ inputs.input_type }}" != "inline" && "${{ inputs.input_type }}" != "secret" && "${{ inputs.input_type }}" != "value" && "${{ inputs.input_type }}" != "variable" ]]; then
          echo "::error::Invalid 'type' input: '${{ inputs.input_type }}'. Must be 'auto', 'file', 'inline', 'secret', 'value', or 'variable'." >&2
          exit 1
        elif [[ "${{ inputs.input_encoding }}" != "auto" && "${{ inputs.input_encoding }}" != "binary" && "${{ inputs.input_encoding }}" != "text" && "${{ inputs.input_encoding }}" != "base64" && "${{ inputs.input_encoding }}" != "raw" ]]; then
          echo "::error::Invalid 'format' input: '${{ inputs.input_encoding }}'. Must be 'auto', 'binary', 'text', 'base64', or 'raw'." >&2
          exit 1
        fi
        if [[ "${{ inputs.output_encoding }}" != "base64" && "${{ inputs.output_encoding }}" != "raw" ]]; then
          echo "::error::Invalid 'output_encoding' input: '${{ inputs.output_encoding }}'. Must be 'base64' or 'raw'." >&2
          exit 1
        fi
        if [[ "${{ inputs.input_type }}" == "auto" && -z "${{ inputs.enc_input }}" ]]; then
          echo "::error::'enc_input' cannot be empty when 'type' is set to 'auto'." >&2
          exit 1
        fi

    - name: Parse Type
      id: parse_type
      if: inputs.input_type == 'auto'
      shell: bash
      run: |
        if [[ -n "${{ inputs.enc_input }}" && -f "${{ inputs.enc_input }}" ]]; then
          echo "type=file" >> "$GITHUB_OUTPUT"
        elif [[ -n "${{ inputs.enc_input }}" ]]; then
          echo "type=inline" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Unable to determine input type from 'enc_input'. Please specify 'type' explicitly." >&2
          exit 1
        fi

    - name: Parse Encoding
      id: parse_encoding
      if: inputs.input_encoding == 'auto'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
      run: |
        if [[ "$INPUT_TYPE" == "file" && -f "${{ inputs.enc_input }}" ]]; then
          if grep -qP "[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]" "${{ inputs.enc_input }}"; then
            echo "encoding=binary" >> "$GITHUB_OUTPUT"
          elif grep -qP "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$" "${{ inputs.enc_input }}"; then
            echo "encoding=base64" >> "$GITHUB_OUTPUT"
          else
            echo "encoding=text" >> "$GITHUB_OUTPUT"
          fi
        elif [[ "$INPUT_TYPE" =~ ^(inline|secret|value|variable)$ ]]; then
          if grep -qP "[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]" <<< "${{ inputs.enc_input }}"; then
            echo "encoding=binary" >> "$GITHUB_OUTPUT"
          elif grep -qP "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$" "${{ inputs.enc_input }}"; then
            echo "encoding=base64" >> "$GITHUB_OUTPUT"
          else
            echo "encoding=text" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "::error::Unable to determine encoding for input. Please specify 'encoding' explicitly." >&2
          exit 1
        fi

    - name: Decrypt SSL encrypted value
      id: decrypt_ssl_value
      if: steps.parse_type.outputs.type != 'file'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
        INPUT_ENCODING: "${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}"
        OUTPUT_ENCODING: "${{ inputs.output_encoding }}"
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.salt }}" ]; then
          SALT_ARG=(-salt -S "${{ inputs.salt }}")
        else
          SALT_ARG=()
        fi
        if [ -z "${{ inputs.enc_input }}" ]; then
          echo "::error::enc_input is empty. Cannot decrypt." >&2
          exit 1
        fi
        if [[ "$OUTPUT_ENCODING" == "base64" ]]; then
          if [[ "$INPUT_ENCODING" == "base64" ]]; then
            if ! decrypted_content=$(printf '%s' "${{ inputs.enc_input }}" | base64 -d 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null | base64 -w0); then
              echo "::error::Decryption failed (base64 input)." >&2
              exit 1
            fi
          else
            if ! decrypted_content=$(printf '%s' "${{ inputs.enc_input }}" | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null | base64 -w0); then
              echo "::error::Decryption failed." >&2
              exit 1
            fi
          fi
        elif [[ "$OUTPUT_ENCODING" == "raw" ]]; then
          if [[ "$INPUT_ENCODING" == "base64" ]]; then
            if ! decrypted_content=$(printf '%s' "${{ inputs.enc_input }}" | base64 -d 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null); then
              echo "::error::Decryption failed (base64 input)." >&2
              exit 1
            fi
          else
            if ! decrypted_content=$(printf '%s' "${{ inputs.enc_input }}" | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null); then
              echo "::error::Decryption failed." >&2
              exit 1
            fi
          fi
        fi
        delim="__GHA_DELIM_$(date +%s%N)__"
        {
          echo "decrypted_content<<$delim"
          printf '%s\n' "$decrypted_content"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Decryption successful for inline input"

    - name: Decrypt SSL encrypted file
      id: decrypt_ssl_file
      if: steps.parse_type.outputs.type == 'file'
      shell: bash
      env:
        INPUT_TYPE: "${{ steps.parse_type.outputs.type || inputs.input_type }}"
        INPUT_ENCODING: "${{ steps.parse_encoding.outputs.encoding || inputs.input_encoding }}"
        OUTPUT_ENCODING: "${{ inputs.output_encoding }}"
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.salt }}" ]; then
          SALT_ARG=(-salt -S "${{ inputs.salt }}")
        else
          SALT_ARG=()
        fi
        if [ ! -f "${{ inputs.enc_input }}" ]; then
          echo "::error::enc_input file not found: '${{ inputs.enc_input }}'" >&2
          exit 1
        fi
        if [ "$OUTPUT_ENCODING" = "base64" ]; then
          if [ "$INPUT_ENCODING" = "base64" ]; then
            if ! decrypted_content=$(base64 -d < "${{ inputs.enc_input }}" 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null | base64 -w0); then
              echo "::error::Decryption failed (base64 input file)." >&2
              exit 1
            fi
          else
            if ! decrypted_content=$(openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -in "${{ inputs.enc_input }}" -pass pass:"${{ inputs.passphrase }}" 2>/dev/null | base64 -w0); then
              echo "::error::Decryption failed." >&2
              exit 1
            fi
          fi
        elif [ "$OUTPUT_ENCODING" = "raw" ]; then
          if [ "$INPUT_ENCODING" = "base64" ]; then
            if ! decrypted_content=$(base64 -d < "${{ inputs.enc_input }}" 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -pass pass:"${{ inputs.passphrase }}" 2>/dev/null); then
              echo "::error::Decryption failed (base64 input file)." >&2
              exit 1
            fi
          else
            if ! decrypted_content=$(openssl enc -aes-256-cbc -pbkdf2 "${SALT_ARG[@]}" -d -in "${{ inputs.enc_input }}" -pass pass:"${{ inputs.passphrase }}" 2>/dev/null); then
              echo "::error::Decryption failed." >&2
              exit 1
            fi
          fi
        fi
        delim="__GHA_DELIM_$(date +%s%N)__"
        {
          echo "decrypted_content<<$delim"
          printf '%s\n' "$decrypted_content"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Decryption successful for file input: ${{ inputs.enc_input }}"

    - name: Cleanup
      if: always() && steps.parse_type.outputs.type == 'file' && inputs.cleanup == 'true'
      shell: bash
      run: |
        set +e
        
        input_file="${{ inputs.enc_input }}"
        
        if [[ -f "$input_file" ]]; then
          if command -v shred &> /dev/null; then
            if shred -vfz -n 10 "$input_file" 2>/dev/null; then
              echo "::notice::Securely deleted encrypted input file: $input_file"
            else
              echo "::warning::shred failed, attempting standard removal of: $input_file"
              rm -f "$input_file" 2>/dev/null || {
                echo "::warning::Failed to delete encrypted input file: $input_file"
                exit 1
              }
            fi
          else
            if rm -f "$input_file" 2>/dev/null; then
              echo "::notice::Deleted encrypted input file: $input_file"
            else
              echo "::warning::Failed to delete encrypted input file: $input_file"
              exit 1
            fi
          fi
        else
          echo "::notice::Input file not found or already removed: $input_file"
        fi
        
        unset PASSPHRASE 2>/dev/null || true
        unset SALT_ARG 2>/dev/null || true
        
        echo "::notice::Cleanup completed"
