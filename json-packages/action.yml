name: "Manage packages.json file"
description: "Action to manage the packages.json file in the repository, allowing for adding, updating, and removing package entries"
author: "DCx7C5"

branding:
  icon: "package"
  color: "blue"


inputs:
  path:
    required: false
    default: '${{ github.workspace }}/.ci/packages.json'
    description: "Path to the packages.json file to manage (default: 'packages.json')"
  action:
    required: false
    default: 'get'
    description: "Action to perform on the packages.json file (e.g.,'get', 'add', 'update', 'remove')"
  pkg_name:
    required: false
    default: ''
    description: "Name of the package to manage in the packages.json file"
  key:
    required: false
    default: ''
    description: "Key to add or update in the package entry (format: 'key=value')"
  value:
    required: false
    default: ''
    description: "Value to set for the specified key when adding or updating a package entry"
  variable_type:
    required: false
    default: 'repo'
    description: "Type of GitHub Variable to store updated JSON in (repo, env or org)"
  variable_name:
    required: false
    default: 'JSON_PACKAGES'
    description: "Name of GitHub Variable to store updated JSON in"
  steps_out:
    required: false
    default: 'false'
    description: "Whether to set step output (true/false, default: false)"
  github_token:
    required: false
    default: ''
    description: "GitHub Token with permissions to manage variables (usually GITHUB_TOKEN)"


outputs:
  packages:
    description: "List of all package names in the packages.json file (only for 'get' action without pkg_name)"
    value: ${{ steps.get_all_packages.outputs.packages }}
  remote:
    description: "Remote repository URL for the specified package (only for 'get' action with pkg_name)"
    value: ${{ steps.get_pkg_value.outputs.remote }}
  custom:
    description: "Custom flag value for the specified package (only for 'get' action with pkg_name)"
    value: ${{ steps.get_pkg_value.outputs.custom }}
  remote_type:
    description: "Remote type (e.g., 'PKG', 'GIT') for the specified package (only for 'get' action with pkg_name)"
    value: ${{ steps.get_pkg_value.outputs.refactor }}


runs:
  using: composite
  steps:
    - id: validate_inputs
      shell: bash
      env:
        ACTION: "${{ inputs.action }}"
        PKG_NAME: "${{ inputs.pkg_name }}"
        JSON_PATH: "${{ inputs.path }}"
      run: |
        set -euo pipefail

        valid_actions=("get" "add" "update" "remove")

        if [[ ! " ${valid_actions[*]} " =~ " ${ACTION} " ]]; then
          echo "::error::Invalid action '${ACTION}'. Valid actions are: ${valid_actions[*]}" >&2
          exit 1
        fi

        if [[ ! -f "$JSON_PATH" ]]; then
          echo "::error::File '$JSON_PATH' does not exist." >&2
          exit 1
        fi

        if [[ -n "${{ inputs.key }}" && -z "${{ inputs.value }}" && ! "$ACTION" =~ '^remove|get$' ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -z "${{ inputs.key }}" && -n "${{ inputs.value }}" ]]; then
          echo "::error::Both 'key' and 'value' inputs must be provided together for add/update actions." >&2
          exit 1
        elif [[ -n "${{ inputs.key }}" && -n "${{ inputs.value }}" && ! "$ACTION" =~ ^add|update$ ]]; then
          echo "::error::'key' and 'value' inputs are only valid for 'add' and 'update' actions." >&2
          exit 1
        fi
        
        if [[ -n "$JSON_PATH" && -f "$JSON_PATH" ]]; then
          echo "inline_json=false" >> "$GITHUB_OUTPUT"
        elif [[ -n "$JSON_PATH" && ! -f "$JSON_PATH" && ]]; then
          echo "inline_json=true" >> "$GITHUB_OUTPUT"
          if [[ -z "${{ vars.JSON_PACKAGES }}" && -z "${{ vars[format('{0}', inputs.variable_name)] }}" ]]; then
            echo "::error::'path' input is set to a non-file value, but 'JSON_PACKAGES' variable is not set. \
            Please provide valid JSON input via the 'JSON_PACKAGES' variable or point 'path' to a valid file." >&2
            exit 1
          fi
        else
          echo "::error::'path' input is required and must point to a valid file." >&2
          exit 1
        fi

    - name: Get all package names
      id: get_all_packages
      if: inputs.action == 'get' && inputs.pkg_name == ''
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
      run: |
        set -euo pipefail
        echo "::notice::Contents of '$JSON_PATH':"
        {
          echo "packages<<EOF"
          [[ -f "$JSON_PATH" ]] && jq -r 'to_entries[] | .key' "$JSON_PATH"
          [[ ! -f "$JSON_PATH" ]] && jq -r 'to_entries[] | .key' <<< "$JSON_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Get package values
      id: get_pkg_value
      if: inputs.pkg_name != ''
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        PKG_NAME: "${{ inputs.pkg_name }}"
      run: |
        set -euo pipefail

        if [[ -f "$JSON_PATH" ]]; then
          pkg=$(jq --arg pkg "$PKG_NAME" '.[$pkg] // empty' "$JSON_PATH")
        else
          pkg=$(jq --arg pkg "$PKG_NAME" '.[$pkg] // empty' <<< "$JSON_PATH")
        fi

        echo "remote=$(jq -r '.remote // empty' <<< "$pkg")" >> "$GITHUB_OUTPUT"
        echo "custom=$(jq -r '.custom // empty' <<< "$pkg")" >> "$GITHUB_OUTPUT"
        echo "remote_type=$(jq -r '.remote_type // empty' <<< "$pkg")" >> "$GITHUB_OUTPUT"

    - name: Add package entry if not exists
      id: add_pkg
      if: inputs.action == 'add' && inputs.pkg_name != '' && (inputs.key != '' || inputs.value != '')
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        PKG_NAME: "${{ inputs.pkg_name }}"
        KEY_JSON: "${{ inputs.key }}"
      run: |
        set -euo pipefail

        if [ -z "$PKG_NAME" ]; then
          echo "::error::'pkg_name' is required for action=add." >&2
          exit 1
        fi

        if ! jq -e 'type == "object"' <<< "$KEY_JSON" >/dev/null 2>&1; then
          echo "::error::inputs.key must be a valid JSON object." >&2
          exit 1
        fi
        
        if [ -f "$JSON_PATH" ]; then
          jq --arg pkg "$PKG_NAME" --argjson val "$KEY_JSON" '
            if has($pkg) then . else . + {($pkg): $val} end
          ' "$JSON_PATH" > "${JSON_PATH}.tmp" && mv "${JSON_PATH}.tmp" "$JSON_PATH"
        else
          echo "new_json=$(jq --arg pkg "$PKG_NAME" --argjson val "$KEY_JSON" '
            if has($pkg) then . else . + {($pkg): $val} end
          ' <<< "$JSON_PATH")" >> "$GITHUB_OUTPUT"
        fi

    - name: Update package entry
      id: add_update_pkg
      if: inputs.action == 'update' && inputs.pkg_name != '' && inputs.key != '' && inputs.value != ''
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        PKG_NAME: "${{ inputs.pkg_name }}"
        ACTION: "${{ inputs.action }}"
        KEY: "${{ inputs.key }}"
        VALUE: "${{ inputs.value }}"
      run: |
        set -euo pipefail
        
        if [ -f "$JSON_PATH" ]; then
          jq --arg pkg "$PKG_NAME" --arg key "$KEY" --arg value "$VALUE" \
            'if has($pkg) then .[$pkg][$key] = $value else . end' \
            "$JSON_PATH" > "${JSON_PATH}.tmp" && mv "${JSON_PATH}.tmp" "$JSON_PATH"
        elif [ ! -f "$JSON_PATH" ]; then
          echo "new_json=$(jq --arg pkg "$PKG_NAME" --arg key "$KEY" --arg value "$VALUE" \
            'if has($pkg) then .[$pkg][$key] = $value else . + {($pkg): {($key): $value}} end' \
            <<< "$JSON_PATH")" >> "$GITHUB_OUTPUT"
        else
          echo "::error::File '$JSON_PATH' does not exist for update." >&2
          exit 1
        fi
        
        echo "::notice::Updated '$JSON_PATH' with package '$PKG_NAME' ($KEY=$VALUE) for action '$ACTION'"

    - name: Remove package entry
      id: remove_pkg
      if: inputs.action == 'remove' || inputs.action == 'delete'
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        PKG_NAME: "${{ inputs.pkg_name }}"
        ACTION: "${{ inputs.action }}"
        KEY: "${{ inputs.key }}"
      run: |
        set -euo pipefail

        if [[ -z "$KEY" && -f "$JSON_PATH" ]]; then
          jq --arg pkg "$PKG_NAME" 'del(.[$pkg])' "$JSON_PATH" > "${JSON_PATH}.tmp" && mv "${JSON_PATH}.tmp" "$JSON_PATH"
          echo "::notice::Removed package '$PKG_NAME' from '$JSON_PATH'"
        elif [[ -n "$KEY" && -f "$JSON_PATH" ]]; then
          jq --arg pkg "$PKG_NAME" --arg key "$KEY" 'del(.[$pkg][$key])' "$JSON_PATH" > "${JSON_PATH}.tmp" && mv "${JSON_PATH}.tmp" "$JSON_PATH"
            echo "::notice::Removed key '$KEY' from package '$PKG_NAME' in '$JSON_PATH'"
        elif [[ -z "$KEY" && ! -f "$JSON_PATH" ]]; then
          echo "new_json=$(jq --arg pkg "$PKG_NAME" 'del(.[$pkg])' <<< "$JSON_PATH")" >> "$GITHUB_OUTPUT"
          echo "::notice::Removed package '$PKG_NAME' from inline JSON input"
        elif [[ -n "$KEY" && ! -f "$JSON_PATH" ]]; then
          echo "new_json=$(jq --arg pkg "$PKG_NAME" --arg key "$KEY" 'del(.[$pkg][$key])' <<< "$JSON_PATH")" >> "$GITHUB_OUTPUT"
          echo "::notice::Removed key '$KEY' from package '$PKG_NAME' in inline JSON input"
        fi

    - name: Get all packages with key == value
      id: get_packages_by_key_value
      if: inputs.action == 'get' && inputs.key != '' && inputs.value != '' && inputs.pkg_name == ''
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        KEY: "${{ inputs.key }}"
        VALUE: "${{ inputs.value }}"
      run: |
        set -euo pipefail

        echo "::notice::Finding packages in '$JSON_PATH' where '$KEY' == '$VALUE'"
        
        if [ -f "$JSON_PATH" ]; then
          matching_packages=$(jq -r --arg key "$KEY" --arg value "$VALUE" 'to_entries[] | select(.value[$key] == $value) | .key' "$JSON_PATH")
        elif [ ! -f "$JSON_PATH" ]; then
          matching_packages=$(jq -r --arg key "$KEY" --arg value "$VALUE" 'to_entries[] | select(.value[$key] == $value) | .key' <<< "$JSON_PATH")
        else
          echo "::error::File '$JSON_PATH' does not exist for get action." >&2
          exit 1
        fi
        
        echo "packages<<EOF"
        echo "$matching_packages"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Get all packages with key present
      id: get_packages_by_key
      if: inputs.action == 'get' && inputs.key != '' && inputs.value == '' && inputs.pkg_name == ''
      shell: bash
      env:
        JSON_PATH: "${{ inputs.path }}"
        KEY: "${{ inputs.key }}"
      run: |
        set -euo pipefail

        echo "::notice::Finding packages in '$JSON_PATH' where key '$KEY' is present"
        
        if [ -f "$JSON_PATH" ]; then
          matching_packages=$(jq -r --arg key "$KEY" 'to_entries[] | select(.value[$key] != null) | .key // empty' "$JSON_PATH")
        elif [ ! -f "$JSON_PATH" ]; then
          matching_packages=$(jq -r --arg key "$KEY" 'to_entries[] | select(.value[$key] != null) | .key // empty' <<< "$JSON_PATH")
        else
          echo "::error::File '$JSON_PATH' does not exist for get action." >&2
          exit 1
        fi

        echo "packages<<EOF"
        echo "$matching_packages"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Save updated JSON to inline again
      id: save_updated_json
      if: steps.validate_inputs.outputs.inline_json == 'true' && 
         (steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json)
      uses: ./store-as-variable
      env:
         GH_TOKEN: ${{ inputs.github_token || env.GH_TOKEN || env.GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      with:
        value: ${{ steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json || '' }}
        variable_name: ${{ inputs.variable_name }}
        variable_type: 'org'

    - name: Set step output for updated JSON
      id: set_output_updated_json
      if: inputs.steps_out == 'true' && 
          steps.validate_inputs.outputs.inline_json == 'true' && 
         (steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json)
      shell: bash
      run: |
        set -euo pipefail

        echo "updated_json<<EOF"
        echo "${{ steps.add_pkg.outputs.new_json || steps.add_update_pkg.outputs.new_json || steps.remove_pkg.outputs.new_json || '' }}"
        echo "EOF" >> "$GITHUB_STEP_SUMMARY"
