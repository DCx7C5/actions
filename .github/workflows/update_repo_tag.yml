on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old tag (if exists)
        shell: bash
        run: |
          set -euo pipefail
          OLD_TAG="v1"
            
          if git rev-parse "$OLD_TAG" >/dev/null 2>&1; then
            echo "Deleting local tag $OLD_TAG"
            git tag --delete "$OLD_TAG"
          fi
            
          git push origin --delete "$OLD_TAG" 2>/dev/null || true
          echo "Old tag $OLD_TAG removed (or didn't exist)"

      - name: Create new Tag and Release
        uses: DCx7C5/actions/create-tag-and-release@v1
        with:
          version: "v1"
