name: "Configure GitHub clients for GPG signing"
description: "Configure GitHub (git & gh) client for GPG signing from GitHub Actions"
author: "DCx7C5"

inputs:
  fingerprint:
    description: "Fingerprint of the GPG key to use for signing (optional, will use default key if not provided)"
    required: false


outputs:
  fingerprint:
    description: "Fingerprint of the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.fingerprint }}
  name:
    description: "Name associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_name }}
  email:
    description: "Email associated with the GPG key used for signing"
    value: ${{ steps.parse_gpg.outputs.gpg_mail }}


runs:
  using: composite
  steps:
    - name: Mask sensitive inputs
      shell: bash
      if: inputs.fingerprint != ''
      run: |
        echo "::add-mask::${{ inputs.fingerprint }}"

    - name: Parse Key Credentials
      id: parse_gpg
      shell: bash
      env:
        FINGERPRINT: ${{ inputs.fingerprint }}
      run: |
        set -euo pipefail
        
        if [[ -n "$FINGERPRINT" ]]; then
          UID_LINE=$(gpg --with-colons --list-keys "$FINGERPRINT" | grep '^uid:')
        else
          UID_LINE=$(gpg --with-colons --list-keys | grep '^uid:' | head -1)
          FINGERPRINT=$(gpg --with-colons --list-keys | grep '^fpr:' | head -1 | cut -d: -f10)
        fi
        
        if [ -z "$UID_LINE" ]; then
          echo "::warning::Could not find uid for key $FINGERPRINT" >&2
          GPG_NAME="GitHub Actions"
          GPG_MAIL="actions@github.com"
        else
          UID_DECODED=$(echo "$UID_LINE" | cut -d: -f10 | sed 's/%20/ /g; s/%3C/</g; s/%3E/>/g; s/%40/@/g')
          
          if [[ "$UID_DECODED" =~ ^([^<]+)[[:space:]]+\<(.*)\>$ ]]; then
            GPG_NAME="${BASH_REMATCH[1]//^[[:space:]]+|[[:space:]]+$/}"  # trim spaces
            GPG_MAIL="${BASH_REMATCH[2]}"
          else
            echo "::warning::Could not parse name/email from: $UID_DECODED" >&2
            GPG_NAME="Unknown User"
            GPG_MAIL="unknown@example.com"
          fi
        fi
        
        if ! command -v gh &> /dev/null; then
          echo "gh_cli=false" >> $GITHUB_OUTPUT
        else
          echo "gh_cli=true" >> $GITHUB_OUTPUT
        fi
        
        echo "gpg_name=$GPG_NAME" >> $GITHUB_OUTPUT
        echo "gpg_mail=$GPG_MAIL" >> $GITHUB_OUTPUT
        echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT

    - name: Configure git for GPG signing
      id: gitconfig
      shell: bash
      run: |
        set -euo pipefail
        
        git config --global user.name "${{ steps.parse_gpg.outputs.gpg_name }}"
        git config --global user.email "${{ steps.parse_gpg.outputs.gpg_mail }}"
        git config --global user.signingkey "${{ steps.parse_gpg.outputs.fingerprint }}"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true
        git config --global tag.forceSignAnnotated true
        git config --global gpg.program gpg
        
        echo "Configured git with GPG key: ${{ steps.parse_gpg.outputs.fingerprint }} (${GPG_NAME} <${GPG_MAIL}>)"

    - name: Configure gh for GPG signing
      if: steps.parse_gpg.outputs.gh_cli == 'true'
      id: ghconfig
      shell: bash
      run: |
        set -euo pipefail
        
        gh config set -h github.com gpg_key_id "${{ steps.parse_gpg.outputs.fingerprint }}"
        gh config set -h github.com git_protocol https
        
        echo "Configured gh CLI with GPG key: ${{ steps.parse_gpg.outputs.fingerprint }} (${GPG_NAME} <${GPG_MAIL}>)"
