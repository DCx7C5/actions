name: "Store  As GitHub Secret"
description: "Store GPG key as GitHub Secret from GitHub Actions with security hardening"
author: "DCx7C5"

inputs:
  public:
    required: false
    default: 'true'
    description: "Stores public key as GitHub Secret"
  private:
    required: false
    default: 'false'
    description: "Stores private key as GitHub Secret"
  fingerprint:
    required: true
    description: "Fingerprint of GPG key to store (optional, defaults to first key)"


runs:
  using: composite
  steps:
    - name: Validate GPG key exists
      id: validate_key
      shell: bash
      run: |
        set -euo pipefail
    
