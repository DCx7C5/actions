name: "Import GPG Keys from Files"
description: "Import GPG keys from local files"
author: "DCx7C5"

branding:
  icon: "lock"
  color: "blue"

inputs:
  gpg_key:
    required: false
    default: ''
    description: "Path to GPG key file"
  pass:
    required: false
    default: ''
    description: "Passphrase for the private key - will be masked in logs"
  delete_after_import:
    required: false
    default: 'true'
    description: "Securely delete private key file after import"
  gpg_type:
    required: false
    default: 'auto'
    description: "Type of GPG key to import (auto, private, public) - auto-detects based on file content"


outputs:
  fingerprint:
    description: "Fingerprint of the imported private GPG key"
    value: ${{ steps.import_protected.outputs.fingerprint || steps.import_unprotected.outputs.fingerprint }}
  keys_total:
    description: "Total number of GPG keys available"
    value: ${{ steps.import_protected.outputs.keys_total || steps.import_unprotected.outputs.keys_total }}
  keys_public:
    description: "Number of public keys"
    value: ${{ steps.import_protected.outputs.keys_public || steps.import_unprotected.outputs.keys_public }}
  keys_secret:
    description: "Number of secret keys"
    value: ${{ steps.import_protected.outputs.keys_secret || steps.import_unprotected.outputs.keys_secret }}


runs:
  using: composite
  steps:

    - name: Validate inputs and environment
      id: mask_and_validate
      shell: bash
      run: |
        set -euo pipefail
        
        if [ -n '${{ inputs.pass }}' ]; then
          echo "::add-mask::${{ inputs.pass }}"
        fi
        
        if [ -z "${GNUPGHOME:-}" ] || [ ! -d "${GNUPGHOME}" ]; then
          echo "::error::GNUPGHOME not set or does not exist: ${GNUPGHOME:-'(empty)'}" >&2
          exit 1
        fi
        
        if [ -z '${{ inputs.gpg_priv }}' ] && [ -z '${{ inputs.gpg_pub }}' ]; then
          echo "::error::Either gpg_priv or gpg_pub input is required" >&2
          exit 1
        fi
        
        if [ -n '${{ inputs.gpg_priv }}' ] && [ -z '${{ inputs.pass }}' ]; then
          echo "::error::pass (passphrase) is required when importing a private key from file" >&2
          exit 1
        fi

    - name: Determine import method
      id: determine_method
      if: inputs.gpg_type == 'auto'
      shell: bash
      env:
        GPG_PRIV: '${{ inputs.gpg_priv }}'
        GPG_PUB: '${{ inputs.gpg_pub }}'
      run: |
        if [ -n "$GPG_PRIV" ]; then
          echo "import_method=private" >> "$GITHUB_OUTPUT"
        elif [ -n "$GPG_PUB" ]; then
          echo "import_method=public" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No valid GPG key input provided" >&2
          exit 1
        fi

    - name: Import Protected Key
      id: import_protected
      if: inputs.gpg_type == 'private' || steps.mask_and_validate.outputs.import_method == 'private'
      uses: ./gpg-import/gpg-import-protected
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      with:
        gpg_key: '${{ inputs.gpg_key }}'
        pass: '${{ inputs.pass }}'
        type: 'file'

    - name: Import Unprotected Key
      id: import_unprotected
      if: inputs.gpg_type == 'public' || steps.mask_and_validate.outputs.import_method == 'public'
      uses: ./gpg-import/gpg-import-no-protection
      env:
        GNUPGHOME: ${{ inputs.gpg_home || env.GNUPGHOME }}
      with:
        gpg_key: '${{ inputs.gpg_key }}'
