name: "Test JSON Packages"

on:
  workflow_dispatch:
    inputs:
      pkgnames:
        description: "newline-separated list of package names to test (default: all packages in .ci/packages.json)"
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - ./aur-json-packages/action.yml
      - ./aur-json-packages/libpackages.sh
      - .github/workflows/test_json_pkgs.yml


jobs:
  test-json-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: 'DystopianOS'

      - uses: actions/checkout@v6
        with:
          token: '${{ steps.app_token.outputs.token }}'

      - name: get_all_packages
        id: get_all
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          json_in: 'JSON_PACKAGES'

      - name: get_packages_with_pkgnames
        id: get_all_keys
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          json_in: 'JSON_PACKAGES'
          key: |
            submodule
            custom
            remote_dir

      - name: get_packages_with_pkgnames
        id: get_pkgs
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          json_in: 'JSON_PACKAGES'
          pkg_name: |
            nvidia
            toolchain

      - name: get_packages_with_pkgname_and_keys
        id: get_pkgs_keys
        uses: ./aur-json-packages
        with:
          action: 'get'
          org: 'DystopianOS'
          gh-token: ${{ steps.app_token.outputs.token }}
          json_in: 'JSON_PACKAGES'
          pkg_name: |
            nvidia
            toolchain
          key: |
            submodule
            custom
            remote_dir


      - id: check3
        run: |
          echo "Checking outputs..." >> "$GITHUB_STEP_SUMMARY"
          
          {
            echo '##### Args (get_all):'
            echo '```bash'
            echo "${{ steps.get_all.outputs.debug-args }} ${{ steps.get_all.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_all.outputs.out }}' | jq -c
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_all_keys):'
            echo '```bash'
            echo "${{ steps.get_all_keys.outputs.debug-args }} ${{ steps.get_all_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_all_keys.outputs.out }}' | jq -c
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_pkgs):'
            echo '```bash'
            echo "${{ steps.get_pkgs.outputs.debug-args }} ${{ steps.get_pkgs.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_pkgs.outputs.out }}' | jq -c
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '##### Args (get_pkgs_keys):'
            echo '```bash'
            echo "${{ steps.get_pkgs_keys.outputs.debug-args }} ${{ steps.get_pkgs_keys.outputs.debug-filter}}"
            echo '```'
            echo '```json'
            echo '${{ steps.get_pkgs_keys.outputs.out }}' | jq -c
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"